<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高压压铸 DFM 报告自动生成工具 · A13版</title>
<!-- PptxGenJS（含 JSZip，兼容 Office / WPS） -->
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  /* ===== 设计令牌 · DFM Pro 极简现代 SaaS ===== */
  /* 极浅蓝白基底（更接近图片的明亮感） */
  --bg:#f5f7fa;
  --surface:#ffffff;
  --surface-2:#fafbfd;
  --surface-3:#eef2f7;
  --border:#e5e9ef;
  --border-2:#cbd5e1;
  --border-3:#eef2f6;

  /* 文字 */
  --text:#0f172a;
  --text-2:#64748b;
  --text-3:#94a3b8;

  /* 品牌橙（唯一强调色） */
  --brand:#ff6a00;
  --brand-2:#c2410c;
  --brand-soft:rgba(255,106,0,.06);
  --brand-soft-2:rgba(255,106,0,.12);
  --brand-line:rgba(255,106,0,.24);

  /* 公式区特殊色 · 暖色块 */
  --formula-bg:#fdf4ed;
  --formula-bd:#f3d4b4;

  /* 计算结果区 · 淡蓝 */
  --result-bg:#f4f7fb;
  --result-bd:#dde5ef;

  /* 顶栏 · 浅色 */
  --ink:#ffffff;
  --ink-line:#e5e9ef;

  /* 语义色 */
  --ok:#17803d;    --ok-bg:#ecfdf3;   --ok-bd:#a7e3c0;
  --warn:#8a5a00;  --warn-bg:#fffbeb; --warn-bd:#f1d28a;
  --bad:#c2410c;   --bad-bg:#fdf3ed;  --bad-bd:#f3bca7;
  --info:#1f5f8b;  --info-bg:#eff4fb; --info-bd:#b3cde3;

  /* 计算结果数值 */
  --value:#c62828;

  /* 形态 · 略大圆角更轻盈 */
  --r:10px;
  --r-sm:7px;
  --shadow:0 1px 2px rgba(15,23,42,.04);
  --shadow-2:0 4px 12px rgba(15,23,42,.06);
  --t:150ms ease;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.65;
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC","Heiti SC","Hiragino Sans GB","Source Han Sans SC","WenQuanYi Micro Hei","Segoe UI","Inter",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
input,select,textarea,button{font-family:inherit;font-size:13.5px;color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c8d2df;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--brand-2)}

/* ===== 顶部固定条（浅色 · 极简） ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:80;display:flex;align-items:center;gap:10px;
  padding:0 24px;background:var(--ink);color:var(--text);border-bottom:1px solid var(--ink-line);
  box-shadow:0 1px 2px rgba(15,23,42,.04)}
.topbar .logo{display:flex;align-items:baseline;gap:10px;white-space:nowrap;color:var(--text);flex-shrink:0}
.topbar .logo b{font-size:15px;font-weight:700;letter-spacing:.2px;color:var(--text)}
.topbar .logo .ver{font-size:11px;color:var(--brand);border:1px solid var(--brand-line);
  padding:1px 8px;border-radius:11px;font-weight:600}
.spacer{flex:1}
.tb-actions{display:flex;gap:7px;flex-wrap:nowrap;align-items:center;flex-shrink:0}
.btn{border:1px solid var(--border-2);background:var(--surface);color:#33465a;border-radius:var(--r-sm);
  padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;transition:var(--t);text-decoration:none}
.btn:hover{border-color:var(--brand);color:var(--brand-2);background:var(--brand-soft)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.gh{background:transparent;border-color:var(--border-2);color:var(--text-2)}
.btn.gh:hover{background:var(--surface-2);border-color:var(--brand);color:var(--brand-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{background:#f56f0c;border-color:#f56f0c;color:#fff}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.dg:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .lbl{flex:0 1 auto}
@media(max-width:1600px){.btn .lbl{display:none}.tb-actions{gap:5px}}

/* ===== 布局 ===== */
#nav{position:fixed;top:60px;left:0;bottom:0;width:224px;overflow-y:auto;background:var(--surface);
  border-right:1px solid var(--border-3);z-index:70;padding:12px 0 60px}
#main{margin:60px 0 0 224px;padding:22px 32px 120px;max-width:1440px}
.nav-bg{position:fixed;inset:60px 0 0 0;background:rgba(15,23,42,.4);z-index:60;display:none}
.nav-bg.show{display:block}
@media(max-width:960px){
  #nav{transform:translateX(-100%);transition:transform .22s ease;width:280px;box-shadow:4px 0 24px rgba(15,23,42,.16)}
  #nav.show{transform:none}
  #main{margin-left:0}
  .nav-bg.show{display:block}
  .hamburger{display:inline-flex !important}
}
.hamburger{display:none}

/* ===== 导航树（极简 · 单色） ===== */
.nav-mod{border-bottom:1px solid var(--border-3)}
.nav-mod > .nh{position:relative;display:flex;align-items:center;gap:9px;padding:11px 16px;cursor:pointer;user-select:none;
  font-size:13.5px;font-weight:500;color:var(--text-2);transition:var(--t)}
.nav-mod > .nh:hover{background:var(--surface-2);color:var(--text)}
.nav-mod.open > .nh{color:var(--text);font-weight:600}
.nav-mod.open > .nh .ar{transform:rotate(90deg)}
.nav-mod.active > .nh{background:var(--brand-soft);color:var(--brand-2);font-weight:600}
.nav-mod > .nh .ar{margin-left:auto;font-size:10px;color:var(--text-3);transition:var(--t)}
.nav-sub{display:none;padding:2px 0 8px 16px}
.nav-mod.open > .nav-sub{display:block}
.nav-sub a{display:block;padding:7px 14px;font-size:13px;color:var(--text-2);text-decoration:none;
  border-radius:6px;transition:var(--t)}
.nav-sub a:hover{background:var(--surface-2);color:var(--text)}
.nav-sub a.active{background:var(--brand-soft);color:var(--brand-2);font-weight:600}
.nav-tip{padding:10px 16px;font-size:11px;color:var(--text-3)}
.nav-foot{padding:12px 16px;font-size:11px;color:var(--text-3);line-height:1.7}

/* ===== 面包屑 ===== */
.breadcrumb{font-size:12.5px;color:var(--text-3);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.breadcrumb i{font-style:normal;color:var(--text-3);opacity:.6}
.breadcrumb span:last-child{color:var(--text);font-weight:500}

/* ===== 模块标题（更大 · 轻盈） ===== */
.mod-hd{margin:6px 0 18px;padding:0}
.mod-hd h2{margin:0;font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.mod-hd p{margin:6px 0 0;font-size:13px;color:var(--text-2)}

/* ===== 卡片（大间距 · 大圆角 · 轻盈） ===== */
.card{background:var(--surface);border:1px solid var(--border-3);border-radius:var(--r);margin:0 0 16px;overflow:hidden;
  box-shadow:var(--shadow);transition:border-color var(--t)}
.card:hover{border-color:var(--border-2)}
.card > h3{margin:0;padding:13px 18px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;user-select:none;
  background:var(--surface);border-bottom:1px solid var(--border-3);
  display:flex;align-items:center;gap:10px}
.card > h3 .tag{font-size:11px;font-weight:500;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border-3);
  padding:2px 8px;border-radius:11px}
.card > h3 .sp{flex:1}
.card > h3 .cv{margin-left:2px;font-size:11px;color:var(--text-3);transition:transform var(--t);flex-shrink:0}
.card.collapsed > h3{border-bottom-color:transparent}
.card.collapsed > .body{display:none}
.card.collapsed > h3 .cv{transform:rotate(-90deg)}
.card .body{padding:18px 20px}
.scroll-anchor{scroll-margin-top:80px}

/* ===== 表单 · 传统边框输入框 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,238px),1fr));gap:12px 14px}
.grid.one{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:12px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:4px}
.field > label .u{color:var(--text-3);font-size:11px;font-weight:400}
.field .u{color:var(--text-3);font-size:11px}
.inp{width:100%;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:6px 9px;
  color:var(--text);outline:none;transition:var(--t);font-size:13px;font-weight:400;line-height:1.5}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
select.inp{cursor:pointer}
textarea.inp{min-height:64px;resize:vertical;line-height:1.6}
input[type=file]{font-size:11.5px}
.hint{font-size:11px;color:var(--text-3);line-height:1.5}
.note{background:var(--surface-2);border:1px solid var(--border-3);border-left:3px solid var(--brand);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 14px;font-size:12.5px;color:var(--text-2);line-height:1.7}
.note b{color:var(--brand-2)}

/* ===== 公式区（暖色块 · 居中） ===== */
.formula{background:var(--formula-bg);border:1px solid var(--formula-bd);border-left:3px solid var(--brand);
  border-radius:var(--r-sm);padding:18px 22px;font-size:13.5px;color:#5c3a1a;margin:2px 0 12px;
  text-align:center;line-height:1.9;white-space:normal}
.formula b{color:var(--brand-2)}
.formula div{margin:4px 0}

/* ===== 计算结果（淡蓝块 · 大字） ===== */
.result{background:var(--result-bg);border:1px solid var(--result-bd);border-left:3px solid var(--brand);
  border-radius:var(--r-sm);padding:16px 18px;margin-top:4px}
.result h4{margin:0 0 12px;font-size:13px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:8px;
  letter-spacing:0}
.result h4 .st{margin-left:auto;color:var(--text-3);font-size:11px;font-weight:400}
.rv{color:var(--value);font-weight:700;font-size:22px;font-family:Consolas,ui-monospace,monospace;
  letter-spacing:-.3px}
.rv-s{color:var(--value);font-weight:700;font-family:Consolas,ui-monospace,monospace}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:9px 18px;margin-top:8px}
.kv .k{font-size:12px;color:var(--text-2)}
.kv .v{font-size:13px;color:var(--text);font-weight:500}

/* ===== 状态提示（告警条） ===== */
.verdict{margin-top:10px;padding:9px 14px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.65;display:flex;align-items:flex-start;gap:8px}
.v-ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}
.v-warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn)}
.v-bad{background:var(--bad-bg);border:1px solid var(--bad-bd);color:var(--bad)}
.v-info{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-info{background:var(--surface-3);color:var(--text-2)}

/* ===== 表格 ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border-3);border-radius:var(--r-sm);background:var(--surface)}
table.ed{border-collapse:collapse;width:100%;font-size:12px;min-width:520px}
table.ed th{background:var(--surface-2);color:var(--text-2);font-weight:600;padding:7px 8px;text-align:left;
  border:1px solid var(--border-3);white-space:nowrap;font-size:11.5px}
table.ed td{border:1px solid var(--border-3);padding:2px 3px;transition:background var(--t)}
table.ed tbody tr:hover td{background:var(--brand-soft)}
table.ed td input.inp,table.ed td select.inp{border:0;background:transparent;padding:4px 5px;border-radius:0;font-size:12px;font-weight:400}
table.ed td input.inp:focus,table.ed td select.inp:focus{box-shadow:none;background:var(--brand-soft)}
table.ed td.num{text-align:right;font-family:Consolas,monospace}
.tbl-bar{display:flex;gap:6px;align-items:center;padding:8px 0 6px;flex-wrap:wrap}
table.ro{border-collapse:collapse;width:100%;font-size:12px}
table.ro th{background:var(--surface-2);color:var(--text-2);padding:6px 8px;border:1px solid var(--border-3);
  font-weight:600;text-align:left;font-size:11.5px;white-space:nowrap}
table.ro td{padding:6px 8px;border:1px solid var(--border-3);text-align:left;transition:background var(--t)}
table.ro td.n{text-align:right;font-family:Consolas,monospace}
table.ro tbody tr:hover td{background:var(--surface-2)}
table.ro tr:nth-child(even) td{background:#fafcfd}
table.ro td.hi{color:var(--value);font-weight:700;font-family:Consolas,monospace}

/* ===== 图片 ===== */
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* 问题清单卡片 */
.issue-card{border:1px solid var(--border-3);border-radius:var(--r);background:var(--surface);
  margin:12px 0;padding:0;overflow:hidden}
.issue-card .ic-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--border-3)}
.issue-card .ic-hd .sp{flex:1}
.issue-card .ic-no{font-weight:600;color:var(--brand-2);font-size:13px}
.issue-card .ic-lb{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.issue-card .ic-lb .inp{width:auto;min-width:64px;padding:4px 7px;font-size:12px}
.issue-card .ic-lb select.inp{min-width:112px}
.issue-card .ic-no-inp{width:58px!important;min-width:58px!important}
.issue-card .ic-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 14px 4px}
.issue-card .ic-f label{font-size:12px;color:var(--text-2);margin-bottom:5px;display:block}
.issue-card .ic-f textarea.inp{min-height:76px;resize:vertical;line-height:1.6;font-size:12.5px}
.issue-card .ic-imgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 14px 14px}
.issue-card .ic-img{border:1px solid var(--border-3);border-radius:var(--r-sm);padding:10px;background:var(--surface-2)}
.issue-card .ic-img-hd{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.issue-card .ic-img .imgs{margin-top:0}
@media (max-width:900px){
  .issue-card .ic-fields{grid-template-columns:1fr}
  .issue-card .ic-imgs{grid-template-columns:1fr}
}
.imgs .thumb{position:relative;width:128px;height:90px;border:1px solid var(--border-2);border-radius:var(--r-sm);
  overflow:hidden;background:var(--surface-3);cursor:zoom-in}
.imgs .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgs .thumb .del{position:absolute;top:2px;right:2px;background:rgba(15,23,42,.6);color:#fff;border:0;
  border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:20px;padding:0}
.imgs .thumb .del:hover{background:var(--bad)}
.imgs .add{width:128px;height:90px;border:1px dashed var(--border-2);border-radius:var(--r-sm);display:grid;
  place-items:center;color:var(--text-3);font-size:11.5px;cursor:pointer;background:var(--surface-2);text-align:center;padding:6px}
.imgs .add:hover{border-color:var(--brand);color:var(--brand-2);background:var(--brand-soft)}
/* 视频上传框 */
.vids{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.vids .vthumb{position:relative;width:260px;border:1px solid var(--border-2);border-radius:var(--r-sm);
  overflow:hidden;background:#0b1220}
.vids .vthumb video{width:100%;height:146px;display:block;object-fit:contain;background:#0b1220}
.vids .vthumb .del{position:absolute;top:4px;right:4px;background:rgba(15,23,42,.72);color:#fff;border:0;
  border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:20px;padding:0}
.vids .vthumb .del:hover{background:var(--bad)}
.vids .add{width:260px;height:146px;border:1px dashed var(--border-2);border-radius:var(--r-sm);display:grid;
  place-items:center;color:var(--text-3);font-size:11.5px;cursor:pointer;background:var(--surface-2);text-align:center;padding:6px}
.vids .add:hover{border-color:var(--brand);color:var(--brand-2);background:var(--brand-soft)}

/* ===== 视觉检测（模流缺陷标注） ===== */
/* ---------- 当前机型摘要条（各模块内可见的「调用了什么」） ---------- */
.msum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;margin:0 0 8px;
  border:1px solid var(--border-3);border-left:3px solid var(--accent);border-radius:var(--r-sm);
  background:var(--surface-2);font-size:12px;line-height:1.6}
.msum b{color:var(--accent)}
.msum .tag2{display:inline-block;padding:1px 6px;border-radius:3px;background:var(--surface);
  border:1px solid var(--border-2);color:var(--text-2);white-space:nowrap}
.msum .btn{margin-left:auto}

/* ---------- 压铸机参数库 弹窗 ---------- */
#machMask{position:fixed;inset:0;z-index:220;display:none;background:rgba(15,23,42,.55);
  backdrop-filter:blur(2px);padding:24px 16px;overflow:auto}
#machMask.on{display:block}
#machMask .mbox{max-width:1180px;margin:0 auto;background:var(--surface);border-radius:var(--r);
  box-shadow:0 24px 60px rgba(15,23,42,.35);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
#machMask .mhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;
  background:var(--surface-2);border-bottom:1px solid var(--border-3)}
#machMask .mhd b{font-size:14px}
#machMask .mhd .mcnt{font-size:12px;color:var(--text-2)}
#machMask .mhint{padding:9px 16px;font-size:12px;color:var(--text-2);line-height:1.7;
  border-bottom:1px solid var(--border-3);background:var(--surface)}
#machMask .mhint em{color:var(--accent);font-style:normal;font-weight:700}
#machMask .mbody{padding:12px 16px 16px;overflow:auto}
#machMask .mtbl-wrap{overflow-x:auto;border:1px solid var(--border-3);border-radius:var(--r-sm)}
table.mtbl{border-collapse:collapse;width:100%;min-width:1080px;font-size:12px}
table.mtbl th,table.mtbl td{border-bottom:1px solid var(--border-3);border-right:1px solid var(--border-3);
  padding:4px 6px;text-align:left;vertical-align:middle;white-space:nowrap}
table.mtbl th{background:var(--surface-2);font-weight:600;position:sticky;top:0;z-index:2;
  color:var(--text-2);font-size:11.5px}
table.mtbl tbody tr:hover{background:var(--surface-2)}
table.mtbl tbody tr.cur{background:var(--accent-soft, rgba(255,106,0,.07))}
table.mtbl td input{width:100%;min-width:52px;border:1px solid transparent;background:transparent;
  border-radius:3px;padding:3px 4px;font:inherit;color:inherit}
table.mtbl td input:hover{border-color:var(--border-2)}
table.mtbl td input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft, rgba(255,106,0,.15))}
table.mtbl td input.w-brand{min-width:92px}
table.mtbl td input.w-model{min-width:118px}
table.mtbl td input.w-punch{min-width:130px}
table.mtbl td input.w-empty{background:repeating-linear-gradient(135deg,transparent,transparent 5px,rgba(220,38,38,.10) 5px,rgba(220,38,38,.10) 10px)}
table.mtbl td.act{text-align:center;white-space:nowrap}
table.mtbl .mk{color:var(--accent);font-size:10px;margin-left:2px}
.mact{display:inline-flex;gap:3px}
.mact button{border:1px solid var(--border-2);background:var(--surface);border-radius:4px;
  padding:2px 6px;font-size:11px;cursor:pointer;color:var(--text-2)}
.mact button:hover{border-color:var(--accent);color:var(--accent)}

<script>
"use strict";
/* =========================================================================
 *  高压压铸 DFM 报告自动生成工具 —— 单文件纯前端版

/* 运行时库（优先取用户维护的 S.mach，为空则用出厂默认） */
function machAll(){
  if(S && S.mach && S.mach.list && S.mach.list.length) return S.mach.list;
  return DEFAULT_MACHINES;
}
function machById(id){ var L=machAll(); for(var i=0;i<L.length;i++){ if(L[i].brand+' '+L[i].model===id) return L[i]; } return null; }
function machIndex(id){ var L=machAll(); for(var i=0;i<L.length;i++){ if(L[i].brand+' '+L[i].model===id) return i; } return -1; }
/* 机型唯一键：品牌 + 空格 + 型号 */
function machKey(m){ return m.brand+' '+m.model; }
/* 深拷贝一份出厂库（用于初始化 / 恢复出厂） */
function defaultMachCopy(){ return JSON.parse(JSON.stringify(DEFAULT_MACHINES)); }
/* 标准化一个机型对象：补全缺失字段，数字字段转数字 */
var MACH_FIELDS=[
  ['brand',''],['model',''],['ton',0],['lock',0],['open',0],['moldMin',0],['moldMax',0],
  ['tie',''],['tieDia',0],['plate',''],['injForce',0],['injStroke',0],['punch',[]],['v0',0],
  ['ejForce',0],['ejStroke',0]
];
var MACH_NUM={ton:1,lock:1,open:1,moldMin:1,moldMax:1,tieDia:1,injForce:1,injStroke:1,v0:1,ejForce:1,ejStroke:1};
function normMachine(m){
  m = m || {};
  var o={};
  MACH_FIELDS.forEach(function(p){
    var k=p[0], dv=p[1];
    if(k==='punch'){
      var arr = Array.isArray(m.punch) ? m.punch : (typeof m.punch==='string' ? m.punch.split(/[\/、,，\s]+/) : []);
      o.punch = arr.map(function(x){ return num(x); }).filter(function(x){ return x>0; });
    } else if(MACH_NUM[k]){
      o[k] = num(m[k]);
    } else {
      o[k] = (m[k]===undefined||m[k]===null) ? dv : String(m[k]);
    }
  });
  return o;
}
/* 校验机型是否可用于计算（型号 + 锁模力必填） */
function machValid(m){
  return !!(m && String(m.brand||'').trim() && String(m.model||'').trim() && num(m.lock)>0);
}
/* 当前选用机型：优先 S.f.machineId 对应机型；未选 / 已失效 → 回退库内第 3 个（约 3000T 级）或首个 */
function curMachine(){
  var L = machAll();
  if(!L.length) return normMachine({brand:'（设备库为空）',model:'-',lock:0,ton:0});
  var m = machById(V('machineId'));
  return m || L[Math.min(2, L.length-1)] || L[0];
}
/* 锁模力→压铸机自动选型：返回库中锁模力 ≥ needLock(kN) 的最小机型；无则返回最大机型 */
function recommendMachine(need){
  if(!(need>0)) return null;
  var L=machAll();
  var best=null;
  for(var i=0;i<L.length;i++){
    var m=L[i];
    if(m.lock>=need && (!best || m.lock<best.lock)) best=m;
  }
  if(!best){ best=L[0]; for(var i=1;i<L.length;i++) if(L[i].lock>best.lock) best=L[i]; }
  return best;
}
var CALC_KEYS={aPart:1,aRunner:1,aOver:1,aSlider:1,cav:1,castP:1,useRatio:1};  // 触发自动选型的输入键
/* 写入指定机型并同步派生字段到 DOM（不重建视图，避免打断输入） */
function setMachine(m){
  S.f.machineId = m.brand+' '+m.model;
  fillMachine();
  ['lockKN','tieX','tieY','tieDia','machTon','injForce','machV0'].forEach(function(k){
    setRO(k, S.f[k]===undefined||S.f[k]===null ? '' : String(S.f[k]));
  });
  var sel = document.querySelector('[data-k="machineId"]');
  if(sel && sel.tagName==='SELECT') sel.value = S.f.machineId;
}
/* 自动匹配：仅当锁模力校核【不足】时自动升级到库中最小满足机型；满足时保持用户当前选择 */
function autoSyncMachine(){
  if(String(V('autoMach'))==='手动') return;
  var c=calcForce();
  if(!c.aTot || !(c.needLock>0)) return;
  var rec=recommendMachine(c.needLock);
  if(!rec) return;
  var cur=machById(V('machineId'));
  if(cur && cur.lock>=c.needLock) return;   // 已满足 → 不降档
  setMachine(rec);
}
/* 一键采用推荐机型（立即切换，含降档） */
function applyRecMachine(){
  var c=calcForce();
  var rec=recommendMachine(c?c.needLock:0);
  if(!rec){ toast('库内无满足锁模力的机型'); return; }
  setMachine(rec);
  save(); renderResults();
  toast('已采用推荐机型：'+rec.brand+' '+rec.model+' · '+rec.ton+'T');
}
/* rForce 内的自动选型条 */
function machRecHTML(c){
  if(!c || !c.aTot || !(c.needLock>0) || !c.rec) return '';
  var rec=c.rec, cur=V('machineId'), rid=rec.brand+' '+rec.model;
  var curM=machById(cur), curLock=curM?curM.lock:0;
  var isCur=(cur===rid);
  var ratio=rec.lock?c.fTot/rec.lock*100:0;
  var cls = isCur?'ok' : (curLock>=c.needLock?'info':'warn');
  var stTxt = isCur?'已带入选型':(curLock>=c.needLock?'可降档优化':'需更大吨位');
  var h='<div class="mrec '+cls+'"><div class="mrec-t"><b>压铸机自动选型</b> '+pill(cls, stTxt)+'</div>';
  h+='所需最小锁模力 <b>'+fmt(c.needLock,0)+' kN</b>，当前机型锁模力 <b>'+fmt(curLock,0)+' kN</b>';
  if(curLock>=c.needLock && !isCur) h+='（利用率 '+fmt(curLock?c.fTot/curLock*100:0,1)+'%）';
  h+=' → 推荐机型 <b>'+esc(rid)+' · '+rec.ton+'T</b>（锁模力 '+fmt(rec.lock,0)+' kN · 利用率 '+fmt(ratio,1)+'%）';
  if(!isCur){
    h+=' <button type="button" class="btn sm" data-automach="1">采用推荐机型</button>';
    h+='<div class="hint" style="margin-top:4px">自动模式：锁模力校核不足时自动升级到该机型；手动模式下可点按钮立即采用（含降档）。</div>';
  } else {
    h+='<div class="hint" style="margin-top:4px">已从设备库带出最小满足机型。校核不足时会自动升级，也可在下方机型下拉中手动更换。</div>';
  }
  h+='</div>';
  return h;
}

/* ============ 模流分析 10 项 ============ */
var FLOW_ITEMS = [
 {k:'f01', t:'1 速度', tip:'含壁厚 - 内浇口速度经验对照表', extra:'speedTable'},
 {k:'f02', t:'2 卷气', tip:'卷气位置与卷入量评估'},
 {k:'f03', t:'3 气压', tip:'型腔残余气压与排气能力'},
 {k:'f04', t:'4 填充温度', tip:'高/中/低温分区'},
 {k:'f05', t:'5 料液追踪', tip:'金属流前沿汇合位置'},
 {k:'f06', t:'6 固相分数', tip:'凝固顺序与固相分布'},
 {k:'f07', t:'7 氧化物', tip:'氧化夹杂聚集区域'},
 {k:'f08', t:'8 缩孔', tip:'ASTM 等级与点冷优化', extra:'astm'},
 {k:'f09', t:'9 填充率', tip:'填充完整性与短射风险'},
 {k:'f10', t:'10 热平衡与变形', tip:'模具热平衡与铸件变形'}
];
var flowGroups = FLOW_ITEMS.map(function(it){
  var flds = [];
  if(it.extra==='speedTable'){
    flds.push({type:'note', text:'壁厚 - 内浇口速度经验对照表（下表自动进入 PPT）'});
    flds.push({type:'result', r:'rGateSpeed'});
  }
  if(it.extra==='astm'){
    flds.push({type:'note', text:'缩孔等级按 ASTM E505 评定，Level 1 最优、Level 8 最差；通常要求 ≤ Level 4（关键区域 ≤ Level 2）。'});
    flds.push({k:it.k+'Astm', t:'缩孔等级（ASTM E505）', type:'select', def:'ASTM E505 Level 4', opt:ASTM_LEVELS});
    flds.push({k:it.k+'Area', t:'缩孔位置', type:'text', def:''});
    flds.push({k:it.k+'Cool', t:'点冷优化方案', type:'text', def:''});
  }
  flds.push({k:it.k+'Conc', t:'结论', type:'textarea', def:''});
  flds.push({k:it.k+'Opt',  t:'优化方案', type:'textarea', def:''});
  flds.push({k:it.k+'Img',  t:'模流分析图片（结果云图，最多 4 张 · 自动进入 PPT）', type:'images', max:4});
  flds.push({k:it.k+'Vid',  t:'模流分析视频（最多 1 个 · 仅本机留存，不进 PPT）', type:'videos', max:1});
  flds.push({k:it.k+'Def',  t:'缺陷标注与复核（视觉检测）', type:'vision', src:it.k+'Img', max:4});
  return {id:'g'+it.k, name: it.t.replace(/^\d+\s*/,''), desc:it.tip, fields:flds};
});

/* ---------- 价格库实例（挂 S.quote，随项目 localStorage 保存） ---------- */
function qDB(){
  if(!S.quote) S.quote={ db:null, sheet:[], meta:{} };
  if(!S.quote.db){
    var out=qClone(Q_DEFAULT_DB);
    out.records=qSeedRecords(out);
    S.quote.db=out;
  }
  if(!Array.isArray(S.quote.db.records) || !S.quote.db.records.length){
    S.quote.db.records=qSeedRecords(S.quote.db);
  }
  S.quote.db.records.forEach(function(r,i){ if(r.id==null) r.id=i+1; });
  if(!Array.isArray(S.quote.sheet)) S.quote.sheet=[];
  if(!S.quote.meta) S.quote.meta={};
  return S.quote.db;
}
var Q_IDX={ mold:{}, aux:{}, auxOrder:[], parts:{} };
var Q_IDX_READY=false;
/* 索引懒构建：任何计价入口调用前确保索引就绪（脏则重建） */
function qIdxReady(){
  if(!Q_IDX_READY || !Object.keys(Q_IDX.mold).length){ qBuildIndex(); }
  return Q_IDX;
}
function qBuildIndex(){
  var DB=qDB();
  Q_IDX={mold:{},aux:{},auxOrder:[],parts:{}};
  DB.records.forEach(function(r){
    if(r.cat==='模具'){ Q_IDX.mold[[r.sub,r.mat||'*',r.ton,r.diff].join('§')]=r.price; }
    else if(r.cat==='工装'){ if(!Q_IDX.aux[r.name]){ Q_IDX.aux[r.name]={}; Q_IDX.auxOrder.push(r.name); } Q_IDX.aux[r.name][r.ton]=r.price; }
    else if(r.cat==='配件'){ (Q_IDX.parts[r.sub]=Q_IDX.parts[r.sub]||[]).push(r); }
  });
  Q_IDX_READY=true;
}
function qMold(sub,mat,ton,diff){
  qIdxReady();
  function g(m){ return Q_IDX.mold[[sub,m,ton,diff].join('§')]; }
  var v=g(mat); if(v!=null) return {price:v,used:mat};
  v=g('*');     if(v!=null) return {price:v,used:'*'};
  v=g('P20');   if(v!=null) return {price:v,used:'P20'};
  return {price:null,used:null};
}
function qAux(name,tonKey){ qIdxReady(); var a=Q_IDX.aux[name]; if(!a) return null; return a[tonKey]==null?null:a[tonKey]; }
function qPartList(sub){ qIdxReady(); return Q_IDX.parts[sub]||[]; }
function qFmt(n){ return n==null?'--':Math.round(n).toLocaleString('zh-CN'); }

function qSheet(){ qDB(); return S.quote.sheet; }

function qSheetSet(key,entry){
  var sh=qSheet(), idx=-1;
  for(var i=0;i<sh.length;i++) if(sh[i].key===key){ idx=i; break; }
  if(idx>=0) sh[idx]=entry; else sh.push(entry);
  save();
  return idx;
}
function qSheetTotal(){ var n=0; qSheet().forEach(function(it){ n+=(it.unit||0)*(it.qty||0); }); return n; }

/* ---------- DFM → 报价 自动带出 ----------
 * 规则：仅当「报价字段为空」或「当前值 === 上次带出的值（用户未改）」时才写入。
 *       用户手动覆盖后，DFM 再变也不会冲掉，除非 force=true（页面上的「重新带出」按钮）。 */
function quotePullFromDFM(force){
  var M=qMeta();
  function pull(dstKey, srcVal){
    if(srcVal===undefined||srcVal===null||srcVal==='') return;
    var sk='_from_'+dstKey, last=M[sk];
    var curEmpty=(M[dstKey]===undefined||M[dstKey]===null||M[dstKey]==='');
    var userEdited=(!curEmpty && last!==undefined && String(M[dstKey])!==String(last));
    if(force || curEmpty || !userEdited){ M[dstKey]=srcVal; M[sk]=srcVal; }
  }
  pull('customer', V('custName'));
  pull('moldName', V('partName')||V('projName'));
  pull('partNo',   V('partNo'));
  pull('date',     V('dfmDate'));
  pull('alloy',    V('alloy')||V('mat'));
  pull('blankW',   V('wCast'));
  pull('finW',     V('wFinish'));
  // 机型吨位：取全局设备库当前机型的锁模力（吨），就近匹配价格库吨位档
  try{
    var m=curMachine();
    if(m && m.lock){
      var best=null, bd=1e9;
      qDB().tonnages.forEach(function(t){
        var tv=parseFloat(t); if(isNaN(tv)) return;
        var d=Math.abs(tv-m.lock); if(d<bd){ bd=d; best=t; }
      });
      if(best) pull('ton', best);
    }
  }catch(e){}
  save();
}

/* ---------- 模具计价 ---------- */
function qGetMold(){
  var M=qMeta(), DB=qDB();
  var t=M.moldType||'hard';
  var mat=M.mat||'H13';
  var ton=M.ton||'2000T';
  var ci=(M.cond===undefined||M.cond===null)?0:+M.cond;
  var qty=Math.max(1, parseFloat(M.qty)||1);
  var cond=DB.conds[ci]||DB.conds[0];
  var pKey=DB.tonPriceMap[ton];
  var sub=(t==='hard')?'硬模':'软模';
  var hint='';
  if(ton==='7200T') hint='7200T 无单独标准价，暂按 4500T 大型结构件基准展示，对外请按报价单计价';
  var q=qMold(sub, mat, pKey, cond.d);
  var price=q.price;
  if(price!=null && q.used==='P20' && mat!=='P20')
    hint=(hint?hint+' | ':'')+'价格库中软模无 '+mat+' 标准价，暂按 P20 基准计价，请人工复核';
  if(price==null)
    hint=(hint?hint+' | ':'')+'价格库中无「'+sub+' / '+mat+' / '+pKey+' / '+cond.d+'」记录，请在「价格数据库」中补录';
  return {ok:price!=null, unit:price, qty:qty, cat:t,
    desc:(t==='hard'?'高压硬模':'高压软模')+'/'+mat+'/'+ton+'/'+cond.d,
    key:'mold|'+t+'|'+mat+'|'+ton+'|'+ci, mat:mat, ton:ton, cond:cond.n, diff:cond.d, condIdx:ci, hint:hint};
}
function qAddMold(){
  var m=qGetMold();
  if(!m.ok) return false;
  qSheetSet(m.key, {key:m.key, cat:(m.cat==='hard'?'硬模':'软模'), desc:m.desc, unit:m.unit, qty:m.qty});
  qBuildIndex();
  return true;
}

/* ---------- 节拍 ---------- */
function qCycleValOf(ton, slider){
  var DB=qDB(), row=null, k=Q_CYCLE_TON_MAP[ton];
  for(var i=0;i<DB.cycle.length;i++) if(DB.cycle[i][0]===k){ row=DB.cycle[i]; break; }
  return row?row[(+slider===0?1:2)]:null;
}
function qAddCycle(){
  var M=qMeta(), ton=M.ton, slider=M.slider||'0';
  var v=qCycleValOf(ton, slider);
  if(v==null) return false;
  var cond=(+slider===0?'无滑块':'有滑块');
  qSheetSet('cycle|'+ton+'|'+slider, {key:'cycle|'+ton+'|'+slider, cat:'节拍',
    desc:'压铸节拍（'+ton+'·'+cond+'） '+v+' 秒', unit:0, qty:1});
  return true;
}

/* ---------- 工装 ---------- */
function qAuxPrice(name){
  var M=qMeta(), ton=M.auxTon||M.ton;
  if(!name||!ton) return null;
  return qAux(name, Q_AUX_TON_MAP[ton]);
}
function qAddAux(names){
  var M=qMeta(), ton=M.auxTon||M.ton, n=0;
  (names||[]).forEach(function(name){
    var p=qAuxPrice(name);
    var key='moldAux|'+name+'|'+ton;
    qSheetSet(key, {key:key, cat:'工装',
      desc:name+'（'+ton+'）'+(p==null?'（价格待定，需询价）':''),
      unit:(p==null?0:p), qty:1});
    n++;
  });
  return n;
}
function qAddAuxQty(name, qty){
  var M=qMeta(), ton=M.auxTon||M.ton;
  var p=qAuxPrice(name);
  var key='moldAux|'+name+'|'+ton;
  qSheetSet(key, {key:key, cat:'工装',
    desc:name+'（'+ton+'）'+(p==null?'（价格待定，需询价）':''),
    unit:(p==null?0:p), qty:Math.max(1, parseFloat(qty)||1)});
  qBuildIndex();
}

/* ---------- 配件 ---------- */
function qAddPart(sub, recId){
  var list=qPartList(sub), rec=null;
  for(var i=0;i<list.length;i++) if(String(list[i].id)===String(recId)) { rec=list[i]; break; }
  if(!rec) return false;
  qSheetSet('part|'+sub+'|'+rec.id, {key:'part|'+sub+'|'+rec.id, cat:'配件',
    desc:rec.name+'（'+rec.sub+'）', unit:rec.price, qty:1});
  qBuildIndex();
  return true;
}

    if(it.desc.indexOf('压射杆')>=0) return 16;
    if(it.desc.indexOf('冲头')>=0) return 17;
    return -1;
  }
  if(it.cat==='工装'){
    var d=it.desc;
    var m={'抓手工装':0,'喷雾工装':1,'激光打码工装':2,'针刻打码工装':3,'水箱工装':4,'锯切工装':5,'X光工装':6,
      '热处理料架':7,'抛丸工装':8,'激光切割工装':9,'平面度检具':10,'下料小车':11,'传送带工装':12,
      '打磨工装':13,'下料起重工装':14,'取件工装':0,'喷涂工装':1,'打码工装':2,'毛坯检具':10};
    for(var k in m) if(d.indexOf(k)>=0) return m[k];
    return -1;
  }
  return -1;
}

function exportQuoteCSV(){
  var sh=qSheet(), M=qMeta();
  var rows=[['工装模具报价表'],['客户名称',M.customer||'','模具名称',M.moldName||'','日期',M.date||''],
            ['序号','类别','项目描述','未税单价(元)','数量','未税金额(元)']];
  var net=0;
  sh.forEach(function(it,i){ var a=(it.unit||0)*(it.qty||0); net+=a;
    rows.push([i+1,it.cat,it.desc,it.unit,it.qty,Math.round(a)]); });
  rows.push(['','','合计','',net]);
  var csv=rows.map(function(r){ return r.map(function(c){
    var s=(c==null?'':String(c));
    return /[",\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s;
  }).join(','); }).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='压铸模报价表_'+(M.customer||'QT')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);

}

  // 表格
  h+='<div class="q-tbl-wrap" style="max-height:58vh"><table class="q-tbl q-admin">';
  h+='<thead><tr>';
  Q_DB_FIELDS.forEach(function(f){ h+='<th style="min-width:'+f.w+'px">'+f.t+'</th>'; });
  h+='<th style="width:56px"></th></tr></thead><tbody>';
  list.forEach(function(r){
    h+='<tr>';
    Q_DB_FIELDS.forEach(function(f){
      var v=r[f.f];
      if(f.type==='select'){
        h+='<td><select class="q-cell" onchange="qAdmEdit('+r.id+',\''+f.f+'\',this.value)">'
          +f.opts.map(function(o){ return '<option value="'+qEsc(o)+'"'+(String(v)===String(o)?' selected':'')+'>'+(o===''?'—':o)+'</option>'; }).join('')
          +'</select></td>';
      }else if(f.type==='number'){
        h+='<td><input class="q-cell" type="number" value="'+(v==null?'':v)+'" oninput="qAdmEdit('+r.id+',\''+f.f+'\',this.value)"></td>';

    h+='</tr>';

function qAdmKw(v){ Q_UI.adminKw=v; renderMain('m11'); }
function qAdmEdit(id,f,v){
  var DB=qDB();
  for(var i=0;i<DB.records.length;i++){
    if(DB.records[i].id===id){
      DB.records[i][f]=(f==='price')?(v===''?null:(parseFloat(v)||0)):v;
      break;

  }
  save(); qBuildIndex();

function qAdmAdd(){
  var DB=qDB();
  var maxId=0; DB.records.forEach(function(r){ if(r.id>maxId) maxId=r.id; });
  DB.records.push({id:maxId+1,cat:'模具',sub:'',name:'新记录',mat:'*',ton:'',diff:'简单',
                   price:null,tax:'未税',unit:'付',note:''});
  save(); qBuildIndex(); renderMain('m11');
  if(typeof toast==='function') toast('已新增一行，请填写后保存');

/* ---------- 渲染：主表单 ---------- */
function renderMain(viewId){
  if(!viewId) viewId = currentView || (MODULES[0] && MODULES[0].id);
  currentView = viewId;
  var m=null, idx=-1;
  for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id===viewId){ m=MODULES[i]; idx=i; break; } }
  var h='';
  if(m && m.layout==='quote'){ h = renderQuoteModule(); }
  else if(m){
    h += '<section class="mod" id="'+m.id+'">';
    h += '<div class="breadcrumb"><span>首页</span><i>›</i><span>'+esc(m.name)+'</span></div>';
    h += '<div class="mod-hd scroll-anchor"><h2>'+esc(m.name)+'</h2><p>'+esc(m.desc||'')+'</p></div>';
    m.groups.forEach(function(g){
      h += '<div class="card scroll-anchor'+(collapsedCards[g.id]?' collapsed':'')+'" id="'+g.id+'">';
      h += '<h3><span>'+esc(g.name)+'</span>'+(g.desc?'<span class="tag">'+esc(g.desc)+'</span>':'')+'<span class="sp"></span><span class="cv">▾</span></h3>';
      h += '<div class="body">';
      var grid=[], full=[];
      g.fields.forEach(function(f){
        if(f.type==='table'||f.type==='issueList'||f.type==='result'||f.type==='note'||f.type==='formula'||f.type==='machine'||f.type==='images'||f.type==='videos'||f.type==='vision') full.push(f);
        else grid.push(f);
      });
      if(grid.length){
        h += '<div class="grid">';
        grid.forEach(function(f){ h += renderField(f); });
        h += '</div>';
      }
      full.forEach(function(f){ h += renderField(f); });
      h += '</div></div>';
    });
    h += '</section>';
  }
  $('#main').innerHTML = h;
  if(!mainBound){ bindMain(); mainBound = true; }  // 仅绑定一次，避免重复 renderMain 叠加监听器
  initVisionAll();
  renderResults();
  try{ $('#main').scrollTop = 0; }catch(e){}
}

function renderField(f){

      + '<div class="tbl-bar">'
      + (f.add?'<button class="btn sm" data-add="'+f.k+'">＋ 增行</button>':'')
      + '<span class="hint">共 <b id="cnt_'+f.k+'">'+(S.t[f.k]||[]).length+'</b> 行</span></div>'

      + '<tbody>'+body+'</tbody></table></div></div>';

      : (f.type==='textarea' ? '<textarea class="inp" data-k="'+f.k+'"'+(f.def!==undefined?' placeholder="'+esc(f.def)+'"':'')+'>'+esc(v)+'</textarea>'
      : '<input class="inp" data-k="'+f.k+'" type="'+(f.type==='number'?'number':'text')+'"'+(f.def!==undefined?' placeholder="'+esc(f.def)+'"':'')+' value="'+esc(v)+'">'))

function renderRow(f,row,ri){
  var c, val, inner;

      inner = '<select class="inp" data-t="'+f.k+'" data-r="'+ri+'" data-c="'+c.k+'">'+opts+'</select>';

/* ---------- 事件绑定（事件委托） ---------- */
function bindMain(){
  var main = $('#main');
  main.addEventListener('input', function(e){
    var el=e.target;
    if(el.hasAttribute && el.hasAttribute('data-vf')){
      var dv = findDefect(el.getAttribute('data-vk'), el.getAttribute('data-vid'));
      if(dv){ dv[el.getAttribute('data-vf')] = el.value; save(); }
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-k')){
      S.f[el.getAttribute('data-k')] = el.value;
      onChanged(el.getAttribute('data-k'));
    }else if(el.hasAttribute && el.hasAttribute('data-c')){
      var t=el.getAttribute('data-t'), r=+el.getAttribute('data-r'), c=el.getAttribute('data-c');
      if(S.t[t] && S.t[t][r]) S.t[t][r][c]=el.value;
      save(); renderResults();
    }
  });
  main.addEventListener('change', function(e){
    var el=e.target;
    if(el.hasAttribute && el.hasAttribute('data-vf')){
      var dv = findDefect(el.getAttribute('data-vk'), el.getAttribute('data-vid'));
      var vk = el.getAttribute('data-vk');
      if(dv){ dv[el.getAttribute('data-vf')] = el.value; save(); renderVisionCards(vk); drawVision(vk); }
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-vimg')){
      var ik = el.getAttribute('data-vimg');
      if(S.v[ik]) S.v[ik].curImg = +el.value;
      VISION_SEL.k=ik; VISION_SEL.id=null;
      renderVisionCards(ik); drawVision(ik); save();
      return;
    }
    if(el.hasAttribute && el.hasAttribute('data-k')){
      S.f[el.getAttribute('data-k')] = el.value; onChanged(el.getAttribute('data-k'));
    }else if(el.hasAttribute && el.hasAttribute('data-c')){
      var t=el.getAttribute('data-t'), r=+el.getAttribute('data-r'), c=el.getAttribute('data-c');
      if(S.t[t] && S.t[t][r]) S.t[t][r][c]=el.value;
      save(); renderResults();
    }else if(el.hasAttribute && el.hasAttribute('data-up')){
      handleUpload(el);
    }else if(el.hasAttribute && el.hasAttribute('data-up2')){
      handleUpload2(el);
    }else if(el.hasAttribute && el.hasAttribute('data-upv')){
      handleUploadV(el);
    }
  });
  main.addEventListener('click', function(e){
    /* 卡片折叠：点击卡片标题栏收起/展开 */
    var hd = e.target.closest ? e.target.closest('.card > h3') : null;
    if(hd){
      var card = hd.parentNode, id = card.id;
      if(card.classList.toggle('collapsed')) collapsedCards[id]=true; else delete collapsedCards[id];
      return;
    }
    var el=e.target.closest?e.target.closest('[data-add],[data-del],[data-delimg],[data-delvid],[data-automach],[data-addissue],[data-delissue],[data-delimg2],[data-vadd],[data-vclear],[data-vdel],[data-vset],[data-machUI],.thumb img'):null;
    if(!el) return;
    if(el.hasAttribute('data-machUI')){
      openMachUI();
      return;
    }
    if(el.hasAttribute('data-vadd')){
      visionAddDefect(el.getAttribute('data-vadd'));
    }else if(el.hasAttribute('data-vclear')){
      visionClear(el.getAttribute('data-vclear'));
    }else if(el.hasAttribute('data-vdel')){
      var kv=el.getAttribute('data-vdel'), idv=el.getAttribute('data-vid');
      var dv=findDefect(kv,idv);
      if(dv && !confirm('确认删除该缺陷标注（#'+defectNo(kv,dv)+' '+(dv.type||'')+'）？')) return;
      var bx=S.v[kv]; if(!bx) return;
      bx.defects = bx.defects.filter(function(d){ return d.id!==idv; });
      if(VISION_SEL.id===idv){ VISION_SEL.id=null; }
      renderVisionCards(kv); drawVision(kv); save();
    }else if(el.hasAttribute('data-vset')){
      var ks=el.getAttribute('data-vk'), ids=el.getAttribute('data-vid'), vs=el.getAttribute('data-vset');
      var ds=findDefect(ks,ids); if(!ds) return;
      ds.verdict = (ds.verdict===vs) ? '' : vs;      /* 再次点击取消复核 */
      renderVisionCards(ks); drawVision(ks); save();
    }else if(el.hasAttribute('data-addissue')){
      var ki=el.getAttribute('data-addissue');
      var fi=findTableField(ki);
      S.t[ki].push({no:String((S.t[ki]||[]).length+1),desc:'',prop:'',fb:'',
        st:(fi&&fi.statusOpt&&fi.statusOpt[0])||'开放',before:[],after:[]});
      renderIssueList(ki); save();
    }else if(el.hasAttribute('data-delissue')){
      var kd=el.getAttribute('data-delissue'), rd=+el.getAttribute('data-ri');
      if(!confirm('确认删除第 '+(rd+1)+' 条问题？')) return;
      S.t[kd].splice(rd,1); renderIssueList(kd); save();
    }else if(el.hasAttribute('data-delimg2')){
      var k2=el.getAttribute('data-delimg2'), r2=+el.getAttribute('data-ri'),
          t2=el.getAttribute('data-tag'), i2=+el.getAttribute('data-idx');
      var row2=(S.t[k2]||[])[r2]; if(!row2) return;
      (row2[t2]||[]).splice(i2,1); refreshThumbs2(k2,r2,t2); save();
    }else if(el.hasAttribute('data-add')){
      var k=el.getAttribute('data-add');
      var fld=findTableField(k); var row={};
      (fld.cols||[]).forEach(function(c){ row[c.k]= (c.type==='select'&&c.opt)?c.opt[0]:''; });
      S.t[k].push(row); rerenderTable(k); save();
    }else if(el.hasAttribute('data-del')){
      var kk=el.getAttribute('data-del'), ri=+el.getAttribute('data-ri');
      S.t[kk].splice(ri,1); rerenderTable(kk); save();
    }else if(el.hasAttribute('data-delimg')){
      var key=el.getAttribute('data-delimg'), idx=+el.getAttribute('data-idx');
      S.i[key].splice(idx,1); refreshThumbs(key); save();
    }else if(el.hasAttribute('data-delvid')){
      var keyv=el.getAttribute('data-delvid'), idxv=+el.getAttribute('data-idx');
      if(!confirm('确认删除该视频？')) return;
      (S.i[keyv]||[]).splice(idxv,1); refreshVideos(keyv); save();
    }else if(el.hasAttribute('data-automach')){
      applyRecMachine();
    }else if(el.tagName==='IMG' && el.parentNode.classList.contains('thumb')){
      lightbox(el.src);
    }
  });
}
function findTableField(k){

}
function rerenderTable(k){

}
/* ---------- 视频上传（不压缩，直接存 base64，受体积上限约束） ---------- */

/* 输入变化：联动 + 重算 */
function onChanged(k){
  if(k==='machineId'){
    fillMachine(); recalcDerived(); renderResults(); save();
    var sel=document.querySelector('[data-k="machineId"]');
    if(sel) sel.value=V('machineId');
    var sum=document.querySelector('[data-msum]');
    if(sum) sum.innerHTML=machineSummaryHTML(curMachine());
    return;   /* 局部刷新：不重建视图，避免打断输入焦点 */
  }
  else if(k==='autoMach'){ autoSyncMachine(); }
  recalcDerived();
  if(CALC_KEYS[k]) autoSyncMachine();   // 锁模力相关输入变化 → 校核不足时自动带出更大吨位机型
  save(); renderResults();
}
/* 派生值联动 */
function recalcDerived(){
  // 每次浇注重量 = 毛坯 + 流道 + 渣包
  var wp = N('wCast')+N('wRunner')+N('wOverflow');
  setRO('wPour', wp?wp.toFixed(3):'');
  setRO('cwM', wp?wp.toFixed(3):'');
  // 总投影面积（含滑块）自动带出
  var at = (N('aPart')+N('aRunner')+N('aOver'))*Math.max(1,N('cav'))+N('aSlider');
  setRO('aTotal2', at?at.toFixed(1):'');
  if(!V('pMax2')) setRO('pMax2', V('castP'));
}
function setRO(k,val){
  S.f[k]=val;
  var el = $('[data-k="'+k+'"]'); if(el && el.tagName==='INPUT') el.value=val;
}
/* 选中机型 → 自动填充设备参数 */
function fillMachine(){
  var m = curMachine();
  S.f.lockKN  = m.lock;
  S.f.tieX    = (''+m.tie).split('×')[0];
  S.f.tieY    = (''+m.tie).split('×')[1]||(''+m.tie).split('×')[0];
  S.f.tieDia  = m.tieDia;
  S.f.machTon = m.ton;
  S.f.injForce= m.injForce;
  S.f.machV0  = m.v0;
  if(!N('injD') && m.punch && m.punch.length) S.f.injD = m.punch[0];
  if(!N('injVol') && N('wCast')) S.f.injVol = (N('wCast')*1000/2.7).toFixed(1); // kg → cm³ (ρ=2.7 g/cm³)
  if(!N('vcSlvD') && m.punch && m.punch.length) S.f.vcSlvD = m.punch[0];
}

/* ---------- 图片上传（压缩后存 base64，避免 localStorage 超限） ---------- */
var IMG_MAXW = 1280, IMG_Q = 0.72;
var VID_MAXB = 8*1024*1024;   /* 单个视频上限 8 MB，避免 localStorage 超额 */
function handleUpload(input){
  var k = input.getAttribute('data-up');
  var files = Array.prototype.slice.call(input.files||[]);
  if(!files.length) return;
  var fld = findImagesField(k);
  var max = (fld&&fld.max)||6;
  files.forEach(function(file){
    compressImage(file, function(dataUrl){
      if(S.i[k].length>=max){ toast('最多 '+max+' 张，已忽略多余图片'); return; }
      S.i[k].push(dataUrl); refreshThumbs(k); save();
      afterImagesChanged(k);
    });
  });
  input.value='';
}
/* 云图数量变化后，同步视觉检测面板（图数 / 画布 / 选中张） */
function afterImagesChanged(k){
  var vf = findVisionField(k.replace(/Img$/,'Def'));
  if(!vf) return;
  var vk = vf.k;
  if(!S.v[vk]) S.v[vk] = {defects:[]};
  delete VCACHE[vk];                                  /* 云图变化 → 丢弃解码缓存 */
  refreshVision(vk);
}
function findImagesField(k){
  var found=null;
  MODULES.forEach(function(m){ m.groups.forEach(function(g){ g.fields.forEach(function(f){ if(f.k===k) found=f; }); }); });
  return found;
}
/* 视频上传：不做压缩，仅校验体积与数量上限 */
function handleUploadV(input){
  var k = input.getAttribute('data-upv');
  var files = Array.prototype.slice.call(input.files||[]);
  if(!files.length) return;
  if(!S.i[k]) S.i[k]=[];
  var fld = findImagesField(k);
  var max = (fld&&fld.max)||1;
  files.forEach(function(file){
    if(S.i[k].length>=max){ toast('最多 '+max+' 个视频，已忽略多余文件'); return; }
    if(file.size>VID_MAXB){ toast('视频 '+ (file.size/1048576).toFixed(1) +' MB 超过 '+(VID_MAXB/1048576)+' MB 上限，未添加'); return; }
    var fr = new FileReader();
    fr.onload = function(e){ S.i[k].push(e.target.result); refreshVideos(k); save(); };
    fr.readAsDataURL(file);
  });
  input.value='';
}
/* 问题卡片内图片上传（优化前 / 优化后），最多 2 张 */
function handleUpload2(input){
  var k=input.getAttribute('data-up2'), ri=+input.getAttribute('data-ri'), tag=input.getAttribute('data-tag');
  var files=Array.prototype.slice.call(input.files||[]);
  if(!files.length) return;
  var row=(S.t[k]||[])[ri]; if(!row) return;
  if(!row[tag]) row[tag]=[];
  var max=2;
  files.forEach(function(file){
    compressImage(file, function(dataUrl){
      if(row[tag].length>=max){ toast('每组最多 '+max+' 张，已忽略多余图片'); return; }
      row[tag].push(dataUrl); refreshThumbs2(k,ri,tag); save();
    });
  });
  input.value='';
}
function compressImage(file, cb){
  var fr = new FileReader();
  fr.onload = function(e){
    var im = new Image();
    im.onload = function(){
      var w=im.width, h=im.height;
      if(w>IMG_MAXW){ h = Math.round(h*IMG_MAXW/w); w = IMG_MAXW; }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      var ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg', IMG_Q));
    };
    im.onerror=function(){ cb(e.target.result); };
    im.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

/* =========================================================================
 *  ④-2 视觉检测：模流缺陷标注与人工复核
 *  设计约定
 *    · 存储：S.v[字段k] = { defects: [ {id,img,x,y,w,h,type,severity,advice,
 *                                     confidence,source,verdict} ] }
 *      x/y/w/h 一律为「相对图片的归一化 0~1 坐标」，因此与图片原始像素尺寸解耦，
 *      PPT 缩放、窗口缩放、换图都不会错位。
 *    · source：rule（规则引擎）| manual（人工框选）| model（本地模型）
 *    · verdict：''（未复核）| ok（对）| partial（部分对）| no（错）
 *    · 本模块只做「标注与复核」这一层地基：规则引擎与 ONNX 模型后续可直接
 *      向 S.v[k].defects 推入候选框，无需改动渲染与导出链路。
 * ========================================================================= */
var DEFECT_TYPES = ['卷气','气压','填充温度','料液汇合','固相分数','氧化物','缩孔','填充不足',
                    '冷隔','变形','热节','冲蚀','待判定'];
var SEV_LIST = ['高','中','低'];
var SEV_COLOR = {'高':'#c2410c','中':'#d97706','低':'#17803d'};
var SRC_LABEL = {rule:'规则引擎', manual:'人工框选', model:'本地模型'};
var VERDICT_LABEL = {ok:'对', partial:'部分对', no:'错'};

/* ---------- 渲染：视觉检测面板 ---------- */
function renderVision(f){
  var k=f.k, box=(S.v[k]=S.v[k]||{defects:[]});
  var imgs = S.i[f.src]||[];
  var cur = (box.curImg===undefined)?0:box.curImg;
  if(cur>=imgs.length) cur = Math.max(0, imgs.length-1);
  box.curImg = cur;

  var head = '<div class="vh"><b>'+esc(f.t||'缺陷标注与复核')+'</b>'
    + '<span class="tag">'+(imgs.length?('云图 '+(cur+1)+' / '+imgs.length):'未上传云图')+'</span>'
    + '<span class="sp"></span>'
    + '<span class="hint">坐标按归一化存储 · 与图片像素解耦</span></div>';

  if(!imgs.length){
    return '<div class="vision" data-vision="'+k+'">'+head
      + '<div class="vb" style="grid-template-columns:1fr">'
      + '<div class="vcanvas-empty">请先在上方「模流分析图片」中上传结果云图，<br>'
      + '上传后即可在此逐张框选缺陷位置并做人工复核。</div>'
      + '</div></div>';
  }

  var imgSel = imgs.length>1
    ? '<select class="inp" data-vimg="'+k+'" style="width:auto;min-width:132px">'
      + imgs.map(function(_,i){ return '<option value="'+i+'"'+(i===cur?' selected':'')+'>切换云图 '+(i+1)+'</option>'; }).join('')
      + '</select>'
    : '';

  var body = '<div class="vb">'
    /* ---- 左：画布 ---- */
    + '<div>'
    +   '<div class="vcanvas-wrap" data-vwrap="'+k+'">'
    +     '<canvas data-vcanvas="'+k+'"></canvas>'
    +     '<div class="vcanvas-empty" data-vempty="'+k+'" style="display:none"></div>'
    +   '</div>'
    +   '<div class="vtool">'
    +     '<button class="btn sm" data-vadd="'+k+'">＋ 手动添加缺陷框</button>'
    +     '<button class="btn sm" data-vclear="'+k+'">清空本图标注</button>'
    +     imgSel
    +     '<span class="sp" style="flex:1"></span>'
    +     '<span class="hint">在图上按住拖拽可直接画框</span>'
    +   '</div>'
    +   '<div class="vstat">'
    +     '<span>本图缺陷 <b data-vcnt="'+k+'">0</b> 处</span>'
    +     '<span>已复核 <b data-vdone="'+k+'">0</b> 处</span>'
    +     '<span>人工框选 <b data-vman="'+k+'">0</b> 处</span>'
    +   '</div>'
    + '</div>'
    /* ---- 右：缺陷清单 ---- */
    + '<div class="vside" data-vlist="'+k+'">'
    +   renderDefectList(f)
    + '</div>'
    + '</div>';

  return '<div class="vision" data-vision="'+k+'">'+head+body+'</div>';
}
function curDefects(k, imgIdx){
  var box = S.v[k]||{defects:[]};
  var all = box.defects||[];
  if(imgIdx===undefined) return all;
  return all.filter(function(d){ return (d.img||0)===imgIdx; });
}
function renderDefectList(f){
  var k=f.k, box=(S.v[k]||{defects:[]});
  var cur = box.curImg||0;
  var list = curDefects(k, cur);
  if(!list.length){
    return '<div class="vempty">本张云图暂无缺陷标注。<br>'
      + '可在左侧画布上拖拽框选，或点击「＋ 手动添加缺陷框」。<br>'
      + '后续接入规则引擎 / 本地模型后，候选框会自动出现在此处。</div>';
  }
  return list.map(function(d){
    return renderDefectCard(f, d);
  }).join('');
}
function renderDefectCard(f, d){
  var k=f.k;
  var sev = d.severity||'中';
  var sevCls = sev==='高'?'sev-high':(sev==='中'?'sev-mid':'sev-low');
  var no = defectNo(k, d);
  var sel = (VISION_SEL.k===k && VISION_SEL.id===d.id) ? ' sel' : '';
  var typeOpts = DEFECT_TYPES.map(function(t){
    return '<option value="'+esc(t)+'"'+(d.type===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('');
  var sevOpts = SEV_LIST.map(function(t){
    return '<option value="'+t+'"'+(sev===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('');
  var pct = function(v){ return (v*100).toFixed(1)+'%'; };
  var vd = d.verdict||'';
  return '<div class="vcard '+sevCls+sel+'" data-vcard="'+k+'" data-vid="'+d.id+'">'
    + '<div class="vchd"><span class="vno">#'+no+'</span>'
    +   '<span class="tag">'+(SRC_LABEL[d.source]||d.source||'人工')+'</span>'
    +   '<span class="sp"></span>'
    +   '<button class="vx" data-vdel="'+k+'" data-vid="'+d.id+'" title="删除该缺陷">✕</button></div>'
    + '<div class="vgrid">'
    +   '<div><label>缺陷类型</label><select class="inp" data-vf="type" data-vk="'+k+'" data-vid="'+d.id+'">'+typeOpts+'</select></div>'
    +   '<div><label>严重度</label><select class="inp" data-vf="severity" data-vk="'+k+'" data-vid="'+d.id+'">'+sevOpts+'</select></div>'
    + '</div>'
    + '<div class="vrow"><label>位置（归一化 x / y / w / h）</label>'
    +   '<div style="font-family:Consolas,monospace;font-size:11px;color:var(--text-2)">'
    +   pct(d.x)+' , '+pct(d.y)+' , '+pct(d.w)+' , '+pct(d.h)+'</div></div>'
    + '<div class="vrow"><label>处理建议</label>'
    +   '<textarea class="inp" rows="2" data-vf="advice" data-vk="'+k+'" data-vid="'+d.id+'">'+esc(d.advice||'')+'</textarea></div>'
    + '<div class="vverdicts">'
    +   '<button data-vset="ok" data-vk="'+k+'" data-vid="'+d.id+'" class="'+(vd==='ok'?'on':'')+'">对</button>'
    +   '<button data-vset="partial" data-vk="'+k+'" data-vid="'+d.id+'" class="'+(vd==='partial'?'on':'')+'">部分对</button>'
    +   '<button data-vset="no" data-vk="'+k+'" data-vid="'+d.id+'" class="'+(vd==='no'?'on':'')+'">错</button>'
    + '</div>'
    + '</div>';
}
/* 缺陷在「当前云图内」的展示序号（1 起） */
function defectNo(k, d){
  var list = curDefects(k, d.img||0);
  for(var i=0;i<list.length;i++){ if(list[i].id===d.id) return i+1; }
  return 1;
}
function findDefect(k, id){
  var list = (S.v[k]&&S.v[k].defects)||[];
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
  return null;
}
var VISION_SEL = {k:null, id:null};

/* ---------- 画布：绘制与交互 ---------- */
var VCACHE = {};   /* k -> {imgSrc, img:Image, loaded:bool} */
function vcacheFor(k, f){
  var src = (S.i[f.src]||[])[S.v[k].curImg||0];
  var c = VCACHE[k];
  if(!c || c.imgSrc!==src){ VCACHE[k] = {imgSrc:src, img:null, loaded:false}; c = VCACHE[k]; }
  return c;
}
function drawVision(k, f){
  f = f || findVisionField(k);
  if(!f) return;
  var wrap = document.querySelector('[data-vwrap="'+k+'"]');
  var cv = document.querySelector('[data-vcanvas="'+k+'"]');
  if(!wrap || !cv) return;
  var box = S.v[k]||{defects:[]};
  var src = (S.i[f.src]||[])[box.curImg||0];
  if(!src){
    cv.style.display='none';
    var em = document.querySelector('[data-vempty="'+k+'"]');
    if(em){ em.style.display=''; em.textContent='本张云图已不存在，请重新上传。'; }
    return;
  }
  var cc = vcacheFor(k, f);
  var paint = function(im){
    if(!im || !im.width) return;
    var maxW = Math.max(240, wrap.clientWidth||560);
    var sc = Math.min(1, maxW/im.width);
    var cw = Math.round(im.width*sc), ch = Math.round(im.height*sc);
    cv.width = cw; cv.height = ch;
    cv.style.display='';
    var em = document.querySelector('[data-vempty="'+k+'"]');
    if(em) em.style.display='none';
    var ctx = cv.getContext('2d');
    ctx.clearRect(0,0,cw,ch);
    ctx.drawImage(im,0,0,cw,ch);
    /* 逐框绘制：序号 + 类型 + 严重度配色 */
    var list = curDefects(k, box.curImg||0);
    ctx.lineWidth = 2;
    ctx.font = '600 11px "Noto Sans SC",sans-serif';
    ctx.textBaseline = 'alphabetic';
    list.forEach(function(d,i){
      var x=d.x*cw, y=d.y*ch, w=d.w*cw, h=d.h*ch;
      var col = SEV_COLOR[d.severity]||SEV_COLOR['中'];
      var isSel = (VISION_SEL.k===k && VISION_SEL.id===d.id);
      ctx.strokeStyle = col;
      ctx.lineWidth = isSel?3:2;
      ctx.strokeRect(x,y,w,h);
      if(isSel){
        ctx.fillStyle = 'rgba(255,106,0,.10)';
        ctx.fillRect(x,y,w,h);
      }
      /* 标签底衬 */
      var tag = '#'+(i+1)+' '+d.type;
      var tw = ctx.measureText(tag).width + 10;
      var ty = (y-16 < 0) ? (y+h+2) : (y-16);
      ctx.fillStyle = col;
      ctx.fillRect(x, ty, tw, 15);
      ctx.fillStyle = '#fff';
      ctx.fillText(tag, x+5, ty+11.5);
    });
    /* 正在拖拽的临时框 */
    if(VDRAG.k===k && VDRAG.drawing){
      var rx=Math.min(VDRAG.x0,VDRAG.x1)*cw, ry=Math.min(VDRAG.y0,VDRAG.y1)*ch;
      var rw=Math.abs(VDRAG.x1-VDRAG.x0)*cw, rh=Math.abs(VDRAG.y1-VDRAG.y0)*ch;
      ctx.setLineDash([5,4]);
      ctx.strokeStyle = '#ff6a00'; ctx.lineWidth = 2;
      ctx.strokeRect(rx,ry,rw,rh);
      ctx.setLineDash([]);
    }
    cc.cw = cw; cc.ch = ch;
  };
  if(cc.loaded && cc.img){ paint(cc.img); return; }
  if(!cc.img){
    cc.img = new Image();
    cc.img.onload = function(){ cc.loaded=true; paint(cc.img); };
    cc.img.onerror = function(){ cc.loaded=false; };
    cc.img.src = src;
  }
}

/* 拖拽状态 */
var VDRAG = {k:null, mode:'', id:'', x0:0,y0:0,x1:0,y1:0, ox:0,oy:0, sx:0,sy:0, drawing:false};
function vPos(cv, ev){
  var r = cv.getBoundingClientRect();
  var x = ((ev.touches?ev.touches[0].clientX:ev.clientX) - r.left)/r.width;
  var y = ((ev.touches?ev.touches[0].clientY:ev.clientY) - r.top)/r.height;
  return {x:Math.min(1,Math.max(0,x)), y:Math.min(1,Math.max(0,y))};
}
function vHit(k, px, py){
  var box = S.v[k]||{defects:[]};
  var list = curDefects(k, box.curImg||0);
  for(var i=list.length-1;i>=0;i--){
    var d=list[i];
    if(px>=d.x && px<=d.x+d.w && py>=d.y && py<=d.y+d.h) return d;
  }
  return null;
}

function initVisionCanvas(k){
  var cv = document.querySelector('[data-vcanvas="'+k+'"]');
  if(!cv || cv._vbound) return;
  cv._vbound = true;
  var f = findVisionField(k);
  var start = function(ev){
    ev.preventDefault();
    if(!S.v[k]) S.v[k]={defects:[]};
    var p = vPos(cv, ev);
    var hit = vHit(k, p.x, p.y);
    if(hit){
      VISION_SEL.k=k; VISION_SEL.id=hit.id;
      VDRAG.k=k; VDRAG.mode='move'; VDRAG.id=hit.id;
      VDRAG.ox=hit.x; VDRAG.oy=hit.y; VDRAG.sx=p.x; VDRAG.sy=p.y; VDRAG.drawing=false;
      renderVisionCards(k); drawVision(k,f);
    }else{
      VISION_SEL.k=k; VISION_SEL.id=null;
      VDRAG.k=k; VDRAG.mode='draw'; VDRAG.drawing=true;
      VDRAG.x0=p.x; VDRAG.y0=p.y; VDRAG.x1=p.x; VDRAG.y1=p.y;
      drawVision(k,f);
    }
  };
  var move = function(ev){
    if(VDRAG.k!==k) return;
    ev.preventDefault();
    var p = vPos(cv, ev);
    if(VDRAG.mode==='draw'){
      VDRAG.x1=p.x; VDRAG.y1=p.y; VDRAG.drawing=true;
      drawVision(k,f);
    }else if(VDRAG.mode==='move'){
      var d = findDefect(k, VDRAG.id); if(!d) return;
      d.x = Math.min(1-d.w, Math.max(0, VDRAG.ox + (p.x-VDRAG.sx)));
      d.y = Math.min(1-d.h, Math.max(0, VDRAG.oy + (p.y-VDRAG.sy)));
      drawVision(k,f);
    }
  };
  var end = function(ev){
    if(VDRAG.k!==k) return;
    var f = findVisionField(k);
    if(VDRAG.mode==='draw'){
      var x=Math.min(VDRAG.x0,VDRAG.x1), y=Math.min(VDRAG.y0,VDRAG.y1);
      var w=Math.abs(VDRAG.x1-VDRAG.x0), h=Math.abs(VDRAG.y1-VDRAG.y0);
      VDRAG.drawing=false; VDRAG.k=null; VDRAG.mode='';
      if(w<0.015 || h<0.015){ drawVision(k,f); return; }   /* 误触忽略 */
      var d = normDefect({img:(S.v[k].curImg||0), x:x, y:y, w:w, h:h,
        type:'待判定', severity:'中', source:'manual'});
      S.v[k].defects.push(d);
      VISION_SEL.k=k; VISION_SEL.id=d.id;
      renderVisionCards(k); drawVision(k,f); save();
    }else{
      VDRAG.k=null; VDRAG.mode=''; VDRAG.drawing=false;
      save();
    }
  };
  cv.addEventListener('mousedown', start);
  cv.addEventListener('mousemove', move);
  cv.addEventListener('mouseup', end);
  cv.addEventListener('mouseleave', function(){ if(VDRAG.k===k && VDRAG.mode==='draw'){ VDRAG.drawing=false; VDRAG.k=null; VDRAG.mode=''; drawVision(k,f); } });
  cv.addEventListener('touchstart', start, {passive:false});
  cv.addEventListener('touchmove', move, {passive:false});
  cv.addEventListener('touchend', end);
}

function exportVisionDataset(){
  var part = V('partNo')||V('partName')||'Project', ver = V('version')||'A0';
  var items = [], total = 0, reviewed = 0;

        verdict: d.verdict||'',

        /* 复核结论：ok / partial / no，可作为分类标签直接使用 */

      });
    });
  });
  if(!total){ toast('暂无缺陷标注可导出'); return; }
  var out = {
    schema: 'hpdc-dfm-defect-dataset/1.0',

    material: V('material'), castingType: V('castType')||'',
    /* 统计：便于判断距离「可训练」还有多远 */
    summary: { total:total, reviewed:reviewed, unlabeled:total-reviewed,
      confirmed: items.filter(function(i){return i.label==='confirmed';}).length,
      corrected: items.filter(function(i){return i.label==='corrected';}).length,
      rejected:  items.filter(function(i){return i.label==='rejected';}).length },
    /* 注意：本文件只含标注与几何信息，不含云图 base64（体积过大）。
       训练时请另存云图，用 field + imgIndex 与图片对齐。 */
    defects: items
  };
  var blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'DFM_DefectLabels_'+part+'_'+ver+'.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);

var CYL_STD = [32,40,50,63,80,100,125,140,160,180,200];  // 常用油缸缸径系列

/* =========================================================================
 *  2.2 胀型力 / 锁模力
 *  单位换算：1 MPa × 1 cm² = 100 N = 0.1 kN
 * ========================================================================= */
function calcForce(){
  var P=N('castP'), cav=Math.max(1,N('cav'));
  var aProd=(N('aPart')+N('aRunner')+N('aOver'))*cav;   // 产品+流道+渣包 总投影 cm²
  var aSl=N('aSlider');                                  // 滑块投影 cm²
  var fProd=P*aProd/10;                                  // 产品胀型力 kN
  var fSl=P*aSl/10;                                      // 滑块胀型力 kN
  var fTot=fProd+fSl;                                    // 总胀型力 kN
  var mach=curMachine();
  var lock=N('lockKN')||mach.lock;                       // 设备锁模力 kN
  var limit=N('useRatio')||85;
  var ratio=lock?fTot/lock*100:0;
  var needLock=limit?fTot/(limit/100):0;
  var rec=recommendMachine(needLock);                 // 自动推荐机型：库中锁模力≥需求的最小机型                 // 满足利用率上限所需的最小锁模力
  return {P:P,cav:cav,aProd:aProd,aSl:aSl,aTot:aProd+aSl,
    fProd:fProd,fSl:fSl,fTot:fTot,fTotT:fTot*KN_TON,
    lock:lock,limit:limit,ratio:ratio,needLock:needLock,mach:mach,rec:rec,
    ok: ratio<=limit && ratio>0};
}
function rForce(){
  var c=calcForce();
  if(!c.aTot) return '<h4>胀型力 / 锁模力校核</h4><div class="hint">请先在 2.1 / 2.2 中填写投影面积与铸造压力。</div>';
  var st = c.ratio<=c.limit?'ok':(c.ratio<=95?'warn':'bad');
  return '<h4>胀型力 / 锁模力校核 <span class="st">'+pill(st,(c.ok?'满足':'超出')+' · 利用率 '+fmt(c.ratio,1)+'%')+'</span></h4>'
   + KV([
      {k:'产品胀型力',   v:fmt(c.fProd,1), u:'kN', red:true},
      {k:'滑块胀型力',   v:fmt(c.fSl,1),   u:'kN', red:true},
      {k:'总胀型力',     v:fmt(c.fTot,1),  u:'kN', red:true},
      {k:'总胀型力',     v:fmt(c.fTotT,1), u:'吨', red:true},
      {k:'总投影面积',   v:fmt(c.aTot,1),  u:'cm²'},
      {k:'设备锁模力',   v:fmt(c.lock,0),  u:'kN'},
      {k:'锁模力利用率', v:fmt(c.ratio,1), u:'%', red:true},
      {k:'满足上限所需最小锁模力', v:fmt(c.needLock,0), u:'kN', red:true}
     ])
   + ROT(['项目','产品+流道+渣包','滑块','合计'],[
      ['投影面积 cm²', fmt(c.aProd,1), fmt(c.aSl,1), {t:fmt(c.aTot,1),hi:true}],
      ['胀型力 kN',    fmt(c.fProd,1), fmt(c.fSl,1), {t:fmt(c.fTot,1),hi:true}],
      ['胀型力 吨',    fmt(c.fProd*KN_TON,1), fmt(c.fSl*KN_TON,1), {t:fmt(c.fTotT,1),hi:true}]
     ])
   + machRecHTML(c)
   + verdict(c.ok?'ok':(st==='warn'?'warn':'bad'),
      c.ok? '🟢 设备锁模力满足要求（利用率 '+fmt(c.ratio,1)+'% ≤ '+fmt(c.limit,0)+'%）。建议实际生产比压不超过 '+fmt(c.P,0)+' MPa。'
      : (st==='warn'
        ? '🟡 锁模力利用率 '+fmt(c.ratio,1)+'%，已超过 '+fmt(c.limit,0)+'% 的建议上限，余量偏小：建议降低铸造比压至 '+fmt(c.P*c.limit/Math.max(c.ratio,0.01),0)+' MPa，或评估更大吨位机型。'
        : '🔴 锁模力不足：所需最小锁模力 '+fmt(c.needLock,0)+' kN，当前 '+fmt(c.lock,0)+' kN。建议改用更大吨位机型（当前参考机型 '+esc(c.mach.brand+' '+c.mach.model)+'）。'));
}

/* =========================================================================
 *  2.3 哥林柱受力分布与平衡度
 *  Rᵢ = F/4 × (1 ± 2ex/Bx ± 2ey/By)（刚性模板 + 四角对称支撑假定）
 * ========================================================================= */
function calcTieBar(){
  var f=calcForce();
  var F=f.fTot;                                   // kN
  var Bx=N('tieX')||parseFloat((''+f.mach.tie).split('×')[0]);
  var By=N('tieY')||parseFloat((''+f.mach.tie).split('×')[1])||Bx;
  var ex=N('exOff'), ey=N('eyOff');
  var q=F/4;
  var bars=[
    {n:'左上 (−x, +y)', s:[-1, 1]},
    {n:'右上 (+x, +y)', s:[ 1, 1]},
    {n:'左下 (−x, −y)', s:[-1,-1]},
    {n:'右下 (+x, −y)', s:[ 1,-1]}
  ].map(function(b){
    var r = q*(1 + b.s[0]*2*ex/Bx + b.s[1]*2*ey/By);
    return {n:b.n, s:b.s, r:r, t:r*KN_TON, pct:F?r/F*100:0};
  });
  var rs=bars.map(function(b){return b.r;});
  var fmax=Math.max.apply(null,rs), fmin=Math.min.apply(null,rs);
  var avg=F/4;
  var bal=avg?(fmax-fmin)/avg*100:0;              // 平衡度
  var dia=N('tieDia')||f.mach.tieDia;
  var area=Math.PI*dia*dia/4;                     // mm²

}

/* =========================================================================
 *  3.1 包紧力  F = K·A·P·(η·cosα − sinα)/10000  (吨)
 *      A 单位 mm²；K 为安全系数；η 为合金与模具间摩擦系数
 * ========================================================================= */
function holdF(A, alphaDeg, K, P, eta){
  var a = alphaDeg*Math.PI/180;
  var k = eta*Math.cos(a) - Math.sin(a);
  if(k<0) k=0;                                  // 斜度过大时无包紧力
  return K*A*P*k/10000;                         // 吨(tf)，1 tf ≈ 10 kN
}
function calcHold(){
  var K=N('kHold')||1.1, P=N('pHold')||10, eta=N('etaHold')||0.25;
  var fd=holdF(N('aDyn'), N('alpDyn'), K, P, eta);
  var ff=holdF(N('aFix'), N('alpFix'), K, P, eta);
  return {K:K,P:P,eta:eta,aDyn:N('aDyn'),aFix:N('aFix'),fd:fd,ff:ff,sum:fd+ff,
    ratio: ff?fd/ff:0};
}
function rHold(){
  var c=calcHold();
  if(!c.aDyn && !c.aFix) return '<h4>包紧力计算</h4><div class="hint">请填写动/定模侧包紧面积。</div>';
  var dynBig = c.fd>=c.ff;
  return '<h4>包紧力计算 <span class="st">'+pill(dynBig?'ok':'bad', dynBig?'动模侧包紧力更大 · 分型合理':'动模侧偏小 · 需调整')+'</span></h4>'
   + KV([
      {k:'动模侧包紧面积', v:fmt(c.aDyn,0), u:'mm²'},
      {k:'定模侧包紧面积', v:fmt(c.aFix,0), u:'mm²'},
      {k:'动模侧包紧力',   v:fmt(c.fd,2),  u:'吨', red:true},
      {k:'定模侧包紧力',   v:fmt(c.ff,2),  u:'吨', red:true},
      {k:'包紧力合计',     v:fmt(c.sum,2), u:'吨', red:true},
      {k:'动/定模包紧力比', v:fmt(c.ratio,2), red:true}
     ])
   + verdict(dynBig?'ok':'bad',
      dynBig
      ? '🟢 分型面结论：动模侧包紧力（'+fmt(c.fd,2)+' 吨）≥ 定模侧（'+fmt(c.ff,2)+' 吨），开模后铸件将可靠地留在动模侧，由顶杆顶出，分型方案合理。'
      : '🔴 分型面结论：定模侧包紧力（'+fmt(c.ff,2)+' 吨）大于动模侧（'+fmt(c.fd,2)+' 吨），铸件有粘定模风险。修改方案：① 减小定模侧拔模斜度或减小定模包紧面积；② 在动模侧增加粘模槽/拉钩/倒扣包紧结构；③ 调整分型线，将更多包紧结构置于动模侧；④ 定模设置定模顶出或气动辅助脱模。');
}

/* =========================================================================
 *  3.2 顶杆顶出力与规格选型
 * ========================================================================= */
function calcEject(){
  var h=calcHold();
  var safe=N('ejSafe')||1.2, stress=N('ejStress')||50;
  var d=N('ejDia')||10;
  var A=Math.PI*d*d/4;                      // 单根顶杆截面积 mm²
  var f1=stress*A;                          // 单根许用顶出力 N
  var fNeed=h.fd*safe*TON_N;                // 所需总顶出力 N（动模侧包紧力 × 安全系数）
  var nNeed=Math.ceil(fNeed/f1);            // 所需根数（向上取整）
  var zones=Math.max(1,Math.round(N('ejZone')||1));
  var perZone=Math.ceil(nNeed/zones);       // 每区根数（向上取整）
  var nRec=perZone*zones;                   // 推荐总数（对称布置）
  var cap=N('ejSpace');
  return {h:h,safe:safe,stress:stress,d:d,A:A,f1:f1,f1T:f1*N_TON,fNeed:fNeed,fNeedT:h.fd*safe,
    nNeed:nNeed,zones:zones,perZone:perZone,nRec:nRec,cap:cap,
    ok: !cap || nRec<=cap,
    spec: EJECT_SPEC.map(function(s){
      return {d:s.d,A:s.A,F:s.F,ton:stress*s.A*N_TON,n:s.A?Math.ceil(fNeed/(stress*s.A)):0,boss:s.boss,mark:s.mark};
    })};
}

/* =========================================================================
 *  3.3 挤压销：V = L·h·w·a（a=6%），行程 d = V / 截面积
 * ========================================================================= */
function calcSqueeze(){
  var L=N('sqL'),h=N('sqH'),w=N('sqW'),a=N('sqA')/100||0.06;
  var V=L*h*w*a;                             // 需补偿/挤压体积 mm³
  var d=N('sqD');
  var As=Math.PI*d*d/4;                     // 挤压销截面积 mm²
  var stroke=As?V/As:0;                     // 挤压行程 mm
  var P=N('sqP')||80;
  var Fsq=P*As/1000;                        // 挤压力 kN（局部比压 × 销截面积）
  var mu=N('sqMu')||0.15, Lg=N('sqLg')||0;
  var Ffr=mu*P*Math.PI*d*Lg/1000;           // 导向段摩擦阻力 kN
  var Foth=0.3*Fsq;                         // 铝液凝固/背压附加阻力，按挤压力 30% 估
  var Fres=Ffr+Foth;                        // 总挤压阻力 kN
  var Ftot=Fsq+Fres;                        // 油缸需提供推力 kN
  var sysP=N('sqSysP')||16;
  var Dcyl=Math.sqrt(4*Ftot*1000/(Math.PI*sysP));   // 理论缸径 mm
  var Dstd=pickStd(CYL_STD,Dcyl);
  var Freal=sysP*Math.PI*Dstd*Dstd/4/1000;  // 标准缸径实际推力 kN
  var shrink=N('sqShrink');
  return {L:L,h:h,w:w,a:a,V:V,d:d,As:As,stroke:stroke,P:P,Fsq:Fsq,Ffr:Ffr,Foth:Foth,Fres:Fres,
    Ftot:Ftot,sysP:sysP,Dcyl:Dcyl,Dstd:Dstd,Freal:Freal,shrink:shrink,
    ratio: d?stroke/d:0,
    cover: shrink?V/shrink:0,
    ok: (stroke>0 && stroke<=50 && d && Dstd>0 && Freal>=Ftot)};
}
function rSqueeze(){
  var c=calcSqueeze();
  if(!c.V) return '<h4>挤压销计算</h4><div class="hint">请填写挤压区域尺寸 L / h / w 与挤压销直径。</div>';
  return '<h4>挤压销计算 <span class="st">'+pill(c.ok?'ok':'warn', c.ok?'方案可行':'需复核参数')+'</span></h4>'
   + KV([
      {k:'挤压体积 V',      v:fmt(c.V,1),   u:'mm³', red:true},
      {k:'挤压销直径 d',    v:fmt(c.d,1),   u:'mm'},
      {k:'挤压销截面积',    v:fmt(c.As,2),  u:'mm²'},
      {k:'挤压行程',        v:fmt(c.stroke,2), u:'mm', red:true},
      {k:'挤压比压 P局',    v:fmt(c.P,0),   u:'MPa'},
      {k:'挤压力',          v:fmt(c.Fsq,2), u:'kN', red:true},
      {k:'摩擦阻力',        v:fmt(c.Ffr,2), u:'kN'},
      {k:'附加背压阻力',    v:fmt(c.Foth,2),u:'kN'},
      {k:'挤压阻力合计',    v:fmt(c.Fres,2),u:'kN', red:true},
      {k:'油缸需推力',      v:fmt(c.Ftot,2),u:'kN', red:true},
      {k:'理论缸径',        v:fmt(c.Dcyl,1),u:'mm', red:true},
      {k:'选用标准缸径',    v:'∅'+c.Dstd,   u:'mm', red:true},
      {k:'标准缸实际推力',  v:fmt(c.Freal,2),u:'kN', red:true},
      {k:'行程/直径比',     v:fmt(c.ratio,2), red:true}
     ])
   + verdict(c.ok?'ok':'warn',
      '挤压力校核：标准缸 ∅'+c.Dstd+' 实际推力 '+fmt(c.Freal,1)+' kN '
      + (c.Freal>=c.Ftot ? '≥' : '＜') + ' 所需 '+fmt(c.Ftot,1)+' kN，'
      + (c.Freal>=c.Ftot?'满足要求。':'推力不足，需加大缸径或提高系统压力。')
      + ' 行程 '+fmt(c.stroke,2)+' mm（行程/直径比 '+fmt(c.ratio,2)+'，'
      + (c.ratio<=3?'稳定性良好。':'长径比偏大，建议加大销径或减小挤压体积以防失稳。')+')'
      + (c.shrink ? (' 体积补偿率 V/V缩孔 = '+fmt(c.cover,2)
          + (c.cover >= 1 ? '，可覆盖缩孔。' : '，不足以覆盖缩孔，建议增大销径或增加挤压销数量。')) : '')
      + ' 结论：'+(c.ok?'可行，建议按此方案布置挤压销。':'需复核参数后再定案。'));
}

/* =========================================================================
 *  3.4 滑块油缸缸径：抽芯力 = K × 抽芯阻力（K=1.3）
 * ========================================================================= */
function calcSlider(){
  var A=N('slA'), alpha=N('slAlpha'), K=N('slK')||1.3;
  var Fres=holdF(A, alpha, N('kHold')||1.1, N('pHold')||10, N('etaHold')||0.25); // 抽芯阻力 吨
  var Fpull=K*Fres;                            // 抽芯力 吨
  var mu=N('slMu')||0.15;
  var Ffric=mu*Fres;                           // 导轨摩擦阻力 吨
  var Fneed=Fpull+Ffric;                       // 油缸需推力 吨
  var sysP=N('slSysP')||16;
  var Dcyl=Math.sqrt(4*Fneed*TON_N/(Math.PI*sysP));     // mm
  var Dstd=pickStd(CYL_STD,Dcyl);
  var Freal=sysP*Math.PI*Dstd*Dstd/4*N_TON;    // 标准缸实际推力 吨
  var num=Math.max(1,N('slNum')||1);
  return {A:A,alpha:alpha,K:K,Fres:Fres,Fpull:Fpull,Ffric:Ffric,Fneed:Fneed,
    sysP:sysP,Dcyl:Dcyl,Dstd:Dstd,Freal:Freal,num:num,stroke:N('slStroke'),
    ok: Dstd>0 && Freal>=Fneed};
}
function rSlider(){
  var c=calcSlider();

/* =========================================================================
 *  3.5 抽真空：Qv = V·ln(P₀/P₁)/t，S = Qv×3.6×泄漏系数，A阀 = Qv×1000/v
 * ========================================================================= */
function calcVacuum(){
  var dSleeve=N('vcSlvD'), lSleeve=N('vcSlvL');
  var vSleeve=Math.PI*dSleeve*dSleeve/4*lSleeve/1e6;        // 压室容积 L
  var V=N('vcCav')+N('vcRun')+vSleeve;                      // 总抽气容积 L
  var P0=1013, P1=Math.max(1,N('vcTarget')||50);
  var t=Math.max(0.05,N('vcTime')||1.5);
  var ln=Math.log(P0/P1);
  var Qv=V*ln/t;                                            // 平均抽气量 L/s
  var leak=N('vcLeak')||1.3;
  var S=Qv*3.6*leak;                                        // 所需泵抽速 m³/h
  var v=N('vcVel')||40;
  var Avalve=Qv*1000/v;                                     // 真空阀有效排气截面积 mm²
  var pump=N('vcPump');
  var tNeed=pump?V*ln*3.6*leak/pump:0;                      // 实际泵抽至目标真空所需时间 s
  var totalGas=V*ln;                                        // 总抽气量（等效容积×ln）L
  return {vSleeve:vSleeve,V:V,P0:P0,P1:P1,t:t,ln:ln,Qv:Qv,leak:leak,S:S,v:v,
    Avalve:Avalve,pump:pump,tNeed:tNeed,totalGas:totalGas,
    ok: (!pump || (pump>=S && tNeed<=t)) && Avalve>0};
}
function rVacuum(){
  var c=calcVacuum();
  if(!c.V) return '<h4>抽真空计算</h4><div class="hint">请填写型腔容积、压室尺寸等参数。</div>';
  return '<h4>抽真空计算 <span class="st">'+pill(c.ok?'ok':'warn', c.pump?(c.pump>=c.S?'真空能力满足':'真空能力不足'):'待填泵参数')+'</span></h4>'
   + KV([
      {k:'压室容积',       v:fmt(c.vSleeve,2), u:'L'},
      {k:'总抽气容积 V',   v:fmt(c.V,2), u:'L', red:true},
      {k:'目标真空度 P₁',  v:fmt(c.P1,0), u:'mbar'},
      {k:'ln(P₀/P₁)',      v:fmt(c.ln,3)},
      {k:'允许抽气时间',   v:fmt(c.t,2),  u:'s'},
      {k:'平均抽气量 Qv',  v:fmt(c.Qv,2), u:'L/s', red:true},
      {k:'所需泵抽速 S',   v:fmt(c.S,1),  u:'m³/h', red:true},
      {k:'真空阀排气截面积', v:fmt(c.Avalve,1), u:'mm²', red:true},
      {k:'总抽气量',       v:fmt(c.totalGas,2), u:'L', red:true},

/* =========================================================================
 *  3.6 冷却：Q总 = C铝·M·ΔT + M·凝固潜热
 * ========================================================================= */
function calcCool(){
  var M=N('cwM')||(N('wCast')+N('wRunner')+N('wOverflow'));
  var C=N('cwC')||1.05, L=N('cwL')||389, dT=N('cwDT')||80;
  var Qs=C*M*dT, Ql=M*L, Q=Qs+Ql;                  // 显热 / 潜热 / 总热量 kJ
  var phi=N('cwPhi')||0.6, dTw=Math.max(0.5,N('cwDTw')||8);
  var W=Q*phi/(4.187*dTw);                          // 需水量 kg ≈ L
  var tAllow=N('cwTime');
  var flowNeed=tAllow?W/tAllow*60:0;                // 所需流量 L/min
  var flowAct=N('cwFlow');
  var tAct=flowAct?W/flowAct*60:0;                  // 实际冷却时间 s
  return {M:M,C:C,L:L,dT:dT,Qs:Qs,Ql:Ql,Q:Q,phi:phi,dTw:dTw,W:W,
    tAllow:tAllow,flowNeed:flowNeed,flowAct:flowAct,tAct:tAct,
    ok: (tAllow&&flowAct)?(tAct<=tAllow):true,
    ok2: (!flowAct||!tAllow)?true:(flowNeed<=flowAct)};
}
function rCool(){
  var c=calcCool();
  if(!c.M) return '<h4>冷却水计算</h4><div class="hint">请填写每次浇注金属量（由 2.1 自动带出）。</div>';
  var st = (c.tAllow&&c.flowAct)?(c.tAct<=c.tAllow?'ok':'bad'):'warn';
  return '<h4>冷却水量与冷却时间校核 <span class="st">'+pill(st, st==='ok'?'节拍满足':(st==='bad'?'冷却时间不足':'待填节拍/流量'))+'</span></h4>'
   + KV([
      {k:'每次浇注金属量 M', v:fmt(c.M,3), u:'kg'},
      {k:'显热 Q₁ = C·M·ΔT', v:fmt(c.Qs,0), u:'kJ'},
      {k:'潜热 Q₂ = M·L',     v:fmt(c.Ql,0), u:'kJ'},
      {k:'总热量 Q总',        v:fmt(c.Q,0),  u:'kJ', red:true},
      {k:'水冷分配系数 φ',    v:fmt(c.phi,2)},
      {k:'冷却水温升 Δt',     v:fmt(c.dTw,1),u:'K'},
      {k:'需水量 W',          v:fmt(c.W,1),  u:'L', red:true},
      {k:'节拍允许冷却时间',  v:c.tAllow?fmt(c.tAllow,0):'—', u:'s'},
      {k:'所需水流量',        v:c.flowNeed?fmt(c.flowNeed,1):'—', u:'L/min', red:true},
      {k:'实际设计水流量',    v:c.flowAct?fmt(c.flowAct,1):'—', u:'L/min'},
      {k:'实际所需冷却时间',  v:c.tAct?fmt(c.tAct,1):'—', u:'s', red:true}
     ])
   + verdict(st==='ok'?'ok':(st==='bad'?'bad':'warn'),
      '热平衡：需带走总热量 '+fmt(c.Q,0)+' kJ（其中潜热占比 '+fmt(c.Ql/Math.max(c.Q,1)*100,0)+'%），'
      + '按 '+fmt(c.phi*100,0)+'% 由冷却水带走、温升 '+fmt(c.dTw,1)+' K 计，需水量 '+fmt(c.W,1)+' L。'
      + (c.tAllow&&c.flowAct
        ? (' 实际水流量 '+fmt(c.flowAct,1)+' L/min 下所需冷却时间 '+fmt(c.tAct,1)+' s '
           + (c.tAct<=c.tAllow?'≤':'＞')+' 节拍允许 '+fmt(c.tAllow,0)+' s，'
           + (c.tAct<=c.tAllow?'节拍满足要求。':'冷却时间不足：建议加大水流量至 '+fmt(c.flowNeed,1)+' L/min，或对厚大热节增加点冷/局部高压冷却。'))
        : ' 请补充节拍允许冷却时间与实际设计水流量以完成校核。'));
}

/* =========================================================================
 *  5.3 压射系统参数
 * ========================================================================= */
function calcInject(){
  var D=N('injD'), Ag=N('injAg'), vol=N('injVol'), t=N('injT');
  var Ap=Math.PI*D*D/4;                        // 冲头面积 mm²
  var R=Ag?Ap/Ag:0;                            // 速率比
  var Q=vol&&t?vol*1000/t:0;                   // 体积流量 mm³/s
  var QL=Q/1e6;                                // L/s
  var vg=Ag?Q/Ag/1000:0;                       // 内浇口速度 m/s
  var vp=Ap?Q/Ap/1000:0;                       // 快压射速度 m/s
  var m=curMachine();
  var v0=m.v0||6;
  return {D:D,Ap:Ap,Ag:Ag,R:R,vol:vol,t:t,Q:Q,QL:QL,vg:vg,vp:vp,v0:v0,
    okVp: vp>0 && vp<=v0*0.8, mach:m};
}
function rInject(){
  var c=calcInject();
  if(!c.Ap||!c.Ag) return '<h4>压射系统参数</h4><div class="hint">请填写冲头直径与内浇口面积。</div>';
  // 按壁厚推荐内浇口速度区间
  var wall=N('wall'); var rec=null;
  GATE_SPEED_TABLE.forEach(function(r){
    var lo=parseFloat(r[0])||0;
    if(wall>=lo) rec=r;
  });
  if(!rec) rec=GATE_SPEED_TABLE[0];
  var rng=rec[1].split('~').map(function(x){return parseFloat(x);});
  var st = (c.vg>=rng[0]&&c.vg<=rng[1])&&c.okVp?'ok':'warn';
  return '<h4>压射系统参数 <span class="st">'+pill(st, st==='ok'?'参数匹配':'需复核')+'</span></h4>'
   + KV([
      {k:'冲头直径',     v:fmt(c.D,0),   u:'mm'},
      {k:'冲头面积 A冲', v:fmt(c.Ap,1),  u:'mm²'},
      {k:'内浇口面积 A内', v:fmt(c.Ag,1),u:'mm²'},
      {k:'速率比 R = A冲/A内', v:fmt(c.R,2), red:true},
      {k:'型腔体积',     v:fmt(c.vol,1), u:'cm³'},
      {k:'填充时间',     v:fmt(c.t,3),   u:'s'},
      {k:'体积流量 Q',   v:fmt(c.QL,2),  u:'L/s', red:true},
      {k:'内浇口速度 v_g', v:fmt(c.vg,1),u:'m/s', red:true},
      {k:'快压射速度 v_p', v:fmt(c.vp,2),u:'m/s', red:true},
      {k:'设备空压射速度', v:fmt(c.v0,1),u:'m/s'},
      {k:'壁厚',         v:fmt(wall,1),  u:'mm'},
      {k:'推荐内浇口速度', v:rec[1],     u:'m/s'}
     ])
   + verdict(st==='ok'?'ok':'warn',
      '速率比 R = A冲/A内 = '+fmt(c.R,2)+'（内浇口速度为压射速度的 '+fmt(c.R,1)+' 倍，常规区间 8 ~ 25）。内浇口速度 '+fmt(c.vg,1)+' m/s，'
      + (wall?('壁厚 '+fmt(wall,1)+' mm 对应推荐区间 '+rec[1]+' m/s，'+(c.vg>=rng[0]&&c.vg<=rng[1]?'处于推荐区间内。':'偏离推荐区间，建议调整内浇口面积至 '+fmt(c.Q/(Math.max((rng[0]+rng[1])/2,0.1)*1000),1)+' mm²。')):'')
      + ' 快压射速度 '+fmt(c.vp,2)+' m/s '+(c.okVp?'≤':'＞')+' 设备空压射速度的 80%（'+fmt(c.v0*0.8,2)+' m/s），'
      + (c.okVp?'压射能力可满足。':'需提高压射能力或增大冲头直径/延长填充时间。'));
}

/* =========================================================================
 *  5.6 PQ² 工艺窗口
 *  机器特性线：P = Pmax · (1 − (Q/Qmax)²)
 * ========================================================================= */
function calcPQ2(){
  var c=calcInject();
  var m=curMachine();
  var injF=N('injForce')||m.injForce;          // 压射力 kN
  var Pmax=c.Ap?injF*1000/c.Ap:0;              // 理论最大比压 MPa
  var Qmax=c.Ap?c.Ap*m.v0/1000:0;              // 最大流量 L/s（空压射速度 × 冲头面积）
  var Q=c.QL, Pneed=N('injIntP');              // 工艺点
  var Pline=Pmax*(1-Math.pow(Qmax?Q/Qmax:0,2));// 机器线在该流量下的可用比压
  var margin=Pline?(Pline-Pneed)/Pline*100:0;
  var pts=[];
  for(var i=0;i<=5;i++){
    var qq=Qmax*i/5;
    pts.push([fmt(qq,1), fmt(Pmax*(1-Math.pow(i/5,2)),1)]);
  }
  return {c:c,m:m,injF:injF,Pmax:Pmax,Qmax:Qmax,Q:Q,Pneed:Pneed,Pline:Pline,
    margin:margin,pts:pts, ok: Q<Qmax && Pline>=Pneed, good: Q<Qmax && Pline>=Pneed*1.15};
}
function rPQ2(){
  var p=calcPQ2();
  if(!p.Qmax||!p.Q) return '<h4>PQ² 工艺窗口</h4><div class="hint">请先在 5.3 填写冲头直径、内浇口面积、型腔体积与填充时间。</div>';
  return '<h4>PQ² 工艺窗口与设备匹配 <span class="st">'+pill(p.ok?'ok':'bad', p.good?'窗口充足':(p.ok?'余量偏小':'窗口不足'))+'</span></h4>'
   + KV([
      {k:'机型',          v:p.m.brand+' '+p.m.model, u:p.m.ton+'T'},
      {k:'压射力',        v:fmt(p.injF,0), u:'kN'},
      {k:'理论最大比压 Pmax', v:fmt(p.Pmax,1), u:'MPa', red:true},
      {k:'最大流量 Qmax', v:fmt(p.Qmax,1), u:'L/s', red:true},
      {k:'工艺点流量 Q',  v:fmt(p.Q,2),  u:'L/s', red:true},
      {k:'需求比压 P',    v:fmt(p.Pneed,1),u:'MPa', red:true},
      {k:'机器线可用比压', v:fmt(p.Pline,1),u:'MPa', red:true},
      {k:'压力余量',      v:fmt(p.margin,1),u:'%', red:true},
      {k:'流量占用率',    v:fmt(p.Q/p.Qmax*100,1), u:'%', red:true}
     ])
   + '<h4 style="margin-top:12px">机器特性线采样（P = Pmax·(1−(Q/Qmax)²)）</h4>'
   + ROT(['流量 Q (L/s)','可用比压 P (MPa)'], p.pts.map(function(x){return [{t:x[0],n:1},{t:x[1],n:1}];}))
   + verdict(p.ok?'ok':'bad',
      'PQ² 结论：工艺点 (Q='+fmt(p.Q,2)+' L/s, P='+fmt(p.Pneed,1)+' MPa) '
      + (p.good?'位于机器特性线下方且有 '+fmt(p.margin,1)+'% 压力余量（≥ 15%），设备匹配良好。':(p.ok?'位于机器特性线下方，但压力余量仅 '+fmt(p.margin,1)+'%（< 15%），可行但余量偏小，建议预留工艺调整空间。'
        : '已超出可用窗口（机器线可用 '+fmt(p.Pline,1)+' MPa，需求 '+fmt(p.Pneed,1)+' MPa）。'))
      + ' 优化方向：'+(p.ok
        ? '可按当前参数试模，建议填充时间控制在 '+fmt(p.c.t,3)+'±0.01 s，慢压射 '+fmt(N('injSlow'),2)+' m/s。'
        : '① 增大冲头直径以提高流量能力；② 降低需求比压（增大内浇口面积）；③ 换用更大压射力机型；④ 延长填充时间以减小瞬时流量。'));
}
