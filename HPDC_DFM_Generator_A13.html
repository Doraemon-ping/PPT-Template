  if(!L.length) body = '<tr><td colspan="'+(MACH_COLS.length+1)+'" style="padding:18px;text-align:center;color:var(--text-2)">库内暂无机型，点右上「＋ 新增机型」开始维护（或点「↺ 恢复出厂」）。</td></tr>';
  return '<thead><tr><th>操作</th>'+th+'</tr></thead><tbody>'+body+'</tbody>';
}
function renderMachModal(){
  var tbl = $('#machTbl'); if(!tbl) return;
  tbl.innerHTML = renderMachTable();
  var cnt = $('#machCnt');
  if(cnt) cnt.textContent = '共 '+machAll().length+' 个机型 · 当前选用：'+(curMachine()? machKey(curMachine()) : '无');
}
function openMachUI(){ renderMachModal(); $('#machMask').classList.add('on'); }
function closeMachUI(){ $('#machMask').classList.remove('on'); }

/* 写入某机型某字段（弹窗内即时编辑） */
function setMachField(i,k,val){
  var L = machAll(); if(!L[i]) return;
  if(MACH_COLS.filter(function(c){return c.k===k;}).length && MACH_NUM[k]) val = num(val);
  if(k==='punch'){
    L[i].punch = String(val).split(/[\/、,，\s]+/).map(function(x){ return num(x); }).filter(function(x){ return x>0; });
  } else if(MACH_NUM[k]){ L[i][k] = num(val); }
  else { L[i][k] = String(val); }
  /* 改动了当前机型 → 同步派生字段（锁模力/柱距/柱径/压射力/空压射等） */
  var isCur = machKey(L[i])===V('machineId');
  if(isCur){ fillMachine(); recalcDerived(); renderResults(); }
  save();
}
/* 新增机型：复制当前机型作模板，品牌型号留空强制填写 */
function machAddRow(){
  var L = machAll();
  var base = normMachine(curMachine() || {});
  base.brand=''; base.model='';
  L.push(base);
  save(); renderMachModal();
  var inp = document.querySelector('[data-mk="'+(L.length-1)+'"][data-mf="brand"]');
  if(inp){
    if(inp.focus) try{ inp.focus(); }catch(e){}
    if(inp.scrollIntoView) try{ inp.scrollIntoView({block:'nearest'}); }catch(e){}
  }
}
function machDelRow(i){
  var L = machAll(); var m = L[i]; if(!m) return;
  if(L.length<=1){ toast('至少保留一个机型'); return; }
  if(!confirm('确定删除机型「'+machKey(m)+'」？')) return;
  var wasCur = machKey(m)===V('machineId');
  L.splice(i,1);
  if(wasCur) { S.f.machineId = machKey(L[0]); fillMachine(); recalcDerived(); }
  save(); renderMachModal(); renderResults();
  toast('已删除机型：'+machKey(m));
}
function machMove(i,dir){
  var L = machAll(); var j = i+dir;
  if(j<0 || j>=L.length) return;
  var t = L[i]; L[i]=L[j]; L[j]=t;
  save(); renderMachModal();
}
function machUse(i){
  var L = machAll(); var m = L[i]; if(!m) return;
  if(!machValid(m)){ toast('该机型品牌 / 型号 / 锁模力不完整，请先补全'); return; }
  S.f.machineId = machKey(m);
  fillMachine(); recalcDerived(); renderResults(); save();
  renderMachModal();
  toast('已选用机型：'+machKey(m)+' · '+fmt(m.ton,0)+'T');
}
function machRestoreDefault(){
  if(!confirm('恢复出厂机型库将丢弃你在设备库中的所有增删改，是否继续？')) return;
  S.mach = { list: defaultMachCopy() };
  if(!machById(V('machineId'))) S.f.machineId = machKey(S.mach.list[2] || S.mach.list[0]);
  fillMachine(); recalcDerived(); renderResults(); save();
  renderMachModal();
  toast('已恢复出厂机型库（'+S.mach.list.length+' 个机型）');
}

/* 弹窗事件（委托，仅绑定一次） */
(function bindMachUI(){
  var mask = $('#machMask'); if(!mask) return;
  mask.addEventListener('input', function(e){
    var inp = e.target.closest('input[data-mk]'); if(!inp) return;
    setMachField(+inp.getAttribute('data-mk'), inp.getAttribute('data-mf'), inp.value);
    /* 必填缺失即时红纹提示 */
    var i=+inp.getAttribute('data-mk'), m=machAll()[i];
    if(m && MACH_NUM[inp.getAttribute('data-mf')]===undefined){
      inp.classList.toggle('w-empty', String(inp.value).trim()==='' && /brand|model/.test(inp.getAttribute('data-mf')));
    }
  });
  mask.addEventListener('click', function(e){
    if(e.target===mask){ closeMachUI(); return; }
    var b;
    if((b=e.target.closest('[data-muse]')))  { machUse(+b.getAttribute('data-muse')); return; }
    if((b=e.target.closest('[data-mdel]')))  { machDelRow(+b.getAttribute('data-mdel')); return; }
    if((b=e.target.closest('[data-mup]')))   { machMove(+b.getAttribute('data-mup'),-1); return; }
    if((b=e.target.closest('[data-mdown]'))) { machMove(+b.getAttribute('data-mdown'),1); return; }
  });
  $('#machClose').addEventListener('click', closeMachUI);
  $('#machAdd').addEventListener('click', machAddRow);
  $('#machRestore').addEventListener('click', machRestoreDefault);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeMachUI(); });
})();
function rGateSpeed(){
  return ROT(['铸件壁厚 mm','内浇口速度 m/s','说明'],
    GATE_SPEED_TABLE.map(function(r){ return [r[0], {t:r[1],hi:true}, r[2]]; }));
}

  });
}

function T(k, d){ var v = V(k); return (v === '' || v === null || v === undefined) ? (d === undefined ? '—' : d) : String(v); }
function stripTags(s){
  return String(s||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&nbsp;/g,' ');
}
/* 复用界面计算结论：抽取 verdict 文本，保证界面与 PPT 完全一致 */
function verdictOf(fn){
  try{
    var h = fn();
    var m = h.match(/<div class="verdict[^"]*">([\s\S]*?)<\/div>/);
    return m ? stripTags(m[1]) : '';
  }catch(e){ return ''; }
}
/* ----- "拓普"水印：白色背景 + 重复斜向灰字水印 + 右上 LOGO ----- */
function _addWatermark(slide){
  // 三行×三列 共 9 个"拓普"，轻微旋转形成均匀斜向水印
  var W = PW, H = PH, txt = '拓普';
  var rows = [{y:1.0, xOff:-1.4}, {y:3.0, xOff:0.4}, {y:5.0, xOff:-1.0}, {y:6.8, xOff:0.7}];
  var cols = [-1.1, 2.4, 5.9, 9.4, 12.4];
  var i = 0;
  rows.forEach(function(r){
    cols.forEach(function(cx){
      var x = cx + r.xOff;
      if(x < -1.5 || x > W + 0.5) return;
      // 偶数索引文字正向，奇数索引旋转，营造交错感
      var rotate = (i % 2 === 0) ? -18 : 18;
      slide.addText(txt, {
        x:x, y:r.y, w:3.2, h:1.2,
        fontSize:46, color:'EAEEF3', bold:true,
        fontFace:FONT, align:'center', valign:'middle',
        rotate:rotate, transparency:60
      });
      i++;
    });
  });
}

/* 分区导航条（模板核心视觉符号）
 * 模板实测：表格形状 @0.29,1.74cm，宽 33.36cm，4 段「压铸|产品分析|工艺分析|模流分析」，sz16，
 *          分隔竖线 D0D3E3，当前段高亮 accent1。active 可传分区名或章节号。 */
function addSectionNav(s, active){
  if(active && /^[0-9]/.test(String(active))) active = NAV_MAP[String(active).charAt(0)] || '';
  var n = NAV_ITEMS.length, gap = 0.06;
  var segW = 2.05;
  var x0 = LAY.bodyX, y0 = LAY.navY;
  for(var i=0;i<n;i++){
    var on = (NAV_ITEMS[i] === active);
    var cx = x0 + i * (segW + gap);
    // 底纹条（模板 D0D3E3 横向底）
    s.addShape('rect', {x:cx, y:y0, w:segW, h:0.26,
      fill:{color:on ? C_BLUE : C_HEAD}, line:{color:C_HEAD, width:0.5}});
    s.addText(NAV_ITEMS[i], {x:cx, y:y0, w:segW, h:0.26, fontSize:on?11:10,
      bold:on, color:on ? 'FFFFFF' : '5A6478', align:'center', valign:'middle', fontFace:FONT});
  }
  // 右侧贯通细线（模板 33.36cm 横条视觉）：紧接最后一段，延伸到安全区右边界
  var lineX = x0 + n * (segW + gap);
  var lineW = LAY.navX + LAY.navW - lineX;
  if(lineW > 0.2) s.addShape('rect', {x:lineX, y:y0+0.115, w:lineW, h:0.03,
    fill:{color:C_HEAD}, line:{color:C_HEAD, width:0}});
  // 顶部细横线（分区条上方分隔，模板视觉）
  s.addShape('rect', {x:x0, y:y0-0.06, w:LAY.navW, h:0.02,
    fill:{color:C_HEAD}, line:{color:C_HEAD, width:0}});
}
/* 页面骨架：标题栏 + 英文副题 + 分区导航条（全部按模板实测落位） */

/* 通用表格：head 表头数组，rows 二维数组（元素可为字符串或 {t,hi,n}） */
function addTbl(s, head, rows, o){
  o = o || {};
  var fs = o.fs || 9;
  var data = [head.map(function(t){
    return {text:String(t), options:{fill:{color:C_HEAD},color:'20304A',bold:true,fontSize:fs,
      align:'center',valign:'middle',margin:[2,4,2,4]}};
  })];
  rows.forEach(function(r){
    data.push(r.map(function(c){
      var isObj = (c && typeof c === 'object');
      var t = isObj ? c.t : c;
      var hi = isObj && c.hi;
      return {text:String(t === undefined || t === null ? '' : t),
        options:{fontSize:fs, color:hi?C_RED:'333333', bold:!!hi,
          align:(isObj && c.n)?'right':'left', valign:'middle', margin:[2,4,2,4]}};
    }));
  });
  var opt = {x:o.x===undefined?0.52:o.x, y:o.y, w:o.w||12.685, colW:o.colW,
    border:{type:'solid',pt:0.5,color:C_BD}, fontFace:FONT, fontSize:fs,
    color:'333333', valign:'middle', autoPage:false, fill:{color:'FFFFFF'}};
  if(o.rowH) opt.rowH = o.rowH;
  if(o.colW) opt.colW = o.colW;
  s.addTable(data, opt);
}
/* 关键指标表：items = [{k,v,u,red}]，两列成对排布 */
function addKV(s, items, x, y, w){
  x=(x===undefined)?0.52:x; w=w||12.685; y=(y===undefined)?1.37:y;
  var per=4, gap=0.18, rh=0.62, rgap=0.12;
  var rows=Math.ceil(items.length/per);
  for(var r=0;r<rows;r++){
    var rowItems=items.slice(r*per, r*per+per);
    var cw=(w-gap*(rowItems.length-1))/rowItems.length;
    for(var i=0;i<rowItems.length;i++){
      var it=rowItems[i], cx=x+i*(cw+gap), cy=y+r*(rh+rgap);
      s.addShape('rect',{x:cx,y:cy,w:cw,h:rh,fill:{color:'F7F9FB'},line:{color:'DDE5ED',width:0.75}});
      s.addText(String(it.v)+(it.u?(' '+it.u):''),{x:cx,y:cy+0.02,w:cw,h:0.30,fontSize:14,bold:true,
        color:it.red?'C62828':'0F172A',align:'center',valign:'middle',fontFace:FONT});
      s.addText(String(it.k),{x:cx,y:cy+0.30,w:cw,h:0.20,fontSize:8,color:'5C6C7D',align:'center',valign:'middle',fontFace:FONT});
    }
  }
}
/* 结论条 */
function addVerdict(s, text, y, x, w, status){
  if(!text) return;
  var st = status && ST && ST[status] ? ST[status] : null;
  var col = st ? st.c : '1F3A5F';
  var bg  = status==='ok' ? 'EAF6EE' : (status==='bad' ? 'FDEEEE' : (status==='warn' ? 'FDF6E7' : 'F2F5F9'));
  var ln  = st ? st.c : C_ORANGE;
  s.addText((st ? ('● '+st.t+'　') : '')+text, {x:x===undefined?0.4:x, y:y, w:w||9.2, h:0.95, fontSize:10, fontFace:FONT,
    color:col, fill:{color:bg}, line:{color:ln,width:0.75}, valign:'top', margin:[4,6,4,6]});
}
/* 图片插入：最多 max 张横排；无图则画占位框 */
function addImgs(s, key, x, y, w, h, max){
  var arr = (S.i[key]||[]).slice(0, max||2);
  if(!arr.length){ return false; }   /* 无图时不渲染占位灰框，避免人工二次排版 */
  var n = arr.length, gap = 0.12, iw = (w - gap*(n-1))/n;
  for(var i=0;i<n;i++) s.addImage({data:arr[i], x:x+i*(iw+gap), y:y, w:iw, h:h});
  return true;
}
/* 直接按图片数组渲染（问题清单优化前 / 优化后） */
function addIssueImgs(s, arr, x, y, w, h, max){
  arr = (arr||[]).slice(0, max||2);
  if(!arr.length){
    s.addShape('rect', {x:x, y:y, w:w, h:h, fill:{color:'F7F9FB'}, line:{color:'DDE3EA',width:0.5}});
    s.addText('（未上传图片）', {x:x, y:y, w:w, h:h, fontSize:10, color:'8A99A8',
      align:'center', valign:'middle', fontFace:FONT});
    return false;
  }
  var n = arr.length, gap = 0.12, iw = (w - gap*(n-1))/n;
  for(var i=0;i<n;i++) s.addImage({data:arr[i], x:x+i*(iw+gap), y:y, w:iw, h:h});
  return true;
}
/* 文本块（自动处理换行） */
function addBlock(s, title, text, x, y, w, h){

/* =====================  生成主流程  ===================== */
function genPPT(){
  if(typeof PptxGenJS === 'undefined'){ toast('PptxGenJS 未加载，请检查网络'); return; }
  mask(true,'正在生成工艺示意图…');
  setTimeout(function(){
    var finished = false;
    var done = function(){
      if(finished) return; finished = true;
      try{ buildPPT(); }
      catch(e){ mask(false); toast('生成失败：'+e.message); console.error(e); }
    };
    var timer = setTimeout(done, 5000);              // 保险：5 s 未就绪也继续
    try{
      vizPreload(function(){ clearTimeout(timer); mask(true,'正在生成 PPT…'); done(); });
    }catch(e){ clearTimeout(timer); done(); }
  }, 60);
}

/* ================= 参数驱动 SVG 示意图引擎（仅用于 PPT 输出，界面不显示） ================= */
var VIZW = 760, VIZH = 380;
var VIZPNG = {};
function svT(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="'+(o.fs||12)+'" fill="'+(o.c||'#334155')+'"'+(o.a?' text-anchor="'+o.a+'"':'')+(o.b?' font-weight="700"':'')+'>'+String(s===undefined||s===null?'':s)+'</text>';}
function svR(x,y,w,h,o){o=o||{};return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(o.f||'none')+'" stroke="'+(o.s||'#94a3b8')+'" stroke-width="'+(o.sw||1)+'"'+(o.r?' rx="'+o.r+'"':'')+'/>';}
function svL(x1,y1,x2,y2,o){o=o||{};return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(o.s||'#94a3b8')+'" stroke-width="'+(o.sw||1)+'"'+(o.d?' stroke-dasharray="'+o.d+'"':'')+'/>';}
function svC(x,y,r,o){o=o||{};return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(o.f||'none')+'" stroke="'+(o.s||'#94a3b8')+'" stroke-width="'+(o.sw||1)+'"/>';}
function svArr(x1,y1,x2,y2,c){c=c||'#ff6a00';
  var a=Math.atan2(y2-y1,x2-x1),hl=7;
  return svL(x1,y1,x2,y2,{s:c,sw:2})+
    '<polygon points="'+x2+','+y2+' '+(x2-hl*Math.cos(a-0.45))+','+(y2-hl*Math.sin(a-0.45))+' '+(x2-hl*Math.cos(a+0.45))+','+(y2-hl*Math.sin(a+0.45))+'" fill="'+c+'"/>';}
function svP(x,y,w,h,label,val,unit,col,maxH){
  var bh=Math.max(6,Math.min(maxH, h));
  return svR(x,y+bh-bh,w,bh,{f:col,s:col,r:2}) +
    svT(x+w/2,y+bh-bh-8,val+(unit||''),{fs:13,b:true,c:'#0f172a',a:'middle'}) +
    svT(x+w/2,y+maxH+18,label,{fs:11,c:'#5c6c7d',a:'middle'});
}
function svWrap(inner){
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+VIZW+'" height="'+VIZH+'" viewBox="0 0 '+VIZW+' '+VIZH+'">'
    + '<rect width="'+VIZW+'" height="'+VIZH+'" fill="#ffffff"/>' + inner + '</svg>';
}
function svBox(x,y,w,h,title){
  return svR(x,y,w,h,{f:'#f8fafc',s:'#dde5ed',r:6}) + svT(x+10,y+18,title,{fs:12,b:true,c:'#1f5f8b'});
}

  s+=svT(140,base+18,'包紧力 '+fmt(dyn,2)+' t',{fs:11,c:'#5c6c7d',a:'middle'});

  s+=svT(620,base-fh-8,fmt(fix,2)+' t',{fs:13,b:true,c:'#0f172a',a:'middle'});

  s+=svT(620,base+18,'包紧力 '+fmt(fix,2)+' t',{fs:11,c:'#5c6c7d',a:'middle'});

/* ---- SVG 转 PNG（异步，生成 PPT 前预载） ---- */
function svgToPng(svg, cb){
  try{
    var img=new Image();
    var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    img.onload=function(){
      var cv=document.createElement('canvas');
      cv.width=VIZW*2; cv.height=VIZH*2;
      var cx=cv.getContext('2d');
      cx.fillStyle='#ffffff'; cx.fillRect(0,0,cv.width,cv.height);
      cx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      try{ cb(cv.toDataURL('image/png')); }catch(e){ cb(null); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
    img.src=url;
  }catch(e){ cb(null); }
}
function vizPreload(done){
  var keys=Object.keys(VIZ), i=0;
  (function next(){
    if(i>=keys.length){ done(); return; }
    var k=keys[i++], svg=null;
    try{ svg=VIZ[k](); }catch(e){ svg=null; }
    if(!svg){ next(); return; }
    svgToPng(svg, function(png){ if(png) VIZPNG[k]=png; next(); });
  })();
}

  /*
   * 27b~36b 模流缺陷标注页
   * 版式：左 = 原图 + 标注图上下对照；右 = 缺陷清单表（类型 / 严重度 / 复核）
   * 说明：标注图由 visionAnnotatedDataURL() 用 canvas 把框烧进图片后导出，
   *       因此 WPS / Office 无需任何插件即可正确显示。
   */
  FLOW_ITEMS.forEach(function(it, idx){
    var vk = it.k+'Def';
    var box = S.v[vk];
    var list = (box && box.defects) || [];
    if(!list.length) return;                       /* 无标注则不出页，避免空白页 */
    if(!(S.i[it.k+'Img']||[]).length) return;      /* 无云图则标注页无意义，同样跳过 */
    var s = newSlide(pptx,'6 模流分析','6.'+(idx+1)+'b '+it.t.replace(/^\d+\s*/,'')+'　—　缺陷位置标注与复核');
    /* 右侧清单表 */
    var colMap = {'高':'C0392B','中':'BA7517','低':'3B6D11'};
    var rowNo = 0, rows = [], done = 0;
    list.slice().sort(function(a,b){ return (a.img||0)-(b.img||0); }).forEach(function(d){
      rowNo++;
      if(d.verdict) done++;
      rows.push([
        {t:'#'+rowNo, n:1},
        '云图 '+((d.img||0)+1),
        d.type||'—',
        {t:(d.severity||'中'), hi:(d.severity==='高')},
        'x'+d.x.toFixed(3)+'  y'+d.y.toFixed(3),
        d.advice||'—',
        d.verdict ? (VERDICT_LABEL[d.verdict]||d.verdict) : '未复核'
      ]);
    });
    addTbl(s, ['序号','云图','缺陷类型','严重度','归一化位置','处理建议','人工复核'],
      rows, {x:7.05,y:1.37,w:6.0,fs:7.5,rowH:0.26,colW:[0.62,0.72,1.05,0.72,1.55,2.24,1.10]});
    /* 左侧：原图 / 标注图 对照（按第 0 张云图输出，多图时给出前 2 组） */
    var groups = Math.min(2, (S.i[it.k+'Img']||[]).length);
    for(var gi=0; gi<groups; gi++){
      var y0 = 1.45 + gi*2.45;
      if(y0+2.0 > 6.6) break;
      s.addText('原图（云图 '+(gi+1)+'）', {x:0.52,y:y0-0.22,w:2.9,h:0.2,fontSize:8,
        bold:true,color:C_DARK,fontFace:FONT,valign:'middle'});
      s.addText('标注图（缺陷框 + 编号）', {x:3.62,y:y0-0.22,w:3.2,h:0.2,fontSize:8,
        bold:true,color:C_DARK,fontFace:FONT,valign:'middle'});
      var raw = (S.i[it.k+'Img']||[])[gi];
      if(raw) s.addImage({data:raw, x:0.52, y:y0, w:2.4, h:1.55});
      var ann = visionAnnotatedDataURL(vk, gi, {maxW:1100});
      if(ann) s.addImage({data:ann, x:2.95, y:y0, w:2.4, h:1.55});
      else{
        s.addShape('rect',{x:2.95,y:y0,w:2.4,h:1.55,fill:{color:'F7F9FB'},line:{color:'DDE3EA',width:0.5}});
        s.addText('（标注图待生成）',{x:2.95,y:y0,w:2.4,h:1.55,fontSize:8,color:'8A99A8',
          align:'center',valign:'middle',fontFace:FONT});
      }
    }
    addVerdict(s, '本页共 '+list.length+' 处缺陷，已人工复核 '+done+' 处。'
      +(done<list.length ? '未复核的标注仅供参考，请在工具中确认后再对外发布。'

var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){

    try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
    catch(e){
      // 超限降级 1：先丢视频（体积最大）后保存
      try{
        var light = {f:S.f, t:S.t, i:{}, v:S.v, mach:S.mach, quote:S.quote};
        Object.keys(S.i).forEach(function(k){ if(!/Vid$/.test(k)) light.i[k]=S.i[k]; });
        localStorage.setItem(LS_KEY, JSON.stringify(light));
        toast('存储超上限，已保存表单与图片（视频未保存）');
      }catch(e2){
        // 超限降级 2：仅保存表单数据与缺陷标注（不含图片）
        try{
          localStorage.setItem(LS_KEY, JSON.stringify({f:S.f, t:S.t, i:{}, v:S.v, mach:S.mach, quote:S.quote}));
          toast('存储超上限，已保存表单与缺陷标注（图片与视频未保存）');

      }

}
function mergeState(o){
  initState();
  if(!o) return;
  if(o.f) Object.keys(o.f).forEach(function(k){ S.f[k]=o.f[k]; });
  if(o.t) Object.keys(o.t).forEach(function(k){
    S.t[k]=o.t[k];
    // 兼容旧数据：问题清单缺 before/after 时补齐
    if(k==='issues' && Array.isArray(S.t[k])){
      S.t[k].forEach(function(r){ if(!Array.isArray(r.before)) r.before=[]; if(!Array.isArray(r.after)) r.after=[]; });
    }
  });
  if(o.i) Object.keys(o.i).forEach(function(k){ S.i[k]=o.i[k]; });
  // 兼容旧数据：缺陷标注桶；并校验缺陷条目字段完整性
  if(o.mach && Array.isArray(o.mach.list)){
    S.mach = { list: o.mach.list.map(normMachine).filter(machValid) };
    if(!S.mach.list.length) S.mach.list = defaultMachCopy();
  }
  if(o.v) Object.keys(o.v).forEach(function(k){
    var box = o.v[k]||{};
    S.v[k] = {
      curImg: Math.max(0, parseInt(box.curImg,10)||0),
      defects: Array.isArray(box.defects) ? box.defects.map(normDefect) : []
    };
  });
  Object.keys(S.v).forEach(function(k){
    if(!S.v[k] || !Array.isArray(S.v[k].defects)) S.v[k] = {defects:[]};
  });
  // 模具报价：价格库 + 报价单清洗（兼容旧项目缺失 quote）
  var _qLoaded=false;
  if(o.quote && typeof o.quote==='object'){
    var q=o.quote;
    if(q.db && Array.isArray(q.db.records) && q.db.records.length){
      var base=JSON.parse(JSON.stringify(Q_DEFAULT_DB));
      Object.keys(q.db).forEach(function(k){ base[k]=q.db[k]; });
      base.records = q.db.records
        .filter(function(r){ return r && typeof r==='object'; })
        .map(function(r,i){
          return {
            id:(r.id==null?i+1:r.id),
            cat:['模具','工装','配件'].indexOf(r.cat)>=0?r.cat:'',
            sub:r.sub||'', name:r.name||'', mat:(r.mat==null?'*':r.mat),
            ton:r.ton||'', diff:r.diff||'',
            price:(r.price===null||r.price===''||r.price===undefined)?null:(parseFloat(r.price)||0),
            tax:(r.tax==='含税'?'含税':'未税'),
            unit:r.unit||'付', note:r.note||''
          };
        });
      if(base.records.length) S.quote.db=base;
    }
    if(Array.isArray(q.sheet)){
      S.quote.sheet = q.sheet
        .filter(function(it){ return it && typeof it==='object' && it.key; })
        .map(function(it){
          return { key:String(it.key), cat:it.cat||'', desc:it.desc||'',
                   unit:(parseFloat(it.unit)||0), qty:Math.max(1, parseFloat(it.qty)||1) };
        });
    }
    if(q.meta && typeof q.meta==='object'){ S.quote.meta = q.meta; }
    _qLoaded=true;
  }
  if(_qLoaded) qBuildIndex();   /* 价格库导入后立即重建索引，避免取到过期价 */
}
/* 缺陷条目标准化：保证坐标 / 字段完整，兼容未来模型输出的部分字段 */
function normDefect(d){
  d = d || {};
  function n(x, dv){ var v = parseFloat(x); return isFinite(v)?v:dv; }
  return {
    id:        d.id || ('d'+Math.random().toString(36).slice(2,8)),
    img:       n(d.img, 0),                                    // 所属云图序号（0 起）
    x:         Math.min(1, Math.max(0, n(d.x, 0))),            // 归一化左上角
    y:         Math.min(1, Math.max(0, n(d.y, 0))),
    w:         Math.min(1, Math.max(0.005, n(d.w, 0.08))),     // 归一化宽高
    h:         Math.min(1, Math.max(0.005, n(d.h, 0.08))),
    type:      d.type || '待判定',
    severity:  (d.severity==='高'||d.severity==='中'||d.severity==='低') ? d.severity : '中',
    advice:    d.advice || '',
    confidence:n(d.confidence, 0),
    source:    d.source || 'manual',                           // rule | manual | model
    verdict:   d.verdict || ''                                 // ok | partial | no | ''
  };
}

function importJSON(file){
  var fr = new FileReader();
  fr.onload = function(e){
    try{

      toast('导入成功');
    }catch(err){ toast('导入失败：'+err.message); }
  };
  fr.readAsText(file);
}

function boot(){
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ saved = null; }
  /* A13 使用独立存储键；首次启动复制 A12 数据，保留 A12 原项目可回退。 */
  if(!saved){
    try{
      var legacy = JSON.parse(localStorage.getItem(LEGACY_LS_KEY)||'null');
      if(legacy){
        saved = legacy;
        localStorage.setItem(LS_KEY, JSON.stringify(legacy));
        toast('已从 A12 迁移项目数据，后续将按 A13 独立保存');
      }
    }catch(e2){ saved = null; }
  }
  mergeState(saved);
  if(!S.mach || !Array.isArray(S.mach.list) || !S.mach.list.length) S.mach = { list: defaultMachCopy() };
  if(!S.f.machineId || !machById(S.f.machineId)) S.f.machineId = machKey(S.mach.list[2] || S.mach.list[0]);
  if(!V('machineId')) S.f.machineId = machKey(S.mach.list[0]);
  renderNav();
  renderMain();
  fillMachine();
  recalcDerived();
  renderResults();
}
