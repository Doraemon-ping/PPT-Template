{
  "schema_version": 1,
  "template_version": "1",
  "slide_type": "issue_standard",
  "template": "ISSUE_STANDARD",
  "fields": {
    "id": {"source": "id", "shape": "ISSUE_ID", "renderer": "text"},
    "title": {"source": "title", "shape": "ISSUE_TITLE", "renderer": "text", "options": {"max_length": 100}},
    "severity": {"source": "severity.value", "shape": "ISSUE_LEVEL", "renderer": "badge"},
    "description": {"source": "description", "shape": "ISSUE_DESCRIPTION", "renderer": "text", "options": {"max_length": 500}},
    "recommendation": {"source": "recommendation", "shape": "ISSUE_RECOMMENDATION", "renderer": "text", "options": {"max_length": 500}},
    "image": {"source": "images.main", "shape": "IMAGE_MAIN", "renderer": "complex_image", "required": false, "options": {"mode": "contain"}}
  }
}
