<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高压压铸 DFM 报告自动生成工具 · A12版</title>
<!-- PptxGenJS（含 JSZip，兼容 Office / WPS） -->
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{
  /* 浅色商务配色（部门橙 #FF6A00 主色） */
  --bg:#f4f6f9;        /* 页面底色 */
  --bg2:#ffffff;       /* 侧栏底色 */
  --panel:#ffffff;     /* 卡片底色 */
  --panel2:#f8fafc;    /* 卡片内嵌区 */
  --line:#e3e8ef;      /* 分隔线 */
  --line2:#d3dae4;     /* 输入边框 */
  --txt:#1f2328;       /* 主文字 */
  --muted:#6b7684;     /* 次文字 */
  --accent:#ff6a00;    /* 部门橙 */
  --accent2:#d95f00;   /* 浅底可读的深橙（用于文字） */
  --ok:#128a3c; --warn:#b8730a; --bad:#c62828;
  --rv:#c62828;        /* 计算结果红 */
  --rvbg:rgba(198,40,40,.06);
  --r:8px;
  --sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-size:13px;line-height:1.6;
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC","Heiti SC","Hiragino Sans GB","Source Han Sans SC","WenQuanYi Micro Hei","Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--txt)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c8cfd9;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--accent2)}

/* ---------- 顶部固定条 ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:80;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:linear-gradient(90deg,#FF6A00 0%,#FF8A33 100%);color:#fff;
  border-bottom:1px solid #e05500;box-shadow:0 2px 8px rgba(255,106,0,.26)}
.topbar .logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap;color:#fff}
.topbar .logo b{font-size:16px;font-weight:700;letter-spacing:.5px}
.topbar .logo span{font-size:11px;color:rgba(255,255,255,.9);font-weight:500}
.topbar .logo .ver{font-size:11px;color:#fff;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:11px;font-weight:600;letter-spacing:.3px}
.spacer{flex:1}
.tb-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:#fff;color:#3d444d;border-radius:6px;
  padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent);background:#fff5ee}
.btn.gh{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.55);color:#fff}
.btn.gh:hover{background:#fff;color:var(--accent);border-color:#fff}
.btn.pri{background:linear-gradient(180deg,#ff7a12,#e85d00);border-color:#ff8a2e;color:#fff;font-weight:700}
.btn.pri:hover{background:linear-gradient(180deg,#ff8c2e,#f26a00);color:#fff;border-color:#ffa04d}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.dg:hover{border-color:var(--bad);color:var(--bad);background:#fdecec}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- 布局 ---------- */
#nav{position:fixed;top:54px;left:0;bottom:0;width:262px;overflow-y:auto;background:var(--bg2);
  border-right:1px solid var(--line);z-index:70;padding:10px 0 60px;box-shadow:1px 0 3px rgba(16,24,40,.04)}
#main{margin:64px 0 0 262px;padding:16px 22px 120px;max-width:1500px}
@media(max-width:960px){
  #nav{transform:translateX(-100%);transition:transform .2s}
  #nav.show{transform:none}
  #main{margin-left:0}
  .hamburger{display:inline-flex !important}
}
.hamburger{display:none}

/* ---------- 导航树 ---------- */
.nav-mod{border-bottom:1px solid var(--line)}
.nav-mod > .nh{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;
  font-size:15px;font-weight:600;color:#3d444d}
.nav-mod > .nh:hover{background:#fff5ee;color:var(--accent)}
.nav-mod.open > .nh{background:#fff1e6;color:#c25200}
.nav-mod.active > .nh{background:#ffe2cc;color:#bf4d00;font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav-mod > .nh .ar{margin-left:auto;font-size:11px;color:#9aa4b2;transition:.2s}
.nav-mod.open > .nh .ar{transform:rotate(90deg)}
.nav-sub{display:none;padding:3px 0 10px 22px}
.nav-mod.open > .nav-sub{display:block}
.nav-sub a{display:block;padding:8px 12px;font-size:13.5px;color:#6b7684;text-decoration:none;
  border-left:2px solid transparent;border-radius:0 4px 4px 0}
.nav-sub a:hover{color:var(--accent);background:#fff5ee;border-left-color:var(--accent)}
.nav-sub a.active{color:var(--accent);font-weight:600;background:#fff1e6;border-left-color:var(--accent)}
.nav-tip{padding:10px 14px;font-size:11px;color:#8a94a3}
.nav-foot{padding:12px 14px;font-size:11px;color:#8a94a3;line-height:1.7}

/* ---------- 模块 / 卡片 ---------- */
.mod-hd{margin:22px 0 12px;padding-left:10px;border-left:4px solid var(--accent)}
.mod-hd h2{margin:0;font-size:18px;font-weight:700;letter-spacing:.5px;color:#1f2328}
.mod-hd p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px;overflow:hidden;box-shadow:var(--sh)}
.card > h3{margin:0;padding:9px 14px;font-size:13.5px;font-weight:600;color:#1f2328;
  background:linear-gradient(90deg,#f7f9fb,#f1f4f8);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card > h3 .tag{font-size:10.5px;font-weight:500;color:#7b8595;background:#fff;border:1px solid var(--line2);
  padding:1px 6px;border-radius:10px}
.card > h3 .sp{flex:1}
.card .body{padding:13px 14px}
.scroll-anchor{scroll-margin-top:70px}

/* ---------- 表单 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:10px 14px}
.grid.one{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label{font-size:11.5px;color:#5a6673;display:flex;align-items:center;gap:4px}
.field > label .u{color:#8a94a3}
.field .u{color:#8a94a3;font-size:11px}
.inp{width:100%;background:#fff;border:1px solid var(--line2);border-radius:5px;padding:6px 8px;
  color:var(--txt);outline:none;transition:.15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,106,0,.16)}
select.inp{cursor:pointer}
textarea.inp{min-height:64px;resize:vertical;line-height:1.6}
input[type=file]{font-size:11.5px}
.hint{font-size:11px;color:#8a94a3;line-height:1.5}
.note{background:#f8fafc;border:1px dashed #cfd8e3;border-radius:6px;padding:8px 10px;
  font-size:11.5px;color:#5a6673;line-height:1.65}
.note b{color:var(--accent)}
.formula{background:#f5f7fa;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 6px 6px 0;padding:8px 11px;font-size:12px;color:#33475f;margin:2px 0 10px;
  font-family:Consolas,"Courier New",monospace;overflow-x:auto;white-space:nowrap}

/* ---------- 计算结果 ---------- */
.result{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-top:4px}
.result h4{margin:0 0 8px;font-size:12.5px;color:#c25200;font-weight:600;display:flex;align-items:center;gap:8px}
.result h4 .st{margin-left:auto}
.rv{color:var(--rv);font-weight:700;font-size:14px;font-family:Consolas,monospace}
.rv-s{color:var(--rv);font-weight:700;font-family:Consolas,monospace}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px 14px}
.kv .k{font-size:11.5px;color:var(--muted)}
.kv .v{font-size:13px}
.verdict{margin-top:9px;padding:7px 10px;border-radius:5px;font-size:12px;line-height:1.65}
.v-ok{background:#e8f7ee;border:1px solid #a8dfc0;color:#0f7a37}
.v-warn{background:#fff6e3;border:1px solid #f0cf8a;color:#8a5a00}
.v-bad{background:#fdecec;border:1px solid #f0b4b4;color:#a51f1f}
.v-info{background:#eaf1fa;border:1px solid #b3cbe6;color:#1c4d80}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.p-ok{background:#e8f7ee;color:#0f7a37}
.p-warn{background:#fff6e3;color:#8a5a00}
.p-bad{background:#fdecec;color:#a51f1f}
.p-info{background:#eef1f5;color:#55637a}

/* ---------- 表格编辑器 ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
table.ed{border-collapse:collapse;width:100%;font-size:12px;min-width:520px}
table.ed th{background:#eef2f7;color:#33475f;font-weight:600;padding:6px 7px;text-align:left;
  border:1px solid var(--line);white-space:nowrap;font-size:11.5px}
table.ed td{border:1px solid var(--line);padding:2px 3px}
table.ed td input.inp,table.ed td select.inp{border:0;background:transparent;padding:4px 5px;border-radius:0}
table.ed td input.inp:focus,table.ed td select.inp:focus{box-shadow:none;background:#fff7f1}
table.ed td.num{text-align:right;font-family:Consolas,monospace}
.tbl-bar{display:flex;gap:6px;align-items:center;padding:8px 0 6px;flex-wrap:wrap}

/* ---------- 只读数据表 ---------- */
table.ro{border-collapse:collapse;width:100%;font-size:12px}
table.ro th{background:#eef2f7;color:#33475f;padding:6px 8px;border:1px solid var(--line);
  font-weight:600;text-align:left;font-size:11.5px;white-space:nowrap}
table.ro td{padding:5px 8px;border:1px solid var(--line);text-align:left}
table.ro td.n{text-align:right;font-family:Consolas,monospace}
table.ro tr:nth-child(even) td{background:#fafbfc}
table.ro td.hi{color:var(--rv);font-weight:700;font-family:Consolas,monospace}

/* ---------- 图片 ---------- */
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.imgs .thumb{position:relative;width:132px;height:92px;border:1px solid var(--line2);border-radius:6px;
  overflow:hidden;background:#f4f6f9;cursor:zoom-in}
.imgs .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgs .thumb .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;
  border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:20px;padding:0}
.imgs .thumb .del:hover{background:var(--bad)}
.imgs .add{width:132px;height:92px;border:1px dashed #cfd8e3;border-radius:6px;display:grid;
  place-items:center;color:#8a94a3;font-size:11.5px;cursor:pointer;background:#fafbfc;text-align:center;padding:6px}
.imgs .add:hover{border-color:var(--accent);color:var(--accent);background:#fff5ee}

/* ---------- Toast / 遮罩 ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:#fff;border:1px solid var(--accent);color:#1f2328;padding:9px 18px;border-radius:22px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 6px 20px rgba(16,24,40,.18)}
#toast.on{opacity:1;transform:translateX(-50%)}
#mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;display:none;
  place-items:center;backdrop-filter:blur(2px)}
#mask.on{display:grid}
#mask .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 30px;
  text-align:center;min-width:280px;box-shadow:0 10px 30px rgba(16,24,40,.2)}
.spin{width:34px;height:34px;margin:0 auto 12px;border:3px solid #e3e8ef;border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:400;display:none;place-items:center;cursor:zoom-out}
#lightbox.on{display:grid}
#lightbox img{max-width:94vw;max-height:94vh;border-radius:6px}
.sec-gap{height:6px}
.mod .mod-hd .tag,.tag{display:inline-block;font-size:11.5px;color:#c2410c;background:#fff4ec;
  border:1px solid #ffd2ad;border-radius:6px;padding:2px 8px;font-weight:600}
</style>

<body>

<header class="topbar">
  <button class="btn gh hamburger" id="btnNav" style="border-color:rgba(255,255,255,.55);color:#fff">☰</button>
  <div class="logo"><b>HPDC · DFM 报告自动生成工具</b><span class="ver">v1.0</span></div>
  <div class="spacer"></div>
  <div class="tb-actions">
    <button class="btn" id="btnSave">💾 保存项目</button>
    <button class="btn" id="btnExport">⬇ 导出 JSON</button>
    <button class="btn" id="btnImport">⬆ 导入 JSON</button>

    <button class="btn pri" id="btnPPT">⚡ 生成 PPT</button>
  </div>
  <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
</header>

<aside id="nav"></aside>
<main id="main"></main>

<div id="toast"></div>
<div id="mask"><div class="box"><div class="spin"></div><div id="maskTxt">正在生成 PPT…</div></div></div>

<script>
"use strict";
/* =========================================================================
 *  高压压铸 DFM 报告自动生成工具 —— 单文件纯前端版
 *  结构：① 常量与设备库 ② 表单 Schema ③ 渲染引擎 ④ 工艺计算引擎 ⑤ PPT 导出
 * ========================================================================= */

/* ---------- 通用工具 ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function fmt(v,d){d=(d===undefined)?2:d;var n=parseFloat(v);return isFinite(n)?n.toFixed(d):'-';}
function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},2600);}
function mask(on,txt){if(txt)$('#maskTxt').textContent=txt;$('#mask').classList[on?'add':'remove']('on');}
function lightbox(src){if(!src){$('#lightbox').classList.remove('on');return;}
  $('#lbImg').src=src;$('#lightbox').classList.add('on');}
$('#lightbox').addEventListener('click',function(){lightbox(null);});

/* ---------- 单位常量 ---------- */
var TON_N = 9806.65;      // 1 吨力(tf) = 9806.65 N
var N_TON = 1/9806.65;    // N -> 吨力
var KN_TON = 1/9.80665;   // kN -> 吨力
var RHO_AL = 2.7e-6;      // 铝合金密度 kg/mm³ (2.7 g/cm³)

/* =========================================================================
 *  ① 压铸机参数库（力劲 / 布勒，参考数据，可按实际设备维护）
 * ========================================================================= */
var MACHINES = [
  {brand:'力劲 LK',model:'DCC7200',ton:7200,lock:72000,open:1600,moldMin:900,moldMax:2000,
   tie:'2100×2100',tieDia:280,injForce:1200,injStroke:1600,punch:[160,180,200,220],v0:6.0,
   ejForce:1200,ejStroke:400,plate:'2400×2400'},
  {brand:'力劲 LK',model:'DCC4500',ton:4500,lock:45000,open:1300,moldMin:750,moldMax:1700,
   tie:'1750×1750',tieDia:240,injForce:900,injStroke:1300,punch:[130,140,150,160,180],v0:6.5,
   ejForce:900,ejStroke:350,plate:'2050×2050'},
  {brand:'力劲 LK',model:'DCC3000',ton:3000,lock:30000,open:1150,moldMin:600,moldMax:1500,
   tie:'1500×1500',tieDia:210,injForce:700,injStroke:1150,punch:[110,120,130,140,160],v0:7.0,
   ejForce:700,ejStroke:300,plate:'1780×1780'},
  {brand:'力劲 LK',model:'DCC2800',ton:2800,lock:28000,open:1100,moldMin:580,moldMax:1450,
   tie:'1450×1450',tieDia:200,injForce:650,injStroke:1100,punch:[100,110,120,130,150],v0:7.0,
   ejForce:650,ejStroke:300,plate:'1720×1720'},
  {brand:'力劲 LK',model:'DCC2000',ton:2000,lock:20000,open:950,moldMin:500,moldMax:1250,
   tie:'1250×1250',tieDia:180,injForce:500,injStroke:950,punch:[90,100,110,120,140],v0:7.5,
   ejForce:500,ejStroke:250,plate:'1500×1500'},
  {brand:'力劲 LK',model:'DCC840',ton:840,lock:8400,open:700,moldMin:350,moldMax:900,
   tie:'900×900',tieDia:140,injForce:300,injStroke:700,punch:[60,70,80,90,100],v0:6.0,
   ejForce:300,ejStroke:200,plate:'1120×1120'},
  {brand:'布勒 Bühler',model:'Evolution 4400',ton:4400,lock:44000,open:1300,moldMin:700,moldMax:1750,
   tie:'1700×1700',tieDia:235,injForce:880,injStroke:1300,punch:[130,140,150,160,180],v0:6.5,
   ejForce:880,ejStroke:350,plate:'2000×2000'},
  {brand:'布勒 Bühler',model:'Evolution 4000',ton:4000,lock:40000,open:1250,moldMin:700,moldMax:1700,
   tie:'1650×1650',tieDia:225,injForce:820,injStroke:1250,punch:[130,140,150,160,170],v0:6.5,
   ejForce:820,ejStroke:350,plate:'1950×1950'},
  {brand:'布勒 Bühler',model:'Evolution 2800',ton:2800,lock:28000,open:1100,moldMin:580,moldMax:1450,
   tie:'1450×1450',tieDia:200,injForce:650,injStroke:1100,punch:[100,110,120,130,150],v0:7.0,
   ejForce:650,ejStroke:300,plate:'1720×1720'},
  {brand:'布勒 Bühler',model:'Evolution 1400',ton:1400,lock:14000,open:850,moldMin:450,moldMax:1100,
   tie:'1150×1150',tieDia:165,injForce:420,injStroke:850,punch:[80,90,100,110,120],v0:7.0,
   ejForce:420,ejStroke:250,plate:'1400×1400'},
  {brand:'布勒 Bühler',model:'Evolution 840',ton:840,lock:8400,open:700,moldMin:350,moldMax:900,
   tie:'900×900',tieDia:140,injForce:300,injStroke:700,punch:[60,70,80,90,100],v0:6.0,
   ejForce:300,ejStroke:200,plate:'1120×1120'}
];
function machineById(id){for(var i=0;i<MACHINES.length;i++){if(MACHINES[i].brand+' '+MACHINES[i].model===id)return MACHINES[i];}return null;}
function curMachine(){var m=machineById(V('machineId'));return m||MACHINES[2];}

/* ---------- 顶杆规格参考（∅4 ~ ∅12，许用应力 50 MPa） ---------- */
var EJECT_SPEC=[4,5,6,8,10,12].map(function(d){
  var A=Math.PI*d*d/4;                 // 截面积 mm²
  var F=50*A;                          // 许用顶出力 N（许用压应力 50 MPa）
  return {d:d,A:A,F:F,ton:F*N_TON,
    boss:d<=6?'建议加凸台':'视布置空间可选',   // 细长顶杆易失稳，建议加凸台增强
    mark:'凹入 0~0.2 mm'};                     // 顶杆痕迹凹入产品表面标识
});

/* ---------- 壁厚 - 内浇口速度经验对照表 ---------- */
var GATE_SPEED_TABLE=[
  ['≤1.5','45 ~ 60','薄壁件，需高速充填避免冷隔'],
  ['1.5 ~ 2.5','40 ~ 50','常规薄壁结构件'],

var S = {f:{}, t:{}, i:{}};
var LS_KEY = 'hpdc_dfm_project_a12';

/* 用 Schema 默认值初始化状态 */
function initState(){
  S = {f:{}, t:{}, i:{}};
  MODULES.forEach(function(m){
    m.groups.forEach(function(g){
      g.fields.forEach(function(f){
        if(f.type==='table'){ S.t[f.k] = JSON.parse(JSON.stringify(f.rows||[])); }
        else if(f.type==='images'){ S.i[f.k] = []; }
        else if(f.k){ S.f[f.k] = (f.def===undefined?'':f.def); }
      });
    });
  });
}
function V(k){ var v = S.f[k]; return (v===undefined||v===null)?'':v; }
function N(k){ return num(V(k)); }

/* ---------- 渲染：导航树 ---------- */
function renderNav(){
  var h = '';
  MODULES.forEach(function(m,i){
    h += '<div class="nav-mod'+(i===0?' open active':'')+'" data-mod="'+m.id+'">'
      +  '<div class="nh"><span>'+esc(m.name)+'</span><span class="ar">▶</span></div>'
      +  '<div class="nav-sub">';
    m.groups.forEach(function(g){
      h += '<a href="#'+g.id+'" data-g="'+g.id+'">'+esc(g.name)+'</a>';
    });
    h += '</div></div>';
  });
  h += '<div class="nav-foot">数据自动保存于本机浏览器<br>（localStorage · 不上传服务器）<br>图片已压缩至 ≤1280px</div>';
  $('#nav').innerHTML = h;

  $$('#nav .nh').forEach(function(el){
    el.addEventListener('click',function(){
      switchView(el.parentNode.getAttribute('data-mod'));
      if(window.innerWidth<=960) $('#nav').classList.remove('show');
    });
  });
  $$('#nav .nav-sub a').forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      var g = a.getAttribute('data-g');
      var mod = a.closest('.nav-mod');
      switchView(mod.getAttribute('data-mod'));
      $$('#nav .nav-sub a').forEach(function(x){ x.classList.remove('active'); });
      a.classList.add('active');
      var t = document.getElementById(g);
      if(t){ t.scrollIntoView({behavior:'smooth',block:'start'}); highlight(t); }
      if(window.innerWidth<=960) $('#nav').classList.remove('show');
    });
  });
}
function highlight(el){
  $$('.card').forEach(function(c){c.style.boxShadow='';});
  var card = el.classList.contains('card')?el:el.querySelector('.card');
  if(card){ card.style.boxShadow='0 0 0 2px var(--accent)';
    setTimeout(function(){card.style.boxShadow='';},1600); }
}

/* ---------- 渲染：主表单 ---------- */
function renderMain(viewId){
  if(!viewId) viewId = currentView || (MODULES[0] && MODULES[0].id);
  currentView = viewId;
  var m=null, idx=-1;
  for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id===viewId){ m=MODULES[i]; idx=i; break; } }
  var h='';
  if(m){
    h += '<section class="mod" id="'+m.id+'">';
    h += '<div class="mod-hd scroll-anchor"><h2>'+esc(m.name)+'</h2><p>'+esc(m.desc||'')+'</p></div>';
    m.groups.forEach(function(g){
      h += '<div class="card scroll-anchor" id="'+g.id+'">';
      h += '<h3><span>'+esc(g.name)+'</span>'+(g.desc?'<span class="tag">'+esc(g.desc)+'</span>':'')+'<span class="sp"></span></h3>';
      h += '<div class="body">';
      var grid=[], full=[];
      g.fields.forEach(function(f){
        if(f.type==='table'||f.type==='result'||f.type==='note'||f.type==='formula'||f.type==='machine') full.push(f);
        else grid.push(f);
      });
      if(grid.length){
        h += '<div class="grid">';
        grid.forEach(function(f){ h += renderField(f); });
        h += '</div>';
      }
      full.forEach(function(f){ h += renderField(f); });
      h += '</div></div>';
    });
    h += '</section>';
  }
  $('#main').innerHTML = h;
  if(!mainBound){ bindMain(); mainBound = true; }  // 仅绑定一次，避免重复 renderMain 叠加监听器
  renderResults();
  try{ $('#main').scrollTop = 0; }catch(e){}
}
var mainBound = false;
var currentView = null;
/* 切换到指定父模块的独立界面，并同步左侧导航高亮 */
function switchView(id){
  currentView = id;
  renderMain(id);
  $$('#nav .nav-mod').forEach(function(n){
    var on = n.getAttribute('data-mod')===id;
    n.classList.toggle('active', on);
    n.classList.toggle('open', on);
  });
}

function renderField(f){
  var v = V(f.k);
  if(f.type==='note') return '<div class="note">'+f.text+'</div>';
  if(f.type==='formula') return '<div class="formula">'+esc(f.text)+'</div>';
  if(f.type==='result') return '<div class="result" data-r="'+f.r+'"></div>';
  if(f.type==='machine'){
    var opts = MACHINES.map(function(m){
      return '<option value="'+esc(m.brand+' '+m.model)+'"'+(V('machineId')===m.brand+' '+m.model?' selected':'')+'>'
        + esc(m.brand+' '+m.model+' · '+m.ton+'T')+'</option>';
    }).join('');
    return '<div class="field" style="grid-column:1/-1"><label>选择压铸机（选中后自动填充全部参数）</label>'
      + '<select class="inp" data-k="machineId">'+opts+'</select>'
      + '<div class="hint">设备库为参考数据，请按现场实际设备维护。</div></div>';
  }
  if(f.type==='table'){
    var body = (S.t[f.k]||[]).map(function(row,ri){ return renderRow(f,row,ri); }).join('');
    var head = f.cols.map(function(c){ return '<th'+(c.w?' style="min-width:'+c.w+'px"':'')+'>'+esc(c.t)+'</th>'; }).join('');
    return '<div data-tbl="'+f.k+'">'
      + '<div class="tbl-bar">'
      + (f.add?'<button class="btn sm" data-add="'+f.k+'">＋ 增行</button>':'')
      + '<span class="hint">共 <b id="cnt_'+f.k+'">'+(S.t[f.k]||[]).length+'</b> 行</span></div>'
      + '<div class="tbl-wrap"><table class="ed"><thead><tr>'+head+'<th style="width:42px">操作</th></tr></thead>'
      + '<tbody>'+body+'</tbody></table></div></div>';
  }
  if(f.type==='images'){
    return '<div class="field" style="grid-column:1/-1"><label>'+esc(f.t)+(f.max?'（最多 '+f.max+' 张）':'')+'</label>'
      + '<div class="imgs" data-img="'+f.k+'">'+renderThumbs(f.k)+'</div></div>';
  }
  if(f.type==='textarea'){
    return '<div class="field" style="grid-column:1/-1"><label>'+esc(f.t)+'</label>'
      + '<textarea class="inp" data-k="'+f.k+'" placeholder="'+(f.ph||'')+'">'+esc(v)+'</textarea></div>';
  }
  if(f.type==='select'){
    var o=(f.opt||[]).map(function(x){return '<option'+((String(x)===String(v))?' selected':'')+'>'+esc(x)+'</option>';}).join('');
    return '<div class="field"><label>'+esc(f.t)+'</label><select class="inp" data-k="'+f.k+'">'+o+'</select></div>';
  }
  var ro = f.ro?' readonly style="background:#f7f9fb;color:#c62828;font-weight:600"':'';
  return '<div class="field"><label>'+esc(f.t)+(f.u?' <span class="u">('+f.u+')</span>':'')+'</label>'
    + '<input class="inp" type="'+(f.type==='number'?'text':'text')+'" inputmode="decimal" data-k="'+f.k+'" value="'+esc(v)+'"'+ro+'></div>';
}
function renderRow(f,row,ri){
  var tds = f.cols.map(function(c){
    var val = row[c.k];
    var inner;
    if(c.type==='select'){
      inner = '<select class="inp" data-t="'+f.k+'" data-r="'+ri+'" data-c="'+c.k+'">'
        + (c.opt||[]).map(function(x){return '<option'+((String(x)===String(val))?' selected':'')+'>'+esc(x)+'</option>';}).join('')
        + '</select>';
    }else{
      inner = '<input class="inp" data-t="'+f.k+'" data-r="'+ri+'" data-c="'+c.k+'" value="'+esc(val)+'"'
        + (c.type==='number'?' inputmode="decimal" style="text-align:right"':'') + '>';
    }
    return '<td>'+inner+'</td>';
  }).join('');
  return '<tr>'+tds+'<td style="text-align:center"><button class="btn sm dg" data-del="'+f.k+'" data-ri="'+ri+'">✕</button></td></tr>';
}
function renderThumbs(k){
  var arr = S.i[k]||[];
  var h = arr.map(function(src,i){
    return '<div class="thumb"><img src="'+src+'" alt=""><button class="del" data-delimg="'+k+'" data-idx="'+i+'">✕</button></div>';
  }).join('');
  h += '<label class="add">＋ 上传图片<input type="file" accept="image/*" multiple data-up="'+k+'" style="display:none"></label>';
  return h;
}

/* ---------- 事件绑定（事件委托） ---------- */
function bindMain(){
  var main = $('#main');
  main.addEventListener('input', function(e){
    var el=e.target;
    if(el.hasAttribute && el.hasAttribute('data-k')){
      S.f[el.getAttribute('data-k')] = el.value;
      onChanged(el.getAttribute('data-k'));
    }else if(el.hasAttribute && el.hasAttribute('data-c')){
      var t=el.getAttribute('data-t'), r=+el.getAttribute('data-r'), c=el.getAttribute('data-c');
      if(S.t[t] && S.t[t][r]) S.t[t][r][c]=el.value;
      save(); renderResults();
    }
  });
  main.addEventListener('change', function(e){
    var el=e.target;
    if(el.hasAttribute && el.hasAttribute('data-k')){
      S.f[el.getAttribute('data-k')] = el.value; onChanged(el.getAttribute('data-k'));
    }else if(el.hasAttribute && el.hasAttribute('data-c')){
      var t=el.getAttribute('data-t'), r=+el.getAttribute('data-r'), c=el.getAttribute('data-c');
      if(S.t[t] && S.t[t][r]) S.t[t][r][c]=el.value;
      save(); renderResults();
    }else if(el.hasAttribute && el.hasAttribute('data-up')){
      handleUpload(el);
    }
  });
  main.addEventListener('click', function(e){
    var el=e.target.closest?e.target.closest('[data-add],[data-del],[data-delimg],.thumb img'):null;
    if(!el) return;
    if(el.hasAttribute('data-add')){
      var k=el.getAttribute('data-add');
      var fld=findTableField(k); var row={};

/* ---------- 图片上传（压缩后存 base64，避免 localStorage 超限） ---------- */
var IMG_MAXW = 1280, IMG_Q = 0.72;
function handleUpload(input){
  var k = input.getAttribute('data-up');
  var files = Array.prototype.slice.call(input.files||[]);
  if(!files.length) return;
  var fld = findImagesField(k);
  var max = (fld&&fld.max)||6;
  files.forEach(function(file){
    compressImage(file, function(dataUrl){
      if(S.i[k].length>=max){ toast('最多 '+max+' 张，已忽略多余图片'); return; }
      S.i[k].push(dataUrl); refreshThumbs(k); save();
    });
  });
  input.value='';
}
function findImagesField(k){
  var found=null;
  MODULES.forEach(function(m){ m.groups.forEach(function(g){ g.fields.forEach(function(f){ if(f.k===k) found=f; }); }); });
  return found;
}
function compressImage(file, cb){
  var fr = new FileReader();
  fr.onload = function(e){
    var im = new Image();
    im.onload = function(){
      var w=im.width, h=im.height;
      if(w>IMG_MAXW){ h = Math.round(h*IMG_MAXW/w); w = IMG_MAXW; }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      var ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg', IMG_Q));
    };
    im.onerror=function(){ cb(e.target.result); };
    im.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

/* =========================================================================
 *  2.2 胀型力 / 锁模力
 *  单位换算：1 MPa × 1 cm² = 100 N = 0.1 kN
 * ========================================================================= */
function calcForce(){
  var P=N('castP'), cav=Math.max(1,N('cav'));
  var aProd=(N('aPart')+N('aRunner')+N('aOver'))*cav;   // 产品+流道+渣包 总投影 cm²
  var aSl=N('aSlider');                                  // 滑块投影 cm²
  var fProd=P*aProd/10;                                  // 产品胀型力 kN
  var fSl=P*aSl/10;                                      // 滑块胀型力 kN
  var fTot=fProd+fSl;                                    // 总胀型力 kN
  var mach=curMachine();
  var lock=N('lockKN')||mach.lock;                       // 设备锁模力 kN
  var limit=N('useRatio')||85;
  var ratio=lock?fTot/lock*100:0;
  var needLock=limit?fTot/(limit/100):0;                 // 满足利用率上限所需的最小锁模力
  return {P:P,cav:cav,aProd:aProd,aSl:aSl,aTot:aProd+aSl,
    fProd:fProd,fSl:fSl,fTot:fTot,fTotT:fTot*KN_TON,
    lock:lock,limit:limit,ratio:ratio,needLock:needLock,mach:mach,
    ok: ratio<=limit && ratio>0};
}
function rForce(){
  var c=calcForce();
  if(!c.aTot) return '<h4>胀型力 / 锁模力校核</h4><div class="hint">请先在 2.1 / 2.2 中填写投影面积与铸造压力。</div>';
  var st = c.ratio<=c.limit?'ok':(c.ratio<=95?'warn':'bad');
  return '<h4>胀型力 / 锁模力校核 <span class="st">'+pill(st,(c.ok?'满足':'超出')+' · 利用率 '+fmt(c.ratio,1)+'%')+'</span></h4>'
   + KV([
      {k:'产品胀型力',   v:fmt(c.fProd,1), u:'kN', red:true},
      {k:'滑块胀型力',   v:fmt(c.fSl,1),   u:'kN', red:true},
      {k:'总胀型力',     v:fmt(c.fTot,1),  u:'kN', red:true},
      {k:'总胀型力',     v:fmt(c.fTotT,1), u:'吨', red:true},
      {k:'总投影面积',   v:fmt(c.aTot,1),  u:'cm²'},
      {k:'设备锁模力',   v:fmt(c.lock,0),  u:'kN'},
      {k:'锁模力利用率', v:fmt(c.ratio,1), u:'%', red:true},

     ])
   + ROT(['项目','产品+流道+渣包','滑块','合计'],[
      ['投影面积 cm²', fmt(c.aProd,1), fmt(c.aSl,1), {t:fmt(c.aTot,1),hi:true}],
      ['胀型力 kN',    fmt(c.fProd,1), fmt(c.fSl,1), {t:fmt(c.fTot,1),hi:true}],
      ['胀型力 吨',    fmt(c.fProd*KN_TON,1), fmt(c.fSl*KN_TON,1), {t:fmt(c.fTotT,1),hi:true}]
     ])
   + verdict(c.ok?'ok':(st==='warn'?'warn':'bad'),
      c.ok? '🟢 设备锁模力满足要求（利用率 '+fmt(c.ratio,1)+'% ≤ '+fmt(c.limit,0)+'%）。建议实际生产比压不超过 '+fmt(c.P,0)+' MPa。'
      : (st==='warn'
        ? '🟡 锁模力利用率 '+fmt(c.ratio,1)+'%，已超过 '+fmt(c.limit,0)+'% 的建议上限，余量偏小：建议降低铸造比压至 '+fmt(c.P*c.limit/Math.max(c.ratio,0.01),0)+' MPa，或评估更大吨位机型。'
        : '🔴 锁模力不足：所需最小锁模力 '+fmt(c.needLock,0)+' kN，当前 '+fmt(c.lock,0)+' kN。建议改用更大吨位机型（当前参考机型 '+esc(c.mach.brand+' '+c.mach.model)+'）。'));
}

/* =========================================================================
 *  2.3 哥林柱受力分布与平衡度
 *  Rᵢ = F/4 × (1 ± 2ex/Bx ± 2ey/By)（刚性模板 + 四角对称支撑假定）
 * ========================================================================= */
function calcTieBar(){
  var f=calcForce();
  var F=f.fTot;                                   // kN
  var Bx=N('tieX')||parseFloat((''+f.mach.tie).split('×')[0]);
  var By=N('tieY')||parseFloat((''+f.mach.tie).split('×')[1])||Bx;
  var ex=N('exOff'), ey=N('eyOff');
  var q=F/4;
  var bars=[
    {n:'左上 (−x, +y)', s:[-1, 1]},
    {n:'右上 (+x, +y)', s:[ 1, 1]},
    {n:'左下 (−x, −y)', s:[-1,-1]},
    {n:'右下 (+x, −y)', s:[ 1,-1]}
  ].map(function(b){
    var r = q*(1 + b.s[0]*2*ex/Bx + b.s[1]*2*ey/By);
    return {n:b.n, s:b.s, r:r, t:r*KN_TON, pct:F?r/F*100:0};
  });
  var rs=bars.map(function(b){return b.r;});
  var fmax=Math.max.apply(null,rs), fmin=Math.min.apply(null,rs);
  var avg=F/4;
  var bal=avg?(fmax-fmin)/avg*100:0;              // 平衡度
  var dia=N('tieDia')||f.mach.tieDia;
  var area=Math.PI*dia*dia/4;                     // mm²
  var stressMax=area?fmax*1000/area:0;            // MPa
  return {F:F,Bx:Bx,By:By,ex:ex,ey:ey,bars:bars,fmax:fmax,fmin:fmin,avg:avg,bal:bal,
    dia:dia,area:area,stressMax:stressMax,pMax2:N('pMax2')||f.P,
    limit:N('useRatio')||85,
    ok: bal<=10, warn: bal<=20};
}
function rTieBar(){
  var c=calcTieBar();
  var st = c.bal<=10?'ok':(c.bal<=20?'warn':'bad');
  var neg = c.bars.some(function(b){return b.r<0;});
  return '<h4>哥林柱受力分布与平衡度 <span class="st">'+pill(st,'平衡度 '+fmt(c.bal,1)+'%')+'</span></h4>'
   + KV([
      {k:'最大铸造比压', v:fmt(c.pMax2,0), u:'MPa'},
      {k:'总胀型力 F',   v:fmt(c.F,1),     u:'kN', red:true},
      {k:'单柱平均受力', v:fmt(c.avg,1),   u:'kN'},
      {k:'最大单柱受力', v:fmt(c.fmax,1),  u:'kN', red:true},
      {k:'最小单柱受力', v:fmt(c.fmin,1),  u:'kN', red:true},
      {k:'受力平衡度',   v:fmt(c.bal,1),   u:'%', red:true},
      {k:'哥林柱直径',   v:fmt(c.dia,0),   u:'mm'},
      {k:'最大拉应力',   v:fmt(c.stressMax,1), u:'MPa', red:true}
     ])
   + ROT(['哥林柱位置','坐标 (±Bx/2, ±By/2)','受力 kN','受力 吨','占比 %'],
      c.bars.map(function(b){
        return [b.n, '('+(b.s[0]>0?'+':'−')+fmt(c.Bx/2,0)+', '+(b.s[1]>0?'+':'−')+fmt(c.By/2,0)+')',
                {t:fmt(b.r,1),n:1,hi:Math.abs(b.r-c.fmax)<0.01}, {t:fmt(b.t,2),n:1}, {t:fmt(b.pct,1),n:1}];
      }))
   + verdict(neg?'bad':(st==='ok'?'ok':(st==='warn'?'warn':'bad')),
      neg? '🔴 出现负反力（单柱卸载甚至出现张口趋势），必须调整：① 将铸件/流道向模具中心偏移，减小形心偏移 ex/ey；② 增加对称流道或工艺平衡块；③ 改用更大吨位机型。'
      : (st==='ok' ? '🟢 四柱受力平衡度 '+fmt(c.bal,1)+'% ≤ 10%，偏载小，模具与哥林柱受力均匀。'
        : (st==='warn' ? '🟡 平衡度 '+fmt(c.bal,1)+'%（10% ~ 20%），存在一定偏载。建议优化浇注位置：将形心偏移控制在 ±'+fmt(Math.min(c.Bx,c.By)*0.04,0)+' mm 以内，并加强定模板刚度。'
          : '🔴 平衡度 '+fmt(c.bal,1)+'% > 20%，偏载严重，易造成飞料、哥林柱早期疲劳与模具偏磨。必须重新布置型腔/流道，必要时采用偏心浇口或增加平衡块。')));
}

/* =========================================================================
 *  3.1 包紧力  F = K·A·P·(η·cosα − sinα)/10000  (吨)
 *      A 单位 mm²；K 为安全系数；η 为合金与模具间摩擦系数
 * ========================================================================= */
function holdF(A, alphaDeg, K, P, eta){
  var a = alphaDeg*Math.PI/180;
  var k = eta*Math.cos(a) - Math.sin(a);
  if(k<0) k=0;                                  // 斜度过大时无包紧力
  return K*A*P*k/10000;                         // 吨(tf)，1 tf ≈ 10 kN
}
function calcHold(){
  var K=N('kHold')||1.1, P=N('pHold')||10, eta=N('etaHold')||0.25;
  var fd=holdF(N('aDyn'), N('alpDyn'), K, P, eta);
  var ff=holdF(N('aFix'), N('alpFix'), K, P, eta);
  return {K:K,P:P,eta:eta,aDyn:N('aDyn'),aFix:N('aFix'),fd:fd,ff:ff,sum:fd+ff,
    ratio: ff?fd/ff:0};
}
function rHold(){
  var c=calcHold();
  if(!c.aDyn && !c.aFix) return '<h4>包紧力计算</h4><div class="hint">请填写动/定模侧包紧面积。</div>';
  var dynBig = c.fd>=c.ff;
  return '<h4>包紧力计算 <span class="st">'+pill(dynBig?'ok':'bad', dynBig?'动模侧包紧力更大 · 分型合理':'动模侧偏小 · 需调整')+'</span></h4>'
   + KV([
      {k:'动模侧包紧面积', v:fmt(c.aDyn,0), u:'mm²'},
      {k:'定模侧包紧面积', v:fmt(c.aFix,0), u:'mm²'},
      {k:'动模侧包紧力',   v:fmt(c.fd,2),  u:'吨', red:true},
      {k:'定模侧包紧力',   v:fmt(c.ff,2),  u:'吨', red:true},
      {k:'包紧力合计',     v:fmt(c.sum,2), u:'吨', red:true},
      {k:'动/定模包紧力比', v:fmt(c.ratio,2), red:true}
     ])
   + verdict(dynBig?'ok':'bad',
      dynBig
      ? '🟢 分型面结论：动模侧包紧力（'+fmt(c.fd,2)+' 吨）≥ 定模侧（'+fmt(c.ff,2)+' 吨），开模后铸件将可靠地留在动模侧，由顶杆顶出，分型方案合理。'
      : '🔴 分型面结论：定模侧包紧力（'+fmt(c.ff,2)+' 吨）大于动模侧（'+fmt(c.fd,2)+' 吨），铸件有粘定模风险。修改方案：① 减小定模侧拔模斜度或减小定模包紧面积；② 在动模侧增加粘模槽/拉钩/倒扣包紧结构；③ 调整分型线，将更多包紧结构置于动模侧；④ 定模设置定模顶出或气动辅助脱模。');
}

/* =========================================================================
 *  3.2 顶杆顶出力与规格选型
 * ========================================================================= */
function calcEject(){
  var h=calcHold();
  var safe=N('ejSafe')||1.2, stress=N('ejStress')||50;
  var d=N('ejDia')||10;
  var A=Math.PI*d*d/4;                      // 单根顶杆截面积 mm²
  var f1=stress*A;                          // 单根许用顶出力 N
  var fNeed=h.fd*safe*TON_N;                // 所需总顶出力 N（动模侧包紧力 × 安全系数）
  var nNeed=Math.ceil(fNeed/f1);            // 所需根数（向上取整）
  var zones=Math.max(1,Math.round(N('ejZone')||1));
  var perZone=Math.ceil(nNeed/zones);       // 每区根数（向上取整）
  var nRec=perZone*zones;                   // 推荐总数（对称布置）
  var cap=N('ejSpace');
  return {h:h,safe:safe,stress:stress,d:d,A:A,f1:f1,f1T:f1*N_TON,fNeed:fNeed,fNeedT:h.fd*safe,
    nNeed:nNeed,zones:zones,perZone:perZone,nRec:nRec,cap:cap,
    ok: !cap || nRec<=cap,
    spec: EJECT_SPEC.map(function(s){
      return {d:s.d,A:s.A,F:s.F,ton:stress*s.A*N_TON,n:s.A?Math.ceil(fNeed/(stress*s.A)):0,boss:s.boss,mark:s.mark};
    })};
}

      c.ok
      ? '🟢 顶出方案：选用 φ'+c.d+' 顶杆，共 '+c.nRec+' 根（'+c.zones+' 个分区，每区 '+c.perZone+' 根），总顶出力 '+fmt(c.nRec*c.f1T,2)+' 吨 ≥ 所需 '+fmt(c.fNeedT,2)+' 吨，满足要求。顶杆端面建议凹入产品表面 0~0.2 mm。'
      : '🔴 布置空间不足：推荐 '+c.nRec+' 根，可布置上限仅 '+c.cap+' 根。修改方案：① 增大顶杆直径至 φ'+(c.d<12?(c.d<10?10:12):12)+'（单根许用 '+fmt(c.stress*Math.PI*(c.d<10?100:(c.d<12?144:144))/4,0)+' N）；② 采用扁顶杆/顶块/顶管替代圆顶杆；③ 减小动模侧包紧面积或增大动模侧拔模斜度；④ 局部增加顶出板二次顶出结构。');
}

/* =========================================================================
 *  3.3 挤压销：V = L·h·w·a（a=6%），行程 d = V / 截面积
 * ========================================================================= */
function calcSqueeze(){
  var L=N('sqL'),h=N('sqH'),w=N('sqW'),a=N('sqA')/100||0.06;
  var V=L*h*w*a;                             // 需补偿/挤压体积 mm³
  var d=N('sqD');
  var As=Math.PI*d*d/4;                     // 挤压销截面积 mm²
  var stroke=As?V/As:0;                     // 挤压行程 mm
  var P=N('sqP')||80;
  var Fsq=P*As/1000;                        // 挤压力 kN（局部比压 × 销截面积）
  var mu=N('sqMu')||0.15, Lg=N('sqLg')||0;
  var Ffr=mu*P*Math.PI*d*Lg/1000;           // 导向段摩擦阻力 kN
  var Foth=0.3*Fsq;                         // 铝液凝固/背压附加阻力，按挤压力 30% 估
  var Fres=Ffr+Foth;                        // 总挤压阻力 kN
  var Ftot=Fsq+Fres;                        // 油缸需提供推力 kN
  var sysP=N('sqSysP')||16;
  var Dcyl=Math.sqrt(4*Ftot*1000/(Math.PI*sysP));   // 理论缸径 mm
  var Dstd=pickStd(CYL_STD,Dcyl);
  var Freal=sysP*Math.PI*Dstd*Dstd/4/1000;  // 标准缸径实际推力 kN
  var shrink=N('sqShrink');
  return {L:L,h:h,w:w,a:a,V:V,d:d,As:As,stroke:stroke,P:P,Fsq:Fsq,Ffr:Ffr,Foth:Foth,Fres:Fres,
    Ftot:Ftot,sysP:sysP,Dcyl:Dcyl,Dstd:Dstd,Freal:Freal,shrink:shrink,
    ratio: d?stroke/d:0,
    cover: shrink?V/shrink:0,
    ok: (stroke>0 && stroke<=50 && d && Dstd>0 && Freal>=Ftot)};
}
function rSqueeze(){
  var c=calcSqueeze();
  if(!c.V) return '<h4>挤压销计算</h4><div class="hint">请填写挤压区域尺寸 L / h / w 与挤压销直径。</div>';
  return '<h4>挤压销计算 <span class="st">'+pill(c.ok?'ok':'warn', c.ok?'方案可行':'需复核参数')+'</span></h4>'
   + KV([

      {k:'挤压销直径 d',    v:fmt(c.d,1),   u:'mm'},
      {k:'挤压销截面积',    v:fmt(c.As,2),  u:'mm²'},
      {k:'挤压行程',        v:fmt(c.stroke,2), u:'mm', red:true},
      {k:'挤压比压 P局',    v:fmt(c.P,0),   u:'MPa'},
      {k:'挤压力',          v:fmt(c.Fsq,2), u:'kN', red:true},

      {k:'附加背压阻力',    v:fmt(c.Foth,2),u:'kN'},
      {k:'挤压阻力合计',    v:fmt(c.Fres,2),u:'kN', red:true},
      {k:'油缸需推力',      v:fmt(c.Ftot,2),u:'kN', red:true},
      {k:'理论缸径',        v:fmt(c.Dcyl,1),u:'mm', red:true},
      {k:'选用标准缸径',    v:'∅'+c.Dstd,   u:'mm', red:true},
      {k:'标准缸实际推力',  v:fmt(c.Freal,2),u:'kN', red:true},

      + (c.Freal>=c.Ftot ? '≥' : '＜') + ' 所需 '+fmt(c.Ftot,1)+' kN，'
      + (c.Freal>=c.Ftot?'满足要求。':'推力不足，需加大缸径或提高系统压力。')
      + ' 行程 '+fmt(c.stroke,2)+' mm（行程/直径比 '+fmt(c.ratio,2)+'，'
      + (c.ratio<=3?'稳定性良好。':'长径比偏大，建议加大销径或减小挤压体积以防失稳。')+')'
      + (c.shrink ? (' 体积补偿率 V/V缩孔 = '+fmt(c.cover,2)
          + (c.cover >= 1 ? '，可覆盖缩孔。' : '，不足以覆盖缩孔，建议增大销径或增加挤压销数量。')) : '')
      + ' 结论：'+(c.ok?'可行，建议按此方案布置挤压销。':'需复核参数后再定案。'));

/* =========================================================================
 *  3.4 滑块油缸缸径：抽芯力 = K × 抽芯阻力（K=1.3）
 * ========================================================================= */
function calcSlider(){
  var A=N('slA'), alpha=N('slAlpha'), K=N('slK')||1.3;
  var Fres=holdF(A, alpha, N('kHold')||1.1, N('pHold')||10, N('etaHold')||0.25); // 抽芯阻力 吨
  var Fpull=K*Fres;                            // 抽芯力 吨
  var mu=N('slMu')||0.15;
  var Ffric=mu*Fres;                           // 导轨摩擦阻力 吨
  var Fneed=Fpull+Ffric;                       // 油缸需推力 吨
  var sysP=N('slSysP')||16;
  var Dcyl=Math.sqrt(4*Fneed*TON_N/(Math.PI*sysP));     // mm
  var Dstd=pickStd(CYL_STD,Dcyl);
  var Freal=sysP*Math.PI*Dstd*Dstd/4*N_TON;    // 标准缸实际推力 吨
  var num=Math.max(1,N('slNum')||1);
  return {A:A,alpha:alpha,K:K,Fres:Fres,Fpull:Fpull,Ffric:Ffric,Fneed:Fneed,
    sysP:sysP,Dcyl:Dcyl,Dstd:Dstd,Freal:Freal,num:num,stroke:N('slStroke'),
    ok: Dstd>0 && Freal>=Fneed};
}
function rSlider(){
  var c=calcSlider();

  return '<h4>滑块油缸缸径计算 <span class="st">'+pill(c.ok?'ok':'bad', c.ok?'缸径满足':'缸径不足')+'</span></h4>'

      + (c.Freal>=c.Fneed?'≥':'＜')+' 所需 '+fmt(c.Fneed,2)+' 吨，'

/* =========================================================================
 *  3.5 抽真空：Qv = V·ln(P₀/P₁)/t，S = Qv×3.6×泄漏系数，A阀 = Qv×1000/v
 * ========================================================================= */
function calcVacuum(){
  var dSleeve=N('vcSlvD'), lSleeve=N('vcSlvL');
  var vSleeve=Math.PI*dSleeve*dSleeve/4*lSleeve/1e6;        // 压室容积 L
  var V=N('vcCav')+N('vcRun')+vSleeve;                      // 总抽气容积 L
  var P0=1013, P1=Math.max(1,N('vcTarget')||50);
  var t=Math.max(0.05,N('vcTime')||1.5);
  var ln=Math.log(P0/P1);
  var Qv=V*ln/t;                                            // 平均抽气量 L/s
  var leak=N('vcLeak')||1.3;
  var S=Qv*3.6*leak;                                        // 所需泵抽速 m³/h
  var v=N('vcVel')||40;
  var Avalve=Qv*1000/v;                                     // 真空阀有效排气截面积 mm²
  var pump=N('vcPump');
  var tNeed=pump?V*ln*3.6*leak/pump:0;                      // 实际泵抽至目标真空所需时间 s
  var totalGas=V*ln;                                        // 总抽气量（等效容积×ln）L
  return {vSleeve:vSleeve,V:V,P0:P0,P1:P1,t:t,ln:ln,Qv:Qv,leak:leak,S:S,v:v,
    Avalve:Avalve,pump:pump,tNeed:tNeed,totalGas:totalGas,
    ok: (!pump || (pump>=S && tNeed<=t)) && Avalve>0};
}
function rVacuum(){
  var c=calcVacuum();
  if(!c.V) return '<h4>抽真空计算</h4><div class="hint">请填写型腔容积、压室尺寸等参数。</div>';
  return '<h4>抽真空计算 <span class="st">'+pill(c.ok?'ok':'warn', c.pump?(c.pump>=c.S?'真空能力满足':'真空能力不足'):'待填泵参数')+'</span></h4>'
   + KV([
      {k:'压室容积',       v:fmt(c.vSleeve,2), u:'L'},
      {k:'总抽气容积 V',   v:fmt(c.V,2), u:'L', red:true},
      {k:'目标真空度 P₁',  v:fmt(c.P1,0), u:'mbar'},
      {k:'ln(P₀/P₁)',      v:fmt(c.ln,3)},
      {k:'允许抽气时间',   v:fmt(c.t,2),  u:'s'},
      {k:'平均抽气量 Qv',  v:fmt(c.Qv,2), u:'L/s', red:true},
      {k:'所需泵抽速 S',   v:fmt(c.S,1),  u:'m³/h', red:true},
      {k:'真空阀排气截面积', v:fmt(c.Avalve,1), u:'mm²', red:true},
      {k:'总抽气量',       v:fmt(c.totalGas,2), u:'L', red:true},
      {k:'真空泵抽速（实选）', v:c.pump?fmt(c.pump,1):'—', u:'m³/h'},
      {k:'实际所需抽气时间', v:c.pump?fmt(c.tNeed,2):'—', u:'s', red:true}
     ])
   + verdict(c.ok?'ok':'warn',
      (c.pump
        ? '真空校核：实选泵 '+fmt(c.pump,1)+' m³/h '+(c.pump>=c.S?'≥':'＜')+' 所需 '+fmt(c.S,1)+' m³/h；'
          + '抽至 '+fmt(c.P1,0)+' mbar 需 '+fmt(c.tNeed,2)+' s '+(c.tNeed<=c.t?'≤':'＞')+' 允许 '+fmt(c.t,2)+' s。'
        : '尚未填写真空泵抽速，无法完成抽气时间校核。')
      + ' 真空阀有效排气截面积需 ≥ '+fmt(c.Avalve,1)+' mm²'
      + (N('vvArea')?('，当前单阀 '+fmt(N('vvArea'),1)+' mm² × '+fmt(N('vvNum')||1,0)+' 个 = '
          + fmt(N('vvArea')*(N('vvNum')||1),1)+' mm² '
          + ((N('vvArea')*(N('vvNum')||1))>=c.Avalve?'满足要求。':'不足，需增加阀数量或加大阀规格。')):'，请补充单阀截面积。')
      + ' 结论：'+(c.ok?'可行。':'需增大真空泵抽速或延长抽气时间/减小抽气容积。'));
}

/* =========================================================================
 *  3.6 冷却：Q总 = C铝·M·ΔT + M·凝固潜热
 * ========================================================================= */
function calcCool(){
  var M=N('cwM')||(N('wCast')+N('wRunner')+N('wOverflow'));
  var C=N('cwC')||1.05, L=N('cwL')||389, dT=N('cwDT')||80;
  var Qs=C*M*dT, Ql=M*L, Q=Qs+Ql;                  // 显热 / 潜热 / 总热量 kJ
  var phi=N('cwPhi')||0.6, dTw=Math.max(0.5,N('cwDTw')||8);
  var W=Q*phi/(4.187*dTw);                          // 需水量 kg ≈ L
  var tAllow=N('cwTime');
  var flowNeed=tAllow?W/tAllow*60:0;                // 所需流量 L/min
  var flowAct=N('cwFlow');
  var tAct=flowAct?W/flowAct*60:0;                  // 实际冷却时间 s
  return {M:M,C:C,L:L,dT:dT,Qs:Qs,Ql:Ql,Q:Q,phi:phi,dTw:dTw,W:W,
    tAllow:tAllow,flowNeed:flowNeed,flowAct:flowAct,tAct:tAct,
    ok: (tAllow&&flowAct)?(tAct<=tAllow):true,
    ok2: (!flowAct||!tAllow)?true:(flowNeed<=flowAct)};
}
function rCool(){
  var c=calcCool();
  if(!c.M) return '<h4>冷却水计算</h4><div class="hint">请填写每次浇注金属量（由 2.1 自动带出）。</div>';
  var st = (c.tAllow&&c.flowAct)?(c.tAct<=c.tAllow?'ok':'bad'):'warn';
  return '<h4>冷却水量与冷却时间校核 <span class="st">'+pill(st, st==='ok'?'节拍满足':(st==='bad'?'冷却时间不足':'待填节拍/流量'))+'</span></h4>'
   + KV([
      {k:'每次浇注金属量 M', v:fmt(c.M,3), u:'kg'},
      {k:'显热 Q₁ = C·M·ΔT', v:fmt(c.Qs,0), u:'kJ'},
      {k:'潜热 Q₂ = M·L',     v:fmt(c.Ql,0), u:'kJ'},
      {k:'总热量 Q总',        v:fmt(c.Q,0),  u:'kJ', red:true},
      {k:'水冷分配系数 φ',    v:fmt(c.phi,2)},
      {k:'冷却水温升 Δt',     v:fmt(c.dTw,1),u:'K'},
      {k:'需水量 W',          v:fmt(c.W,1),  u:'L', red:true},
      {k:'节拍允许冷却时间',  v:c.tAllow?fmt(c.tAllow,0):'—', u:'s'},
      {k:'所需水流量',        v:c.flowNeed?fmt(c.flowNeed,1):'—', u:'L/min', red:true},
      {k:'实际设计水流量',    v:c.flowAct?fmt(c.flowAct,1):'—', u:'L/min'},
      {k:'实际所需冷却时间',  v:c.tAct?fmt(c.tAct,1):'—', u:'s', red:true}
     ])
   + verdict(st==='ok'?'ok':(st==='bad'?'bad':'warn'),
      '热平衡：需带走总热量 '+fmt(c.Q,0)+' kJ（其中潜热占比 '+fmt(c.Ql/Math.max(c.Q,1)*100,0)+'%），'
      + '按 '+fmt(c.phi*100,0)+'% 由冷却水带走、温升 '+fmt(c.dTw,1)+' K 计，需水量 '+fmt(c.W,1)+' L。'
      + (c.tAllow&&c.flowAct
        ? (' 实际水流量 '+fmt(c.flowAct,1)+' L/min 下所需冷却时间 '+fmt(c.tAct,1)+' s '
           + (c.tAct<=c.tAllow?'≤':'＞')+' 节拍允许 '+fmt(c.tAllow,0)+' s，'
           + (c.tAct<=c.tAllow?'节拍满足要求。':'冷却时间不足：建议加大水流量至 '+fmt(c.flowNeed,1)+' L/min，或对厚大热节增加点冷/局部高压冷却。'))
        : ' 请补充节拍允许冷却时间与实际设计水流量以完成校核。'));
}

/* =========================================================================
 *  5.3 压射系统参数
 * ========================================================================= */
function calcInject(){
  var D=N('injD'), Ag=N('injAg'), vol=N('injVol'), t=N('injT');
  var Ap=Math.PI*D*D/4;                        // 冲头面积 mm²
  var R=Ag?Ap/Ag:0;                            // 速率比
  var Q=vol&&t?vol*1000/t:0;                   // 体积流量 mm³/s
  var QL=Q/1e6;                                // L/s
  var vg=Ag?Q/Ag/1000:0;                       // 内浇口速度 m/s
  var vp=Ap?Q/Ap/1000:0;                       // 快压射速度 m/s
  var m=curMachine();
  var v0=m.v0||6;
  return {D:D,Ap:Ap,Ag:Ag,R:R,vol:vol,t:t,Q:Q,QL:QL,vg:vg,vp:vp,v0:v0,
    okVp: vp>0 && vp<=v0*0.8, mach:m};
}
function rInject(){
  var c=calcInject();
  if(!c.Ap||!c.Ag) return '<h4>压射系统参数</h4><div class="hint">请填写冲头直径与内浇口面积。</div>';
  // 按壁厚推荐内浇口速度区间
  var wall=N('wall'); var rec=null;
  GATE_SPEED_TABLE.forEach(function(r){
    var lo=parseFloat(r[0])||0;
    if(wall>=lo) rec=r;
  });
  if(!rec) rec=GATE_SPEED_TABLE[0];
  var rng=rec[1].split('~').map(function(x){return parseFloat(x);});
  var st = (c.vg>=rng[0]&&c.vg<=rng[1])&&c.okVp?'ok':'warn';
  return '<h4>压射系统参数 <span class="st">'+pill(st, st==='ok'?'参数匹配':'需复核')+'</span></h4>'
   + KV([
      {k:'冲头直径',     v:fmt(c.D,0),   u:'mm'},
      {k:'冲头面积 A冲', v:fmt(c.Ap,1),  u:'mm²'},
      {k:'内浇口面积 A内', v:fmt(c.Ag,1),u:'mm²'},
      {k:'速率比 R = A冲/A内', v:fmt(c.R,2), red:true},
      {k:'型腔体积',     v:fmt(c.vol,1), u:'cm³'},
      {k:'填充时间',     v:fmt(c.t,3),   u:'s'},
      {k:'体积流量 Q',   v:fmt(c.QL,2),  u:'L/s', red:true},
      {k:'内浇口速度 v_g', v:fmt(c.vg,1),u:'m/s', red:true},
      {k:'快压射速度 v_p', v:fmt(c.vp,2),u:'m/s', red:true},
      {k:'设备空压射速度', v:fmt(c.v0,1),u:'m/s'},
      {k:'壁厚',         v:fmt(wall,1),  u:'mm'},
      {k:'推荐内浇口速度', v:rec[1],     u:'m/s'}
     ])
   + verdict(st==='ok'?'ok':'warn',
      '速率比 R = A冲/A内 = '+fmt(c.R,2)+'（内浇口速度为压射速度的 '+fmt(c.R,1)+' 倍，常规区间 8 ~ 25）。内浇口速度 '+fmt(c.vg,1)+' m/s，'
      + (wall?('壁厚 '+fmt(wall,1)+' mm 对应推荐区间 '+rec[1]+' m/s，'+(c.vg>=rng[0]&&c.vg<=rng[1]?'处于推荐区间内。':'偏离推荐区间，建议调整内浇口面积至 '+fmt(c.Q/(Math.max((rng[0]+rng[1])/2,0.1)*1000),1)+' mm²。')):'')
      + ' 快压射速度 '+fmt(c.vp,2)+' m/s '+(c.okVp?'≤':'＞')+' 设备空压射速度的 80%（'+fmt(c.v0*0.8,2)+' m/s），'
      + (c.okVp?'压射能力可满足。':'需提高压射能力或增大冲头直径/延长填充时间。'));
}

/* =========================================================================
 *  5.6 PQ² 工艺窗口
 *  机器特性线：P = Pmax · (1 − (Q/Qmax)²)
 * ========================================================================= */
function calcPQ2(){
  var c=calcInject();
  var m=curMachine();
  var injF=N('injForce')||m.injForce;          // 压射力 kN
  var Pmax=c.Ap?injF*1000/c.Ap:0;              // 理论最大比压 MPa
  var Qmax=c.Ap?c.Ap*m.v0/1000:0;              // 最大流量 L/s（空压射速度 × 冲头面积）
  var Q=c.QL, Pneed=N('injIntP');              // 工艺点
  var Pline=Pmax*(1-Math.pow(Qmax?Q/Qmax:0,2));// 机器线在该流量下的可用比压
  var margin=Pline?(Pline-Pneed)/Pline*100:0;
  var pts=[];
  for(var i=0;i<=5;i++){
    var qq=Qmax*i/5;
    pts.push([fmt(qq,1), fmt(Pmax*(1-Math.pow(i/5,2)),1)]);
  }
  return {c:c,m:m,injF:injF,Pmax:Pmax,Qmax:Qmax,Q:Q,Pneed:Pneed,Pline:Pline,
    margin:margin,pts:pts, ok: Q<Qmax && Pline>=Pneed, good: Q<Qmax && Pline>=Pneed*1.15};
}
function rPQ2(){
  var p=calcPQ2();
  if(!p.Qmax||!p.Q) return '<h4>PQ² 工艺窗口</h4><div class="hint">请先在 5.3 填写冲头直径、内浇口面积、型腔体积与填充时间。</div>';
  return '<h4>PQ² 工艺窗口与设备匹配 <span class="st">'+pill(p.ok?'ok':'bad', p.good?'窗口充足':(p.ok?'余量偏小':'窗口不足'))+'</span></h4>'
   + KV([
      {k:'机型',          v:p.m.brand+' '+p.m.model, u:p.m.ton+'T'},
      {k:'压射力',        v:fmt(p.injF,0), u:'kN'},
      {k:'理论最大比压 Pmax', v:fmt(p.Pmax,1), u:'MPa', red:true},
      {k:'最大流量 Qmax', v:fmt(p.Qmax,1), u:'L/s', red:true},
      {k:'工艺点流量 Q',  v:fmt(p.Q,2),  u:'L/s', red:true},
      {k:'需求比压 P',    v:fmt(p.Pneed,1),u:'MPa', red:true},
      {k:'机器线可用比压', v:fmt(p.Pline,1),u:'MPa', red:true},
      {k:'压力余量',      v:fmt(p.margin,1),u:'%', red:true},
      {k:'流量占用率',    v:fmt(p.Q/p.Qmax*100,1), u:'%', red:true}
     ])
   + '<h4 style="margin-top:12px">机器特性线采样（P = Pmax·(1−(Q/Qmax)²)）</h4>'
   + ROT(['流量 Q (L/s)','可用比压 P (MPa)'], p.pts.map(function(x){return [{t:x[0],n:1},{t:x[1],n:1}];}))
   + verdict(p.ok?'ok':'bad',
      'PQ² 结论：工艺点 (Q='+fmt(p.Q,2)+' L/s, P='+fmt(p.Pneed,1)+' MPa) '
      + (p.good?'位于机器特性线下方且有 '+fmt(p.margin,1)+'% 压力余量（≥ 15%），设备匹配良好。':(p.ok?'位于机器特性线下方，但压力余量仅 '+fmt(p.margin,1)+'%（< 15%），可行但余量偏小，建议预留工艺调整空间。'
        : '已超出可用窗口（机器线可用 '+fmt(p.Pline,1)+' MPa，需求 '+fmt(p.Pneed,1)+' MPa）。'))
      + ' 优化方向：'+(p.ok
        ? '可按当前参数试模，建议填充时间控制在 '+fmt(p.c.t,3)+'±0.01 s，慢压射 '+fmt(N('injSlow'),2)+' m/s。'
        : '① 增大冲头直径以提高流量能力；② 降低需求比压（增大内浇口面积）；③ 换用更大压射力机型；④ 延长填充时间以减小瞬时流量。'));
}

function rMachList(){
  var rows=MACHINES.map(function(m){
    var sel = (m.brand+' '+m.model)===V('machineId');
    return [m.brand, m.model, {t:fmt(m.ton,0),n:1}, {t:fmt(m.lock,0),n:1}, {t:fmt(m.open,0),n:1},
      fmt(m.moldMin,0)+'~'+fmt(m.moldMax,0), m.tie, {t:fmt(m.tieDia,0),n:1}, {t:fmt(m.injForce,0),n:1},
      m.punch.join('/'), {t:fmt(m.v0,1),n:1}, {t:fmt(m.ejForce,0),n:1},
      sel?'● 已选':''];
  });
  return '<h4>压铸机参数库对照表</h4>'
   + ROT(['品牌','型号','吨位 T','锁模力 kN','开模行程 mm','容模量 mm','哥林柱间距 mm','柱径 mm',
          '压射力 kN','冲头直径 mm','空压射 m/s','顶出力 kN','选中'], rows);
}
function rGateSpeed(){
  return ROT(['铸件壁厚 mm','内浇口速度 m/s','说明'],
    GATE_SPEED_TABLE.map(function(r){ return [r[0], {t:r[1],hi:true}, r[2]]; }));
}

  });
}

function T(k, d){ var v = V(k); return (v === '' || v === null || v === undefined) ? (d === undefined ? '—' : d) : String(v); }
function stripTags(s){
  return String(s||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&nbsp;/g,' ');
}
/* 复用界面计算结论：抽取 verdict 文本，保证界面与 PPT 完全一致 */
function verdictOf(fn){
  try{
    var h = fn();
    var m = h.match(/<div class="verdict[^"]*">([\s\S]*?)<\/div>/);
    return m ? stripTags(m[1]) : '';
  }catch(e){ return ''; }
}
/* ----- "拓普"水印：白色背景 + 重复斜向灰字水印 + 右上 LOGO ----- */
function _addWatermark(slide){
  // 三行×三列 共 9 个"拓普"，轻微旋转形成均匀斜向水印
  var W = PW, H = PH, txt = '拓普';
  var rows = [{y:0.7, xOff:-1.0}, {y:2.2, xOff:0.3}, {y:3.7, xOff:-0.7}, {y:5.0, xOff:0.5}];
  var cols = [-0.8, 2.4, 5.6, 8.8];
  var i = 0;
  rows.forEach(function(r){
    cols.forEach(function(cx){
      var x = cx + r.xOff;
      if(x < -1.5 || x > W + 0.5) return;
      // 偶数索引文字正向，奇数索引旋转，营造交错感
      var rotate = (i % 2 === 0) ? -18 : 18;
      slide.addText(txt, {
        x:x, y:r.y, w:3.2, h:1.2,
        fontSize:46, color:'EAEEF3', bold:true,
        fontFace:FONT, align:'center', valign:'middle',
        rotate:rotate, transparency:60
      });
      i++;
    });
  });
}
function defineMaster(pptx){
  pptx.defineSlideMaster({
    title:'DFM_MASTER',
    background:{color:'FFFFFF'},
    objects:[
      // 右上角小 LOGO
      {image:{data:(S.i['logoImg']&&S.i['logoImg'][0])||DEFAULT_LOGO,
              x:8.55,y:0.12,w:1.30,h:0.36}}
    ],
    slideNumber:{x:9.10,y:5.35,w:0.55,h:0.22,fontSize:9,color:'8FA3BC',
                 align:'right',fontFace:FONT, transparency:30}
  });
}
function newSlide(pptx, title, sub, plain){
  var s = plain ? pptx.addSlide() : pptx.addSlide({masterName:'DFM_MASTER'});
  if(plain) return s;
  _addWatermark(s);
  // 主标题（深蓝大字）放在内容区上方
  if(title) s.addText(title, {x:0.35,y:0.10,w:7.8,h:0.46,fontSize:18,bold:true,
    color:'1F3A6F',fontFace:FONT,valign:'middle'});
  // 副标题（小字深蓝）
  if(sub) s.addText(sub, {x:0.35,y:0.58,w:9.3,h:0.26,fontSize:11,bold:true,
    color:C_DARK,fontFace:FONT});
  return s;
}
/* 通用表格：head 表头数组，rows 二维数组（元素可为字符串或 {t,hi,n}） */
function addTbl(s, head, rows, o){
  o = o || {};
  var fs = o.fs || 9;
  var data = [head.map(function(t){
    return {text:String(t), options:{fill:{color:C_TH},color:'FFFFFF',bold:true,fontSize:fs,
      align:'center',valign:'middle',margin:[2,4,2,4]}};
  })];
  rows.forEach(function(r){
    data.push(r.map(function(c){
      var isObj = (c && typeof c === 'object');
      var t = isObj ? c.t : c;
      var hi = isObj && c.hi;
      return {text:String(t === undefined || t === null ? '' : t),
        options:{fontSize:fs, color:hi?C_RED:'333333', bold:!!hi,
          align:(isObj && c.n)?'right':'left', valign:'middle', margin:[2,4,2,4]}};
    }));
  });
  var opt = {x:o.x===undefined?0.4:o.x, y:o.y, w:o.w||9.2, colW:o.colW,
    border:{type:'solid',pt:0.5,color:C_BD}, fontFace:FONT, fontSize:fs,
    color:'333333', valign:'middle', autoPage:false, fill:{color:'FFFFFF'}};
  if(o.rowH) opt.rowH = o.rowH;
  if(o.colW) opt.colW = o.colW;
  s.addTable(data, opt);
}
/* 关键指标表：items = [{k,v,u,red}]，两列成对排布 */
function addKV(s, items, x, y, w){
  var cw = [w*0.20, w*0.30, w*0.20, w*0.30];
  var data = [];
  for(var i=0;i<items.length;i+=2){
    var r = [];
    for(var j=0;j<2;j++){
      var it = items[i+j];
      if(!it){ r.push({text:'',options:{}}); r.push({text:'',options:{}}); continue; }
      r.push({text:String(it.k), options:{fill:{color:'EDF1F6'},bold:true,fontSize:8.5,color:'33475F',
        align:'left',valign:'middle',margin:[2,4,2,4]}});
      r.push({text:String(it.v) + (it.u ? (' ' + it.u) : ''),
        options:{fontSize:9.5, bold:true, color:it.red?C_RED:'222222', align:'left', valign:'middle', margin:[2,4,2,4]}});
    }
    data.push(r);
  }
  s.addTable(data, {x:x, y:y, w:w, colW:cw, border:{type:'solid',pt:0.5,color:C_BD},
    fontFace:FONT, valign:'middle', autoPage:false, fill:{color:'FFFFFF'}});
}
/* 结论条 */
function addVerdict(s, text, y, x, w){
  if(!text) return;
  s.addText(text, {x:x===undefined?0.4:x, y:y, w:w||9.2, h:0.8, fontSize:9.5, fontFace:FONT,
    color:'1F3A5F', fill:{color:'F2F5F9'}, line:{color:C_ORANGE,width:0.75}, valign:'top', margin:[4,6,4,6]});
}
/* 图片插入：最多 max 张横排；无图则画占位框 */
function addImgs(s, key, x, y, w, h, max){
  var arr = (S.i[key]||[]).slice(0, max||2);
  if(!arr.length){
    s.addShape('rect', {x:x,y:y,w:w,h:h, fill:{color:'F4F6F9'}, line:{color:C_BD,width:0.75,dashType:'dash'}});
    s.addText('图片占位', {x:x,y:y,w:w,h:h,fontSize:10,color:'9AA7B6',align:'center',valign:'middle',fontFace:FONT});
    return false;
  }
  var n = arr.length, gap = 0.12, iw = (w - gap*(n-1))/n;
  for(var i=0;i<n;i++) s.addImage({data:arr[i], x:x+i*(iw+gap), y:y, w:iw, h:h});
  return true;
}
/* 文本块（自动处理换行） */
function addBlock(s, title, text, x, y, w, h){
  s.addText(title, {x:x,y:y,w:w,h:0.24,fontSize:10,bold:true,color:C_DARK,fontFace:FONT,valign:'middle'});
  s.addShape('rect', {x:x, y:y+0.24, w:w, h:(h-0.24), fill:{color:'F7F9FB'}, line:{color:'DDE3EA',width:0.5}});
  s.addText(text||'—', {x:x+0.06,y:y+0.28,w:w-0.12,h:(h-0.32),fontSize:9,fontFace:FONT,
    color:'333333',valign:'top',margin:[3,4,3,4]});
}
function rowsOf(key, cols){
  return (S.t[key]||[]).map(function(r){ return cols.map(function(c){ return r[c]||''; }); });
}

function genPPT(){
  if(typeof PptxGenJS === 'undefined'){ toast('PptxGenJS 未加载，请检查网络'); return; }
  mask(true,'正在生成 PPT…');
  setTimeout(function(){
    try{ buildPPT(); }

  }, 60);
}

  (function(){

      x:3.6,y:0.35,w:2.8,h:0.78});

    // 三角透视设计：从底部两端向中央聚拢的多条对角线，形成建筑/塔尖透视
    var peakX = 5.0, peakY = 1.45;
    var baseY = PH + 0.3;        // 从画布下方略外侧开始
    var lineColor = 'D9DEE6';
    // 主峰左侧线条
    for(var i=0;i<=12;i++){
      var x = -0.5 + i * (peakX + 0.5) / 12;

        line:{color:lineColor, width:0.5}});

var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
    catch(e){
      // 超限时降级：去掉图片后仅保存表单数据
      try{
        var light = {f:S.f, t:S.t, i:{}};
        localStorage.setItem(LS_KEY, JSON.stringify(light));
        toast('存储超上限，已保存表单数据（图片未保存）');
      }catch(e2){ toast('本地存储失败：'+e2.message); }
    }
  }, 400);
}
function mergeState(o){
  initState();
  if(!o) return;
  if(o.f) Object.keys(o.f).forEach(function(k){ S.f[k]=o.f[k]; });
  if(o.t) Object.keys(o.t).forEach(function(k){ S.t[k]=o.t[k]; });
  if(o.i) Object.keys(o.i).forEach(function(k){ S.i[k]=o.i[k]; });
}
function exportJSON(){
  var blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'DFM_'+(V('partNo')||'Project')+'_'+(V('version')||'A0')+'.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast('已导出 JSON');
}
function importJSON(file){
  var fr = new FileReader();
  fr.onload = function(e){
    try{
      mergeState(JSON.parse(e.target.result));
      renderMain(); fillMachine(); recalcDerived(); renderResults(); save();
      toast('导入成功');
    }catch(err){ toast('导入失败：'+err.message); }
  };
  fr.readAsText(file);
}

function boot(){
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ saved = null; }
  mergeState(saved);
  if(!S.f.machineId) S.f.machineId = '力劲 LK DCC3000';
  renderNav();
  renderMain();
  fillMachine();
  recalcDerived();
  renderResults();
}

});
